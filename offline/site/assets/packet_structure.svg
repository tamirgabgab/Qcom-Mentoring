<svg xmlns="http://www.w3.org/2000/svg" width="730" height="296" viewBox="0 0 730 296" font-family="sans-serif" font-size="13">
<style>.box{fill:#dbe8ff;stroke:#1a5fb4;stroke-width:1.3}.hdr{fill:#c5d8ff}.par{fill:#e9ddf5}.dots{fill:#f3f6fb}.txt{fill:#1a1a1a;text-anchor:middle;font-family:monospace}.lbl{fill:#444}.bit{fill:#444;text-anchor:middle;font-family:monospace;font-size:12px}.ttl{fill:#1a1a1a;font-weight:bold;font-size:15px}.side{fill:#1a1a1a;font-size:14px}.brace{fill:none;stroke:#444;stroke-width:1.2}.note{fill:#555;font-size:12px}@media (prefers-color-scheme: dark){.box{fill:#1e3a66;stroke:#8ab4f8}.hdr{fill:#243f70}.par{fill:#3b2a52}.dots{fill:#2a2f3a}.txt,.ttl,.side{fill:#eee}.lbl,.bit{fill:#ccc}.brace{stroke:#ccc}.note{fill:#bbb}}</style>
<text class="ttl" x="90" y="22">Packet structure</text>
<text class="bit" x="105.6" y="40">7</text>
<text class="bit" x="136.9" y="40">6</text>
<text class="bit" x="168.1" y="40">5</text>
<text class="bit" x="199.4" y="40">4</text>
<text class="bit" x="230.6" y="40">3</text>
<text class="bit" x="261.9" y="40">2</text>
<text class="bit" x="293.1" y="40">1</text>
<text class="bit" x="324.4" y="40">0</text>
<rect class="box hdr" x="90.0" y="46" width="187.5" height="30"/>
<text class="txt" x="183.8" y="65.5">length</text>
<rect class="box hdr" x="277.5" y="46" width="62.5" height="30"/>
<text class="txt" x="308.8" y="65.5">addr</text>
<text class="lbl" x="350" y="65.5">byte 0</text>
<rect class="box" x="90" y="76" width="250" height="30"/>
<text class="txt" x="215.0" y="95.5">payload[0]</text>
<text class="lbl" x="350" y="95.5">byte 1</text>
<rect class="box" x="90" y="106" width="250" height="30"/>
<text class="txt" x="215.0" y="125.5">payload[1]</text>
<rect class="box dots" x="90" y="136" width="250" height="30"/>
<text class="txt" x="215.0" y="155.5">…</text>
<rect class="box" x="90" y="166" width="250" height="30"/>
<text class="txt" x="215.0" y="185.5">payload[N-1]</text>
<text class="lbl" x="350" y="185.5">byte N</text>
<rect class="box par" x="90" y="196" width="250" height="30"/>
<text class="txt" x="215.0" y="215.5">parity</text>
<text class="lbl" x="350" y="215.5">byte N+1</text>
<text class="side" x="435" y="65.5">Header</text>
<text class="side" x="435" y="215.5">Parity</text>
<path class="brace" d="M412,79 h8 v51.0 l6,6 l-6,6 v51.0 h-8"/>
<text class="side" x="436" y="141.0">Payload</text>
<text class="note" x="90" y="252">1 ≤ N ≤ 63 payload bytes · header = {length[5:0], addr[1:0]} · addr 3 is illegal</text>
<text class="note" x="90" y="270">parity = even bitwise parity (XOR) over the header and all payload bytes · packet = N + 2 bytes</text>
</svg>