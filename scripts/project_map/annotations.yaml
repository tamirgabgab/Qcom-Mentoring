  lab07_integ:    {label: "7",   page: labs/lab07.md,  title: "Integrating UVCs"}
  lab08_mcseq:    {label: "8",   page: labs/lab08.md,  title: "Multichannel sequences"}
  lab09_sba:      {label: "9A",  page: labs/lab09a.md, title: "Scoreboard (TLM)"}
  lab09_sbb:      {label: "9B",  page: labs/lab09b.md, title: "Router module UVC"}
  lab09_sbc:      {label: "9C",  page: labs/lab09c.md, title: "TLM exports"}
  lab09_sbd:      {label: "9D",  page: labs/lab09d.md, title: "Analysis FIFOs"}
  lab10_cov:      {label: "10",  page: labs/lab10.md,  title: "Functional coverage"}
  lab11a_rm_gen:  {label: "11A", page: labs/lab11a.md, title: "Register model generation"}
