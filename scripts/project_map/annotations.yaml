array_sizes:
  tb.hbus.masters: 1      # uvm_config_int::set(this, "hbus", "num_masters", 1) in router_tb
  tb.hbus.slaves: 0       # ... "num_slaves", 0 -- the router is the only slave

notes:
  tb.yapp.agent.driver:    "Built only when is_active == UVM_ACTIVE (set_config_test makes the agent passive)."
  tb.yapp.agent.sequencer: "Built only when is_active == UVM_ACTIVE."
  tb.hbus.masters[0]:      "num_masters = 1: one master agent. The DUT is the only slave (num_slaves = 0)."
  tb.chan0:                "channel_id = 0: the monitor checks that every packet carries address 0."
  tb.chan1:                "channel_id = 1."
  tb.chan2:                "channel_id = 2."
  tb.yapp_rm:              "Created with create(\"yapp_rm\") -- an object, not a component -- then build(), lock_model(), set_hdl_path_root(\"hw_top.dut.u_regs\")."
  tb.reg2hbus:             "Object owned by the testbench; passed to default_map.set_sequencer() together with the HBUS sequencer."
  tb.fifo_sb:              "Lab 9D variant: replaces router_module (reference + scoreboard) with one TLM-FIFO based scoreboard."

kinds:
  module:        {label: "Module",           doc: dut/rtl.md,                      role: "RTL: the design under test and the hardware side of the testbench"}
  interface:     {label: "Interface",        doc: components/driver.md,            role: "Signals plus the tasks that drive and sample them; reached through a virtual interface"}
  rtl_block:     {label: "RTL block",        doc: dut/rtl.md,                      role: "A functional block inside the DUT"}
  test:          {label: "Test",             doc: uvm/architecture.md,             role: "Builds the environment and picks the stimulus (default sequences, overrides)"}
  env:           {label: "Env",              doc: components/agent-env.md,         role: "Container: builds agents (or UVCs), configures and connects them"}
  agent:         {label: "Agent",            doc: components/agent-env.md,         role: "One interface: driver + sequencer (active) and monitor"}
  driver:        {label: "Driver",           doc: components/driver.md,            role: "Transaction -> pins, through the virtual interface"}
  sequencer:     {label: "Sequencer",        doc: components/sequences.md,         role: "Arbitrates sequences and hands items to the driver"}
  vsequencer:    {label: "Virtual sequencer", doc: components/virtual-sequencer.md, role: "Holds handles to other sequencers so one sequence can coordinate several interfaces"}
  monitor:       {label: "Monitor",          doc: components/monitor.md,           role: "Pins -> transaction; publishes on an analysis port; collects coverage"}
  scoreboard:    {label: "Scoreboard",       doc: components/scoreboard.md,        role: "Compares what came out with what was expected"}
  reference:     {label: "Reference model",  doc: components/reference-model.md,   role: "Predicts what the DUT should do"}
  component:     {label: "Component",        doc: uvm/big-picture.md,              role: "A uvm_component"}
  sequence:      {label: "Sequence",         doc: components/sequences.md,         role: "Generates transactions (or runs other sequences)"}
  sequence_item: {label: "Sequence item",    doc: components/packet.md,            role: "The transaction: random fields, constraints, utility methods"}
  object:        {label: "Object",           doc: uvm/big-picture.md,              role: "A uvm_object"}
  tlm_port:      {label: "Analysis port",    doc: uvm/tlm.md,                      role: "Producer side of a TLM connection: write() fans out to every connected imp"}
  tlm_export:    {label: "Export",           doc: uvm/tlm.md,                      role: "Forwards a connection into a component"}
  tlm_imp:       {label: "Analysis imp",     doc: uvm/tlm.md,                      role: "Consumer side: bound to a write_<suffix>() method"}
  tlm_fifo:      {label: "Analysis FIFO",    doc: uvm/tlm.md,                      role: "Buffers transactions so a consumer can get() them in its own thread"}
  get_port:      {label: "Get port",         doc: uvm/tlm.md,                      role: "Blocking get() from a FIFO"}
  seq_item_port: {label: "Sequence item port", doc: uvm/tlm.md,                    role: "Driver <-> sequencer handshake: get_next_item / item_done"}
  reg_block:     {label: "Register block",   doc: components/register-model.md,    role: "A group of registers and memories with an address map"}
  reg:           {label: "Register",         doc: components/register-model.md,    role: "Fields, access policy, reset value; front door and backdoor"}
  mem:           {label: "Memory",           doc: components/register-model.md,    role: "A memory region of the register model"}
  reg_adapter:   {label: "Register adapter", doc: components/register-model.md,    role: "Translates register operations into bus transactions"}
  enum:          {label: "Enum",             doc: components/packet.md,            role: "Enumerated type"}
  uvm_base:      {label: "UVM base class",   doc: uvm/big-picture.md,              role: "Part of the UVM library"}
  feature:       {label: "Feature group",    doc: test-plan.md,                    role: "A group of DUT features of the test plan, with the items that verify them"}

classes:
  # ---------------------------------------------------------------- YAPP UVC
  yapp_packet:
    summary: "The YAPP transaction: addr, length, payload, parity -- with constraints and parity helpers."
    description: |
      One packet on the YAPP input port: header `{length[5:0], addr[1:0]}`, `length`
      payload bytes, then an even-parity byte. `parity_type` (GOOD 5 : BAD 1) decides
      whether `set_parity()` corrupts the computed parity. `packet_delay` is the gap the
      driver waits before sending. Built in Lab 1, used everywhere after.
  short_yapp_packet:
    summary: "yapp_packet with length constrained to 1..15 -- substituted through the factory."
    description: |
      Only adds `c_short_length`. `short_packet_test` installs it with a type override, so
      every `yapp_packet::type_id::create()` in the sequences silently returns a short packet.
  yapp_tx_driver:
    summary: "Gets packets from the sequencer and drives them pin by pin through yapp_if."
    description: |
      `run_phase` resets the interface, waits for reset release, then loops
      `seq_item_port.get_next_item(req)` -> `vif.send_to_dut(...)` -> `item_done()`.
      All pin activity lives in the interface task; the driver only sequences it and
      records the transaction (`begin_tr`/`end_tr`).
  yapp_tx_sequencer:
    summary: "uvm_sequencer #(yapp_packet): arbitrates YAPP sequences for the driver."
  yapp_tx_monitor:
    summary: "Samples yapp_if on the rising edge, rebuilds packets, publishes them and collects coverage."
    description: |
      `collect_packets` runs forever: one new `yapp_packet` per packet, published on
      `item_collected_port` (Lab 9A) and sampled by `yapp_pkt_cg` (Lab 10). Counts packets
      and bad-parity packets; `num_bad_parity` is read by the register tests.
  yapp_tx_agent:
    summary: "Monitor always; driver + sequencer only when is_active == UVM_ACTIVE."
  yapp_env:
    summary: "The YAPP UVC's env: one tx agent."
  yapp_base_seq:
    summary: "Base of every YAPP sequence: raises/drops the objection of the starting phase."
  yapp_5_packets:   {summary: "Five random packets (`uvm_do`)."}
  yapp_1_seq:       {summary: "One random packet."}
  yapp_012_seq:     {summary: "Three packets to addresses 0, 1, 2 in order."}
  yapp_111_seq:     {summary: "Three packets to address 1."}
  yapp_repeat_addr_seq: {summary: "Two packets with the same random address."}
  yapp_incr_payload_seq: {summary: "One packet with payload 0,1,2,... and the parity recomputed afterwards."}
  yapp_rnd_seq:     {summary: "`count` random packets (default 5)."}
  six_yapp_seq:     {summary: "Six random packets -- a sequence that runs another sequence (`uvm_do` of yapp_5_packets + 1)."}
  yapp_exhaustive_seq: {summary: "Runs the whole library once: 1, 012, 111, repeat_addr, incr_payload, rnd, six."}
  yapp_coverage_seq: {summary: "40 packets with the legal-address constraint switched off, to fill the covergroup."}
  yapp_88_packets_seq: {summary: "88 packets -- enough to fill a 16-byte channel FIFO and exercise in_suspend."}
  yapp_pkt_seq:        {summary: "One packet whose address, length and parity the test chooses (soft constraints); the packet stays in req."}
  yapp_boundary_seq:   {summary: "Lengths maxpktsize-1, maxpktsize, maxpktsize+1 and 63 to every address incl. 3; counts what it sent."}
  yapp_gap_seq:        {summary: "Short packets with gaps 0, 1, 2, 3 in turn (packet_delay = idle cycles); counts the gaps it asked for."}
  # ---------------------------------------------------------------- HBUS UVC
  hbus_transaction: {summary: "One HBUS access: haddr, hdata, hwr_rd (HBUS_READ / HBUS_WRITE)."}
  hbus_master_driver:
    summary: "Drives HBUS writes (1 cycle) and reads (2 cycles); copies read data back into the item."
  hbus_master_sequencer: {summary: "uvm_sequencer #(hbus_transaction)."}
  hbus_master_agent: {summary: "HBUS master: driver + sequencer (the monitor is shared at env level)."}
  hbus_slave_agent:  {summary: "Placeholder slave agent -- the router is the only slave, so none is built."}
  hbus_monitor:
    summary: "Watches the shared bus and publishes every access on item_collected_port (feeds the reference model)."
  hbus_env:
    summary: "num_masters master agents, num_slaves slave agents and one shared monitor."
  hbus_base_seq: {summary: "Base of the HBUS sequences; objection handling."}
  hbus_write_seq: {summary: "One write to `haddr` with `hdata`."}
  hbus_read_seq:  {summary: "One read from `haddr`; the result lands in the item."}
  hbus_set_default_regs_seq: {summary: "Writes the reset defaults: ctrl_reg = 0x3f, en_reg = 0x01."}
  hbus_small_packet_seq: {summary: "ctrl_reg (maxpktsize) = 20, en_reg = 1."}
  hbus_large_packet_seq: {summary: "ctrl_reg (maxpktsize) = 63."}
  hbus_read_max_pkt_seq: {summary: "Reads ctrl_reg and prints maxpktsize."}
  hbus_router_disable_seq: {summary: "en_reg = 0: the router ignores its input."}
  hbus_router_enable_seq:  {summary: "en_reg = 1."}
  hbus_reg_adapter:
    summary: "uvm_reg_adapter: reg2bus() builds an hbus_transaction, bus2reg() reads one back."
  # ------------------------------------------------------------- Channel UVC
  channel_packet: {summary: "A packet as seen on an output channel (addr, length, payload, parity, response delay)."}
  channel_rx_driver: {summary: "Responder: receives packets from the DUT with a random suspend delay."}
  channel_rx_sequencer: {summary: "uvm_sequencer #(channel_packet)."}
  channel_rx_monitor:
    summary: "Collects packets on the channel and checks that the address matches channel_id."
  channel_rx_agent: {summary: "One output channel: responder driver, sequencer, monitor."}
  channel_env: {summary: "channel_id tells the agent which output it watches (0, 1 or 2)."}
  channel_rx_base_seq: {summary: "Base of the channel sequences (no objection: responders run forever)."}
  channel_rx_resp_seq: {summary: "Forever: receive the next packet with a random delay 0..10."}
  channel_rx_fast_seq: {summary: "Forever: receive with no delay."}
  channel_rx_slow_seq: {summary: "Forever: answer 20..40 cycles late, so long packets fill the FIFO and the router stalls the input."}
  # ----------------------------------------------------- Clock & Reset UVC
  clock_and_reset_transaction: {summary: "clock period + number of reset cycles."}
  clock_and_reset_driver: {summary: "Calls clk_rst_if.start_clock_and_reset(period, reset_cycles)."}
  clock_and_reset_sequencer: {summary: "uvm_sequencer #(clock_and_reset_transaction)."}
  clock_and_reset_agent: {summary: "driver + sequencer (no monitor)."}
  clock_and_reset_env: {summary: "One agent."}
  clock_and_reset_base_seq: {summary: "Base sequence with objection handling."}
  clk10_rst5_seq: {summary: "10 ns clock, reset held for 5 cycles -- the default in every test."}
  clk_rst_rand_seq: {summary: "Random period and reset length."}
  # ------------------------------------------------------- Router module UVC
  router_scoreboard:
    summary: "Four analysis imps: expected packets queued per address, compared with what each channel delivered."
    description: |
      `write_yapp` clones the packet into `pkt_q[addr]`; `write_chan0/1/2` pop the head of
      the matching queue and compare with `comp_equal()`. Counts matched / mismatched /
      unexpected; `report_phase` prints the totals. Packets to address 3 are dropped here
      in Lab 9A; from Lab 9B the reference model filters them first.
  router_reference:
    summary: "Mirrors maxpktsize and router_en from the HBUS traffic and forwards only the packets the router will route."
    description: |
      `write_hbus` updates the mirrored registers on every write to 0x1000/0x1001.
      `write_yapp` applies the DUT's drop rules (disabled, length > maxpktsize, addr == 3)
      and publishes survivors on `yapp_valid_out` -> scoreboard.
  router_module_env:
    summary: "The router module UVC: reference + scoreboard, with exports as the only connection points."
  router_fifo_scoreboard:
    summary: "Lab 9D: the same checks built on uvm_tlm_analysis_fifo and blocking get() in run_phase threads."
  # ------------------------------------------------------- Testbench & tests
  router_tb:
    summary: "The environment: five UVC envs, the virtual sequencer, the module UVC and the register model."
    description: |
      `build_phase` configures the channels (channel_id) and the HBUS env (one master, no
      slave), creates everything, builds and locks the register model. `connect_phase`
      wires the monitors to the module UVC, the virtual sequencer to the two sub-sequencers
      and the register map to the HBUS sequencer through the adapter.
  router_mcsequencer:
    summary: "Virtual sequencer: handles to the HBUS and YAPP sequencers, no items of its own."
  router_mcseq_base:
    summary: "Base of the multichannel sequences; `uvm_declare_p_sequencer(router_mcsequencer)`."
  router_simple_mcseq:
    summary: "Programs maxpktsize = 20, sends 6 short packets, then maxpktsize = 63 and 6 random packets."
  base_test:
    summary: "Builds router_tb, sets the clock/reset and channel default sequences, enables recording."
    description: |
      Every other test extends it. `configure_sequences()` is the hook the tests override;
      `end_of_elaboration_phase` prints the topology; `check_phase` runs `check_config_usage()`.
  short_packet_test: {summary: "Lab 4: factory override yapp_packet -> short_yapp_packet; the sequence is unchanged."}
  set_config_test: {summary: "Lab 4: tb.yapp.agent made passive through uvm_config_int; no sequence configured."}
  incr_payload_test: {summary: "Lab 5: yapp_incr_payload_seq -- one short packet with payload 0 1 2 3 ..."}
  exhaustive_seq_test: {summary: "Lab 5: yapp_exhaustive_seq runs every sequence of the library once."}
  yapp_012_test: {summary: "Lab 6: one packet per channel into the real DUT -- watch in0 against data_0/1/2."}
  simple_test: {summary: "Default sequences only: yapp_012_seq on the YAPP sequencer."}
  test_uvc_integration: {summary: "Lab 7: hbus_small_packet_seq + yapp_012_seq -- all UVCs talking to the DUT."}
  router_simple_mcseq_test: {summary: "Runs router_simple_mcseq on the virtual sequencer."}
  scoreboard_drop_test: {summary: "Lab 9: packets the reference model drops must not reach the scoreboard."}
  coverage_test: {summary: "Lab 10: yapp_coverage_seq to close yapp_pkt_cg."}
  uvm_reset_test: {summary: "uvm_reg_hw_reset_seq: every register reads its reset value."}
  uvm_mem_walk_test: {summary: "uvm_mem_walk_seq on yapp_mem (511 writes / 255 reads); detects INJECT_ERROR."}
  reg_access_test: {summary: "Hand-written RW / RO register checks, front door and backdoor."}
  reg_function_test: {summary: "Sends packets and checks the counters through the register model."}
  reg_function_check_test: {summary: "set_check_on_read + predict(): the model checks every read itself."}
  reg_introspection_test: {summary: "get_registers() and queue find(): the model describing itself."}
  # ------------------------------------------------------- test-plan tests
  router_disable_test: {summary: "Test plan: router_en = 0 -- nothing delivered, counted or stored; traffic resumes when enabled."}
  router_filter_test:  {summary: "Test plan: drops around maxpktsize and address 3, the counters behind them, with enables on and off."}
  pkt_mem_test:        {summary: "Test plan: yapp_pkt_mem and mem_size_reg hold the last packet byte by byte, read-only, even when dropped."}
  reg_bit_walk_test:   {summary: "Test plan: walking ones and zeros through the RW registers; writes ignored by every RO register."}
  hbus_protocol_test:  {summary: "Test plan: raw HBUS cycles -- write, read back, tri-state after the read, unmapped and RO addresses."}
  backpressure_test:   {summary: "Test plan: slow receivers fill the channel FIFOs; in_suspend stalls the input and no byte is lost."}
  error_pulse_checker: {summary: "Subscriber of the YAPP monitor: one error pulse per bad-parity packet, 1..10 cycles after it."}
  parity_error_test:   {summary: "Test plan: bad parity -- counted when enabled, error pulses on time, packet still delivered."}
  counter_wrap_test:   {summary: "Test plan: 257 packets to address 0 -- addr0_cnt_reg reads 255, then wraps to 0, then 1."}
  back_to_back_test:   {summary: "Test plan: packets with gaps 0..3 -- the monitor measures exactly the planned gaps, nothing lost."}
  # ---------------------------------------------------------- Register model
  yapp_router_regs_t: {summary: "Top register block: default_map with the yapp_regs sub-block at 0x1000."}
  yapp_regs_c: {summary: "The register file: ctrl_reg, en_reg, six RO counters, mem_size_reg, two memories."}
  ctrl_reg_c: {summary: "0x1000 ctrl_reg: plen[5:0] (maxpktsize, reset 0x3f)."}
  en_reg_c: {summary: "0x1001 en_reg: router_en and the counter enables (reset 0x01)."}
  ro_byte_reg_c: {summary: "Base of the read-only 8-bit counters."}
  parity_err_cnt_reg_c: {summary: "0x1004: packets with bad parity."}
  oversized_pkt_cnt_reg_c: {summary: "0x1005: packets longer than maxpktsize."}
  addr3_cnt_reg_c: {summary: "0x1006: packets to illegal address 3."}
  addr0_cnt_reg_c: {summary: "0x1009: packets to address 0."}
  addr1_cnt_reg_c: {summary: "0x100a: packets to address 1."}
  addr2_cnt_reg_c: {summary: "0x100b: packets to address 2."}
  mem_size_reg_c: {summary: "0x100d: length of the last packet."}
  yapp_pkt_mem_c: {summary: "0x1010: 64 x 8 RO -- bytes of the last packet."}
  yapp_mem_c: {summary: "0x1100: 256 x 8 RW scratch memory."}

nodes:
  tb_top:
    summary: "UVM side of the testbench: publishes the virtual interfaces with *_vif_config::set(), then run_test()."
  hw_top:
    summary: "Hardware side: clock generator, the five interface instances and the DUT."
  hw_top.dut:
    summary: "yapp_router: one YAPP input, three FIFO-buffered output channels, HBUS register access. One module per file in yapp_project/rtl/."
    docs: [{title: "DUT specification", url: dut/spec.md}, {title: "RTL walkthrough", url: dut/rtl.md}]
  hw_top.dut.u_input_fsm:
    summary: "IDLE -> PAYLOAD -> PARITY: accepts the header, decides drop, pushes bytes, checks parity."
    description: |
      The header is latched in IDLE (`cur_addr`, `cur_len`, `cur_drop`). Bytes are pushed into
      the channel FIFO while `in_data_vld && !in_suspend`; `in_suspend` is asserted only when the
      target FIFO is full and the packet is not dropped. In PARITY the accumulated XOR is compared
      with the parity byte and the packet is reported to the register block (`pkt_done`,
      `pkt_addr`, `pkt_len`, `pkt_parity_err`, `pkt_oversized`) in the same cycle. The
      `ROUTER DROPS PACKET` messages come from here.
  hw_top.dut.u_regs:
    summary: "HBUS slave + register file: ctrl_reg, en_reg, counters, mem_size_reg, yapp_pkt_mem, yapp_mem."
    description: |
      1-cycle writes, 2-cycle reads with tri-state `hdata`. Counters and `mem_size_reg` are updated
      from the FSM's end-of-packet report; `yapp_pkt_mem` through the `pkt_mem_*` write port.
      The register model's backdoor root is `hw_top.dut.u_regs`. `INJECT_ERROR` lives here.
  hw_top.dut.u_error_timer:
    summary: "A free-running counter picks a delay 1..10; `error` pulses that many cycles after a bad-parity packet."
  "hw_top.dut.g_ch[0].u_ch":
    summary: "Output channel 0: a 16 x 8 FIFO and the data_vld / suspend handshake."
    description: &outch |
      `data` is the FIFO head, `data_vld = !empty`; the FIFO pops when the receiver has `suspend`
      low on a rising edge, so a new byte appears every cycle while the receiver keeps up.
  "hw_top.dut.g_ch[1].u_ch":
    summary: "Output channel 1: a 16 x 8 FIFO and the data_vld / suspend handshake."
    description: *outch
  "hw_top.dut.g_ch[2].u_ch":
    summary: "Output channel 2: a 16 x 8 FIFO and the data_vld / suspend handshake."
    description: *outch
  "hw_top.dut.g_ch[0].u_ch.u_fifo": {summary: "Synchronous FIFO, DEPTH 16 x WIDTH 8: count tells empty / full, dout is always the head."}
  "hw_top.dut.g_ch[1].u_ch.u_fifo": {summary: "Synchronous FIFO, DEPTH 16 x WIDTH 8: count tells empty / full, dout is always the head."}
  "hw_top.dut.g_ch[2].u_ch.u_fifo": {summary: "Synchronous FIFO, DEPTH 16 x WIDTH 8: count tells empty / full, dout is always the head."}
  hw_top.in0:
    summary: "yapp_if: in_data / in_data_vld / in_suspend + tasks send_to_dut (driver) and collect_packets (monitor)."
  hw_top.hbus0:
    summary: "hbus_if: haddr / hen / hwr_rd and the bidirectional hdata (DUT connects to the wire hdata_w)."
  hw_top.ch0: {summary: "channel_if for output 0: data / data_vld / suspend."}
  hw_top.ch1: {summary: "channel_if for output 1."}
  hw_top.ch2: {summary: "channel_if for output 2."}
  hw_top.clk_rst_if: {summary: "clock_and_reset_if: owns reset, run_clock and clock_period."}
  hw_top.clkgen: {summary: "Free-running clock generator controlled by run_clock / clock_period."}
  uvm_test_top:
    summary: "The test selected with +UVM_TESTNAME. base_test is shown; the other tests only change the stimulus."

extra_flows:        # connections made by assign statements inside yapp_router (from, to, label, bidir)
  - ["hw_top.dut.g_ch[0].u_ch", hw_top.ch0, "data_0 / data_vld_0 <- suspend_0", true]
  - ["hw_top.dut.g_ch[1].u_ch", hw_top.ch1, "data_1 / data_vld_1 <- suspend_1", true]
  - ["hw_top.dut.g_ch[2].u_ch", hw_top.ch2, "data_2 / data_vld_2 <- suspend_2", true]

# ----------------------------------------------------------------------------- tests
# The plan of every test for the Tests view: what runs, in order, and what the log and
# the waveform are expected to show. Stage kinds: build, config, reset, program, stimulus,
# check, report (they colour the timeline). Everything else about a test (default sequences,
# factory overrides, notable calls, file, lines) is extracted from the code.
tests:
  base_test:
    purpose: "The skeleton every test extends: builds router_tb, keeps the run alive 200 ns after the last objection, reports unused settings."
    stages:
      - {k: build,  t: "build_phase",  d: "recording_detail = 1 for every component; configure_sequences() hook (empty here); router_tb created"}
      - {k: report, t: "topology",     d: "print_topology() at end_of_elaboration"}
      - {k: stimulus, t: "run_phase",  d: "no stimulus of its own; drain time 200 ns after the last objection drops"}
      - {k: check,  t: "check_phase",  d: "check_config_usage(): every setting nobody read"}
    expected:
      - "The topology report lists uvm_test_top : base_test with the whole router_tb below it."
      - "No sequence runs, so the DUT sees no clock and no packet; the run ends after the drain time with UVM_ERROR : 0."
      - "Every other test extends it and only changes what runs (configure_sequences, build_phase, run_phase)."
  short_packet_test:
    purpose: "Lab 4: the factory override in action -- the sequence asks for yapp_packet and gets short_yapp_packet."
    stages:
      - {k: build,    t: "factory override", d: "set_type_override_by_type(yapp_packet, short_yapp_packet) before the testbench is built"}
      - {k: config,   t: "default sequence", d: "inherited from the Lab 4-6 base_test: yapp_5_packets on tb.yapp.agent.sequencer"}
      - {k: stimulus, t: "5 packets",        d: "the driver prints every packet it receives"}
    expected:
      - "Each `Packet is` table starts with short_yapp_packet, length < 15, never addr 2 (the subclass constraints)."
      - "Nothing in the sequence changed: the override happened in the factory."
  set_config_test:
    purpose: "Lab 4: a passive agent through the configuration database -- and why the sequence setting lives in a virtual function."
    stages:
      - {k: build,  t: "config_db",            d: "uvm_config_int::set(tb.yapp.agent, is_active, UVM_PASSIVE) before super.build_phase"}
      - {k: config, t: "configure_sequences()", d: "overridden with an empty body: there is no sequencer to configure"}
      - {k: stimulus, t: "run_phase",          d: "nothing drives; the agent only has a monitor"}
    expected:
      - "print_topology shows tb.yapp.agent with is_active = UVM_PASSIVE and only a monitor below it."
      - "No `configuration never used` report at the end -- the reason the default sequence is set from a virtual function the test can override."
  incr_payload_test:
    purpose: "Lab 5: a sequence that shapes the payload after randomisation."
    stages:
      - {k: build,    t: "factory override", d: "yapp_packet -> short_yapp_packet"}
      - {k: config,   t: "default sequence", d: "yapp_incr_payload_seq on tb.yapp.agent.sequencer"}
      - {k: stimulus, t: "one packet",       d: "post_randomize() rewrites the payload to 0 1 2 3 ..."}
    expected:
      - "One short packet whose payload reads 0 1 2 3 ..."
      - "At UVM_FULL: `Starting default sequence yapp_incr_payload_seq`."
  exhaustive_seq_test:
    purpose: "Lab 5: one sequence that runs every sequence of the library once (sequences starting sub-sequences)."
    stages:
      - {k: build,    t: "factory override",      d: "yapp_packet -> short_yapp_packet"}
      - {k: config,   t: "default sequence",      d: "yapp_exhaustive_seq on tb.yapp.agent.sequencer"}
      - {k: stimulus, t: "every sequence once",   d: "yapp_1_seq, yapp_012_seq, yapp_3_seq, yapp_incr_payload_seq, yapp_rnd_seq, yapp_6_seq ... as sub-sequences"}
    expected:
      - "One `Executing ...` line per sub-sequence and 1 + 3 + 3 + 2 + 1 + count + 6 packets, no warnings."
  yapp_012_test:
    purpose: "Lab 6: the first packets into the real DUT -- one per channel, so the connection is easy to check in the waveform."
    stages:
      - {k: config,   t: "default sequence", d: "yapp_012_seq on tb.yapp.agent.sequencer"}
      - {k: stimulus, t: "3 packets",        d: "addr 0, 1, 2 -- through the virtual interface into in0"}
      - {k: check,    t: "waveform",         d: "in0.in_data against dut.data_0 / data_1 / data_2"}
    expected:
      - "Each packet comes out on the channel its address names: data_0, data_1, data_2 in turn."
      - "No channel UVC yet: the output side is only watched in the waveform."
  simple_test:
    purpose: "Lab 7: every UVC talking to the DUT with the default sequences only."
    stages:
      - {k: build,    t: "factory override",  d: "yapp_packet -> short_yapp_packet"}
      - {k: config,   t: "default sequences", d: "yapp_012_seq on YAPP; clk10_rst5_seq on clk_rst; channel_rx_resp_seq on chan0..2 (set_clock_and_channel_sequences)"}
      - {k: reset,    t: "clk10_rst5_seq",    d: "clock period 10 ns, reset held 5 cycles"}
      - {k: stimulus, t: "3 short packets",   d: "one per channel; the HBUS stays idle (reset values: maxpktsize 63, router enabled)"}
      - {k: stimulus, t: "channel response",  d: "channel_rx_resp_seq answers suspend on every channel and the monitors collect"}
      - {k: report,   t: "channel reports",   d: "each channel monitor reports what it collected"}
    expected:
      - "Each channel monitor prints exactly one `Channel N collected packet` whose fields equal the YAPP packet with addr == N."
      - "The channel reports say `1 packets collected` each."
  test_uvc_integration:
    purpose: "Lab 7: 88 packets of every length and address against a router programmed for small packets."
    stages:
      - {k: config,   t: "default sequences", d: "yapp_88_packets_seq on YAPP, hbus_small_packet_seq on hbus.masters[0], clock and channel sequences"}
      - {k: reset,    t: "clk10_rst5_seq",    d: "clock and 5 cycles of reset"}
      - {k: program,  t: "hbus_small_packet_seq", d: "WRITE 0x1000 = 0x14 (maxpktsize 20), WRITE 0x1001 = 0x01 (router on)"}
      - {k: stimulus, t: "88 packets",        d: "lengths 1..22, all four addresses, 20 % bad parity"}
      - {k: check,    t: "router drops",      d: "length > 20 dropped, address 3 dropped, error pulse after a bad-parity packet"}
    expected:
      - "HBUS `WRITE addr=0x1000 data=0x14` and `0x1001 data=0x01` in the HBUS monitor log."
      - "`ROUTER DROPS PACKET ... length > maxpktsize` for lengths 21 and 22, `... illegal address` for every address-3 packet."
      - "`error` pulses in the waveform after bad-parity packets; the channel monitors together collect 3 x 20 = 60 packets."
  router_simple_mcseq_test:
    purpose: "Lab 8: one multichannel sequence on the virtual sequencer programs the router and sends the packets in order."
    stages:
      - {k: build,    t: "factory override",     d: "yapp_packet -> short_yapp_packet"}
      - {k: config,   t: "default sequences",    d: "router_simple_mcseq on tb.mcseqr; clock and channel sequences"}
      - {k: reset,    t: "clk10_rst5_seq",       d: "clock and 5 cycles of reset"}
      - {k: program,  t: "hbus_small_packet_seq", d: "maxpktsize = 20, router enabled; hbus_read_max_pkt_seq reads it back"}
      - {k: stimulus, t: "6 packets",            d: "yapp_012_seq twice: addresses 0, 1, 2, 0, 1, 2"}
      - {k: program,  t: "hbus_large_packet_seq", d: "maxpktsize = 63; read back"}
      - {k: stimulus, t: "6 random packets",     d: "yapp_rnd_seq with count = 6"}
      - {k: check,    t: "scoreboard (Lab 9)",   d: "every packet the reference model forwards is compared with what the channel monitor saw"}
    expected:
      - "The log shows the sequences in this order: hbus_small_packet_seq, hbus_read_max_pkt_seq, yapp_012_seq x2, hbus_large_packet_seq, hbus_read_max_pkt_seq, yapp_rnd_seq."
      - "From Lab 9 on, the scoreboard report: packets received 12, matched 12, mismatched 0, unexpected 0, left in queue 0 / 0 / 0."
  scoreboard_drop_test:
    purpose: "Lab 9A: the negative check -- full-size packets while maxpktsize is 20, so the router drops some and the scoreboard must notice."
    stages:
      - {k: build,    t: "no override",          d: "new() clears short_packets, so router_simple_mcseq_test::build_phase skips the short-packet override"}
      - {k: config,   t: "default sequences",    d: "same as router_simple_mcseq_test"}
      - {k: reset,    t: "clk10_rst5_seq",       d: "clock and reset"}
      - {k: stimulus, t: "first 6 packets",      d: "random lengths up to 63 while maxpktsize = 20"}
      - {k: check,    t: "router drops",         d: "every packet longer than 20 is dropped"}
      - {k: check,    t: "scoreboard compare",   d: "the next packet on that channel is compared with the dropped one and mismatches"}
      - {k: report,   t: "scoreboard report",    d: "received == matched + mismatched + left in queues"}
    expected:
      - "`ROUTER DROPS PACKET ... length > maxpktsize` for every packet longer than 20."
      - "`UVM_ERROR ... [PKT_COMPARE] Length mismatch` / `... MISMATCH` when the next packet on that channel is compared with the dropped one -- expected errors, this is a negative test."
      - "At the end: packets received == matched + mismatched + left in queues."
  coverage_test:
    purpose: "Lab 10: stimulus written to close the functional coverage model of the YAPP monitor."
    stages:
      - {k: config,   t: "default sequences",   d: "yapp_coverage_seq on YAPP, clock and channel sequences; no HBUS traffic, maxpktsize stays 63"}
      - {k: reset,    t: "clk10_rst5_seq",      d: "clock and reset"}
      - {k: stimulus, t: "yapp_coverage_seq",   d: "every length bin to every address, with and without parity errors"}
      - {k: check,    t: "router drops",        d: "only the address-3 packets are dropped (the reference model expects that)"}
      - {k: report,   t: "yapp_pkt_cg",         d: "the covergroup in yapp_tx_monitor; the monitor report prints the percentage"}
    expected:
      - "All 5 length bins, all 4 address bins, both parity values and all 15 cross bins are hit: 100 %."
      - "router_simple_mcseq_test (short packets) leaves LARGE, MAX and illegal_addr empty; this test closes them."
  uvm_reset_test:
    purpose: "Lab 11B: the built-in register sequence that reads every register after reset."
    stages:
      - {k: config,   t: "default sequences",     d: "clock and channel sequences; the YAPP sequencer stays idle"}
      - {k: reset,    t: "clk10_rst5_seq",        d: "clock and reset"}
      - {k: stimulus, t: "uvm_reg_hw_reset_seq",  d: "model = tb.yapp_rm, start(null): a front-door read of every register through reg2hbus"}
      - {k: check,    t: "built-in compare",      d: "each value read is compared with the reset value in the model"}
    expected:
      - "The HBUS monitor logs one READ per register (0x1000, 0x1001, 0x1004 ... 0x100d)."
      - "The topology shows yapp_rm under tb (router_tb::do_print). UVM_ERROR : 0."
  uvm_mem_walk_test:
    purpose: "Lab 11B: the built-in memory sequence walks yapp_mem; the RO yapp_pkt_mem is skipped."
    stages:
      - {k: config,   t: "default sequences",  d: "clock and channel sequences"}
      - {k: reset,    t: "clk10_rst5_seq",     d: "clock and reset"}
      - {k: stimulus, t: "uvm_mem_walk_seq",   d: "model = tb.yapp_rm: writes a pattern through yapp_mem and reads it back"}
      - {k: check,    t: "built-in compare",   d: "every read compared with what was written; yapp_pkt_mem (RO) is skipped"}
    expected:
      - "HBUS traffic over 0x1100..0x11ff only; the HBUS report says 511 writes, 255 reads."
      - "With `-define INJECT_ERROR`: `UVM_ERROR ... [uvm_mem_walk_seq] Memory ... read back as ... instead of ...` at 0x112a."
  reg_access_test:
    purpose: "Lab 11C: hand-written front-door and backdoor checks on one RW and one RO register."
    stages:
      - {k: config,   t: "default sequences",  d: "clock and channel sequences; regs = tb.yapp_rm.router_yapp_regs in connect_phase"}
      - {k: reset,    t: "clk10_rst5_seq",     d: "clock and reset"}
      - {k: check,    t: "RW: ctrl_reg",       d: "write 0x25 (front door) -> peek == 0x25; poke 0x1a -> read == 0x1a"}
      - {k: check,    t: "RO: addr0_cnt_reg",  d: "poke 0x5a -> read == 0x5a; write 0x33 (front door, ignored) -> peek still 0x5a"}
    expected:
      - "Eight [REG_ACCESS] lines; the RO write produces an HBUS `WRITE addr=0x1009` in the monitor log but the following peek still returns 0x5a."
      - "UVM_ERROR : 0."
  reg_function_test:
    purpose: "Lab 11C: do the enable bits and the counters behave? Packets in, counters read through the model."
    stages:
      - {k: config,   t: "default sequences",  d: "as reg_access_test; yapp_seqr = tb.yapp.agent.sequencer by hierarchical handle"}
      - {k: reset,    t: "clk10_rst5_seq",     d: "clock and reset"}
      - {k: program,  t: "en_reg = 0x01",      d: "router on, every counter off"}
      - {k: stimulus, t: "yapp_012_seq",       d: "3 packets, addresses 0, 1, 2"}
      - {k: check,    t: "counters stay 0",    d: "addr0..3_cnt_reg all read 0"}
      - {k: program,  t: "en_reg = 0xff",      d: "every counter on"}
      - {k: stimulus, t: "yapp_012_seq x2",    d: "6 packets, 2 per address"}
      - {k: check,    t: "counters",           d: "addr0/1/2 == 2, addr3 == 0, parity_err_cnt == bad-parity packets the monitor saw, oversized == 0 (maxpktsize 63)"}
    expected:
      - "`addr*_cnt_reg reads 0 as expected` x4, then addr0/1/2_cnt_reg read 2, addr3_cnt_reg reads 0, parity_err_cnt_reg reads N, oversized_pkt_cnt_reg reads 0."
  reg_function_check_test:
    purpose: "Lab 11C (optional): the same test with the model checking every read itself."
    stages:
      - {k: config,   t: "set_check_on_read(1)", d: "on default_map at the start of run_phase"}
      - {k: stimulus, t: "reg_function_test",    d: "the same two steps: en_reg = 0x01, 3 packets; en_reg = 0xff, 6 packets"}
      - {k: check,    t: "predict + read",       d: "check_counter() loads the mirror with predict(expected), then read() compares the DUT value with it"}
    expected:
      - "Same values as reg_function_test, 0 errors."
      - "Comment out predict() to see the check-on-read errors: RO counters move without bus traffic, so the mirror is stale."
  reg_introspection_test:
    purpose: "Lab 11C (optional): the model tells the test which registers are RW and which are RO, then every one is checked."
    stages:
      - {k: config,   t: "default sequences",  d: "as reg_access_test"}
      - {k: reset,    t: "clk10_rst5_seq",     d: "clock and reset"}
      - {k: build,    t: "introspection",      d: "get_registers(all_q); find() with get_rights() == RW / RO"}
      - {k: check,    t: "RW checks",          d: "check_rw_register on ctrl_reg and en_reg"}
      - {k: check,    t: "RO checks",          d: "check_ro_register on the six counters and mem_size_reg"}
    expected:
      - "`RW register: ctrl_reg @ 0x1000`, `RW register: en_reg @ 0x1001`, seven `RO register:` lines, then the access checks for all nine registers, 0 errors."
  router_disable_test:
    purpose: "Test plan: router_en = 0 makes the router deaf -- nothing reaches a channel, nothing is counted, nothing is stored; traffic resumes when it is enabled again."
    stages:
      - {k: config,   t: "default sequences",  d: "clock and channel sequences (inherited from reg_access_test)"}
      - {k: program,  t: "en_reg = 0xfe",      d: "front door: router off, every counter on"}
      - {k: stimulus, t: "yapp_012_seq",       d: "3 packets, one per channel, into a disabled router"}
      - {k: check,    t: "nothing delivered",  d: "channel monitors collected nothing; the reference model reports 3 dropped (router disabled)"}
      - {k: check,    t: "counters stay 0",    d: "addr0..3, parity, oversized and mem_size_reg all read 0"}
      - {k: program,  t: "en_reg = 0xff",      d: "router on, counters on"}
      - {k: stimulus, t: "yapp_012_seq",       d: "3 packets again"}
      - {k: check,    t: "traffic resumes",    d: "3 packets on the channels, addr0/1/2 counters read 1"}
    expected:
      - "`router_en = 0: no packet reached a channel`, the reference model's `Packet dropped: router disabled` three times, and `ROUTER DROPS PACKET ... (router disabled)` from the RTL."
      - "Every `check_counter` line says `reads 0 as expected` after the first run and `reads 1` for addr0/1/2 after the second; `UVM_ERROR : 0`."
  router_filter_test:
    purpose: "Test plan: the drop rules around the maxpktsize limit and the counters behind them, with the counters enabled and then disabled."
    stages:
      - {k: program,  t: "maxpktsize = 10",      d: "ctrl_reg = 10 through the front door; en_reg = 0xff"}
      - {k: stimulus, t: "yapp_boundary_seq",    d: "lengths 9, 10, 11 and 63 to every address 0..3: 16 packets"}
      - {k: check,    t: "scoreboard",           d: "only legal, non-oversized packets are matched (6); none unexpected"}
      - {k: check,    t: "counters",             d: "oversized == 8, addr3 == 4, addr0/1/2 == 4 each (dropped ones included), parity == 0"}
      - {k: program,  t: "en_reg = 0x01",        d: "every counter off, router on"}
      - {k: stimulus, t: "yapp_boundary_seq",    d: "the same 16 packets"}
      - {k: check,    t: "frozen counters",      d: "same drops (6 matched again), every counter unchanged"}
    expected:
      - "`ROUTER DROPS PACKET ... length > maxpktsize` for the 11- and 63-byte packets to addresses 0..2, `... illegal address` for the four address-3 packets."
      - "`oversized_pkt_cnt_reg reads 8 as expected`, `addr3_cnt_reg reads 4`, `addr0_cnt_reg reads 4` (and 1, 2) after the first pass and unchanged after the second; scoreboard matched 12, unexpected 0."
  pkt_mem_test:
    purpose: "Test plan: the packet memory and mem_size_reg hold the last packet, byte by byte, even when the packet was dropped."
    stages:
      - {k: stimulus, t: "one packet",          d: "yapp_pkt_seq: address 1, 20 payload bytes, good parity"}
      - {k: check,    t: "mem_size_reg == 20",  d: "front-door read through the register model"}
      - {k: check,    t: "yapp_pkt_mem",        d: "[0] == header {length, addr}, [1..20] == the payload the sequence left in req"}
      - {k: stimulus, t: "write to 0x1010",     d: "a raw hbus_write_seq to the packet memory"}
      - {k: check,    t: "read-only",           d: "yapp_pkt_mem[0] still holds the header"}
      - {k: program,  t: "maxpktsize = 5",      d: "ctrl_reg = 5"}
      - {k: stimulus, t: "9-byte packet",       d: "dropped as oversized"}
      - {k: check,    t: "still stored",        d: "mem_size_reg == 9 and the bytes are there (a received packet is stored, forwarded or not)"}
    expected:
      - "`packet (addr 1, length 20) stored byte by byte`, `write to yapp_pkt_mem ignored, as it should be`, then `ROUTER DROPS PACKET addr=2 length=9` followed by `packet (addr 2, length 9) stored byte by byte`."
      - "22 reads of 0x1010..0x1025 in the HBUS monitor log for the first packet; `UVM_ERROR : 0`."
  reg_bit_walk_test:
    purpose: "Test plan: every bit of every register obeys its policy -- walking ones and zeros through the RW registers, writes ignored by the RO ones."
    stages:
      - {k: build,    t: "introspection",       d: "get_registers() and find() split the model into RW and RO queues"}
      - {k: stimulus, t: "RW patterns",         d: "for ctrl_reg and en_reg: 0x01 << b, ~(0x01 << b), 0x00, 0xff, 0xaa, 0x55 -- 20 patterns each"}
      - {k: check,    t: "read and peek",       d: "after every write the front-door read and the backdoor peek both return the pattern"}
      - {k: stimulus, t: "RO registers",        d: "poke 0x00 / write 0xff / peek, then poke 0xff / write 0x00 / peek, on all 7 counters and mem_size_reg"}
      - {k: check,    t: "RO unchanged",        d: "check_ro_register: the write did nothing"}
      - {k: program,  t: "restore",             d: "ctrl_reg = 0x3f, en_reg = 0x01"}
    expected:
      - "`--- RW register ctrl_reg: walking ones and zeros ---` then the same for en_reg; at UVM_HIGH one line per pattern."
      - "`--- RO register ... ---` blocks with `front-door write ... (RO: must be ignored)` and a matching peek; `UVM_ERROR : 0`. The reserved bits ctrl_reg[7:6] and en_reg[3] hold what was written (they are RW in the router)."
  hbus_protocol_test:
    purpose: "Test plan: the host port on the wire -- one-cycle writes, two-cycle reads, tri-state after the access, unmapped addresses -- with raw HBUS sequences, no register model."
    stages:
      - {k: stimulus, t: "write 0x2a",          d: "hbus_write_seq to ctrl_reg (0x1000)"}
      - {k: stimulus, t: "read it back",        d: "hbus_read_seq: the value lands in rd.data"}
      - {k: check,    t: "value and monitor",   d: "rd.data == 0x2a; the HBUS monitor counted one write and one read"}
      - {k: check,    t: "tri-state",           d: "two edges after the read hdata_w reads 'z"}
      - {k: stimulus, t: "unmapped addresses",  d: "write 0xa5 then read 0x1002, 0x1003, 0x1007, 0x1008, 0x100c, 0x100e, 0x100f, 0x1050"}
      - {k: check,    t: "read 0x00",           d: "every unmapped address reads 0x00"}
      - {k: stimulus, t: "write a RO address",  d: "0x77 to parity_err_cnt_reg (0x1004), read back"}
      - {k: check,    t: "ignored",             d: "reads 0x00; ctrl_reg restored to 0x3f"}
    expected:
      - "HBUS monitor: `Collected WRITE addr=0x1000 data=0x2a`, `Collected READ addr=0x1000 data=0x2a`, then 8 write/read pairs with `data=0x00` on the reads."
      - "`hdata tri-stated after the read`, `8 unmapped addresses read 0x00`, `UVM_ERROR : 0`."
  backpressure_test:
    purpose: "Test plan: the YAPP handshake under back-pressure -- slow receivers fill the 16-byte channel FIFOs, the router stalls the input with in_suspend and no byte is lost."
    stages:
      - {k: config,   t: "slow receivers",      d: "channel_rx_slow_seq (response delay 20..40 cycles) on chan0..2 instead of channel_rx_resp_seq"}
      - {k: stimulus, t: "6 long packets",      d: "yapp_pkt_seq, 40..63 bytes, random legal addresses"}
      - {k: check,    t: "in_suspend rose",     d: "a thread counts the rising edges of in_suspend on the YAPP interface: at least one"}
      - {k: check,    t: "scoreboard",          d: "6 matched, 0 mismatched, 0 unexpected: every byte arrived exactly once"}
      - {k: check,    t: "no bad parity",       d: "the YAPP monitor saw no parity error: a held byte stayed held"}
    expected:
      - "`in_suspend rose N times` with N > 0 (a 63-byte packet stalls for roughly the response delay), scoreboard `matched 6, mismatched 0, unexpected 0`."
      - "In the waveform: in_suspend high while suspend_x is still high and the FIFO count is 16; in_data frozen meanwhile."
  parity_error_test:
    purpose: "Test plan: what a wrong parity byte does -- the counter counts it (when enabled), error pulses 1..10 cycles later, and the packet is still delivered."
    stages:
      - {k: build,    t: "error_pulse_checker", d: "a subscriber of the YAPP monitor that times every error pulse against the last bad packet"}
      - {k: program,  t: "en_reg = 0x03",       d: "router on, parity counter on"}
      - {k: stimulus, t: "8 bad packets",       d: "yapp_pkt_seq with pkt_parity == BAD_PARITY, random address and length"}
      - {k: check,    t: "count and pulses",    d: "parity_err_cnt_reg == 8; 8 pulses, each 1..10 cycles after its packet; scoreboard matched 8"}
      - {k: program,  t: "en_reg = 0x01",       d: "parity counter off"}
      - {k: stimulus, t: "4 bad packets",       d: "same sequence"}
      - {k: check,    t: "frozen count",        d: "counter still 8; 12 pulses in total, none outside the window"}
    expected:
      - "`error pulse K cycles after the bad packet` twelve times with K in 1..10; `parity_err_cnt_reg reads 8 as expected` twice."
      - "The channel monitors print the packets with `parity_type CHANNEL_BAD_PARITY` -- the router forwards them; `UVM_ERROR : 0`."
  counter_wrap_test:
    purpose: "Test plan: an 8-bit counter wraps from 255 to 0 -- the specification is silent, the Decisions of dut/spec.md fix the choice."
    stages:
      - {k: program,  t: "en_reg = 0xff",       d: "router and every counter on"}
      - {k: stimulus, t: "255 packets",         d: "yapp_pkt_seq, one byte each, all to address 0"}
      - {k: check,    t: "255",                 d: "addr0_cnt_reg reads 255"}
      - {k: stimulus, t: "1 packet",            d: "the 256th"}
      - {k: check,    t: "wrapped",             d: "addr0_cnt_reg reads 0, not 255"}
      - {k: stimulus, t: "1 packet",            d: "the 257th"}
      - {k: check,    t: "counts on",           d: "addr0_cnt_reg reads 1; the other counters 0; scoreboard matched 257"}
    expected:
      - "`addr0_cnt_reg reads 255 as expected`, `addr0_cnt_reg reads 0 as expected`, `addr0_cnt_reg reads 1 as expected`; scoreboard `packets matched : 257`."
  back_to_back_test:
    purpose: "Test plan: the input port with the shortest gap -- a header in the cycle right after the parity byte -- and gaps of 1, 2 and 3 cycles."
    stages:
      - {k: stimulus, t: "yapp_gap_seq",        d: "24 short packets to random legal addresses, gaps 3, then 1, 2, 3, 0 in turn (packet_delay = idle cycles)"}
      - {k: check,    t: "measured gaps",       d: "the YAPP monitor's idle-cycle count per class (0, 1, 2, 3+) equals what the sequence asked for"}
      - {k: check,    t: "gap coverage",        d: "yapp_gap_cg (gap_cp: back_to_back, one, two, longer) at 100 %"}
      - {k: check,    t: "scoreboard",          d: "24 matched, 0 unexpected"}
    expected:
      - "`gap class 0: 5 packets, as planned` and likewise 6, 6, 6 for classes 1..3; monitor report `YAPP gaps: 5 back to back, 6 of 1 cycle, 6 of 2, 6 longer (gap coverage 100.0%)`."

# ---------------------------------------------------------------------------
# The verification plan, feature by feature, page by page of the course's DUT
# description (Project Overview pp. 5-11) plus the lab chapters that add
# requirements (7, 9A, 10, 11). One source for the Test plan view of the map
# and for docs/test-plan.md (generated by scripts/project_map/build.py).
#
# status: covered  -- a test checks it (and says so in its log)
#         partial  -- exercised, but the check or the coverage is incomplete
#         gap      -- nothing checks it yet (the note says what would)
#         excluded -- deliberately not tested (the note says why)
# ---------------------------------------------------------------------------
plan:
  - id: ROUTE
    title: "Routing"
    spec: "Project Overview p. 5 -- YAPP Router Description"
    doc: dut/spec.md
    summary: "One input port, three output channels: the address in the header picks the channel and the packet comes out unchanged."
    items:
      - id: ROUTE-01
        title: "The address selects the output channel"
        stimulus: "Packets to addresses 0, 1 and 2 (yapp_012_seq, random sequences, yapp_boundary_seq)."
        check: "Each channel monitor raises UVM_ERROR when a packet with another address appears on its channel; the scoreboard keeps one expected queue per channel."
        coverage: "addr_cp.legal (yapp_pkt_cg)"
        tests: [yapp_012_test, simple_test, router_simple_mcseq_test, reg_function_test, router_filter_test]
        status: covered
      - id: ROUTE-02
        title: "Payload and parity arrive unchanged"
        stimulus: "Every packet that is forwarded."
        check: "comp_equal() in the scoreboard: address, length, every payload byte and the parity byte of the channel packet equal the YAPP packet; one UVM_ERROR per difference."
        coverage: "length_cp"
        tests: [router_simple_mcseq_test, scoreboard_drop_test, coverage_test, backpressure_test, router_filter_test]
        status: covered
      - id: ROUTE-03
        title: "Order is kept per channel, channels are independent"
        stimulus: "Back-to-back packets to the same channel (0,1,2,0,1,2) and to different channels while the receivers are slow."
        check: "The scoreboard pops its per-channel queue in order: a swapped packet mismatches; the FIFO scoreboard (Lab 9D) blocks on the next packet of that channel."
        tests: [router_simple_mcseq_test, coverage_test, router_filter_test, backpressure_test]
        status: covered
      - id: ROUTE-04
        title: "Packets back to back with the minimum gap"
        stimulus: "yapp_gap_seq: gaps of 0 (the header in the cycle right after the parity byte -- the shortest the DUT accepts), 1, 2 and 3 cycles; packet_delay is the number of idle cycles. Random traffic keeps 1..20."
        check: "The YAPP monitor counts the idle cycles before every packet; the test compares them with the gaps the sequence asked for. Scoreboard: every packet delivered."
        coverage: "gap_cp (yapp_gap_cg): back_to_back, one, two, longer"
        tests: [back_to_back_test, coverage_test, scoreboard_drop_test]
        status: covered
  - id: PKT
    title: "Packet format"
    spec: "Project Overview p. 6 -- Packet Data Specification"
    doc: dut/spec.md#packet-format
    summary: "Header {length[7:2], addr[1:0]}, 1..63 payload bytes, one even-parity byte over header and payload; address 3 is illegal."
    items:
      - id: PKT-01
        title: "Header: length in [7:2], address in [1:0]"
        stimulus: "Every packet; the driver packs {length, addr}, the channel monitor unpacks it again."
        check: "The channel monitor's length and address equal the YAPP packet's (scoreboard compare, channel address check); the DUT reads length + 2 bytes exactly, so the next header is found where the monitor expects it."
        tests: [simple_test, router_simple_mcseq_test, coverage_test]
        status: covered
      - id: PKT-02
        title: "Every payload length 1..63, including both extremes"
        stimulus: "yapp_coverage_seq sends 1, 5, 20, 50 and 63 bytes; random sequences cover the rest; backpressure_test sends 40..63."
        check: "Scoreboard compare; a wrong length would shift the parity byte and the monitors would disagree."
        coverage: "length_cp bins MIN, SMALL, MEDIUM, LARGE, MAX"
        tests: [coverage_test, scoreboard_drop_test, backpressure_test]
        status: covered
      - id: PKT-03
        title: "Address 3 is illegal"
        stimulus: "Packets with addr == 3 (c_addr_legal switched off): yapp_88_packets_seq, yapp_coverage_seq, yapp_boundary_seq."
        check: "No byte appears on any channel (scoreboard: nothing unexpected), the reference model drops it, addr3_cnt_reg counts it when addr3_cnt_en is set."
        coverage: "addr_cp.illegal_addr"
        tests: [test_uvc_integration, coverage_test, router_filter_test]
        status: covered
      - id: PKT-04
        title: "Even bitwise parity over header and payload"
        stimulus: "Every good packet: parity = XOR of the header and all payload bytes (yapp_packet::calc_parity)."
        check: "The channel monitor recomputes the parity and tags the packet CHANNEL_GOOD_PARITY; the DUT counts nothing in parity_err_cnt_reg; no error pulse."
        coverage: "parity_cp"
        tests: [reg_function_test, coverage_test, router_filter_test]
        status: covered
      - id: PKT-05
        title: "A wrong parity byte is detected -- and the packet still delivered"
        stimulus: "parity_type == BAD_PARITY flips one bit of the correct parity (yapp_pkt_seq, yapp_coverage_seq, 20 % in yapp_88_packets_seq)."
        check: "parity_err_cnt_reg equals the monitor's num_bad_parity; error pulses once per bad packet (error_pulse_checker); the scoreboard still matches the packet (the router forwards it -- see Decisions in dut/spec.md)."
        coverage: "parity_cp, len_x_addr_x_parity (REQ3)"
        tests: [reg_function_test, parity_error_test, test_uvc_integration]
        status: covered
  - id: IN
    title: "Input port protocol"
    spec: "Project Overview p. 7 -- Input Port Protocol"
    doc: dut/spec.md#input-port-protocol
    summary: "Driven on the falling edge, sampled on the rising edge; in_data_vld frames header and payload; in_suspend stalls the sender; error pulses 1..10 cycles after a bad packet."
    items:
      - id: IN-01
        title: "in_data_vld rises with the header; one byte per falling edge"
        stimulus: "yapp_if.send_to_dut in every packet test."
        check: "DUT, driver and monitor agree on one rule -- a byte is accepted at a rising edge with in_suspend low; a disagreement shows as a parity error or a scoreboard mismatch."
        tests: [yapp_012_test, simple_test, coverage_test]
        status: covered
      - id: IN-02
        title: "in_data_vld is low with the parity byte"
        stimulus: "Every packet: the driver drops in_data_vld on the falling edge after the last payload byte."
        check: "The DUT's PARITY state takes the next accepted byte regardless of in_data_vld; the monitor samples the parity the same way; the packet count in the DUT (mem_size_reg, counters) matches."
        tests: [simple_test, reg_function_test, pkt_mem_test]
        status: covered
      - id: IN-03
        title: "in_suspend: the input holds while the target FIFO is full"
        stimulus: "Slow receivers (channel_rx_slow_seq, 20..40 cycles) and 40..63-byte packets, so the 16-byte FIFO fills before the receiver starts."
        check: "in_suspend rose at least once; scoreboard 6 matched, 0 mismatched, 0 unexpected; no parity error at the monitor (every byte accepted exactly once)."
        tests: [backpressure_test]
        status: covered
        note: "Writing this test showed that yapp_if.wait_accept() sampled in_suspend on the falling edge; it now samples the rising edge, like the DUT and the monitor (see components/driver.md)."
      - id: IN-04
        title: "error asserts 1 to 10 cycles after a bad-parity packet"
        stimulus: "12 packets with bad parity (parity_error_test)."
        check: "error_pulse_checker: exactly one pulse per bad packet, 1..10 cycles after the parity byte was accepted; a pulse with no bad packet before it is an error."
        tests: [parity_error_test, test_uvc_integration]
        status: covered
  - id: OUT
    title: "Output port protocol"
    spec: "Project Overview p. 8 -- Output Port Protocol (Channel Ports)"
    doc: dut/spec.md#output-channel-protocol
    summary: "16-byte FIFO per channel; data_vld_x with the byte, the receiver reads on the falling edge and de-asserts suspend_x; a new byte every rising edge while suspend_x is low."
    items:
      - id: OUT-01
        title: "data_vld_x, suspend_x and one byte per rising edge"
        stimulus: "channel_if.receive_packet in every scoreboard test: the receiver reads length + 2 bytes after it drops suspend_x."
        check: "The channel monitor collects exactly length + 2 bytes (a wrong handshake would duplicate or skip a byte and the scoreboard would mismatch); the address check never fires."
        tests: [simple_test, router_simple_mcseq_test, coverage_test]
        status: covered
      - id: OUT-02
        title: "The receiver may answer late: the header is held"
        stimulus: "channel_rx_resp_seq: response delay 0..10 cycles per packet; channel_rx_slow_seq: 20..40."
        check: "Scoreboard compare: the header read after the delay is still the header."
        tests: [simple_test, router_simple_mcseq_test, backpressure_test]
        status: covered
      - id: OUT-03
        title: "The FIFO is 16 bytes deep"
        stimulus: "Packets longer than 16 bytes with a receiver that waits 20..40 cycles: the FIFO fills, the router stalls the input."
        check: "in_suspend seen (backpressure_test); no byte lost (scoreboard); the FIFO never overflows (a lost byte would show as a parity error)."
        tests: [backpressure_test, scoreboard_drop_test]
        status: covered
      - id: OUT-04
        title: "suspend_x is re-asserted at the parity byte: the next packet waits"
        stimulus: "Back-to-back packets to the same channel (0,1,2,0,1,2 and the boundary sequence)."
        check: "The second packet's header is held in the FIFO until the receiver answers again; the scoreboard matches both in order."
        tests: [router_simple_mcseq_test, router_filter_test, backpressure_test]
        status: covered
      - id: OUT-05
        title: "All three channels busy at the same time"
        stimulus: "Random addresses with slow receivers: packets to channels 0, 1 and 2 are in flight together."
        check: "Scoreboard: every channel matched, nothing unexpected."
        tests: [backpressure_test, coverage_test]
        status: covered
  - id: REG
    title: "Registers"
    spec: "Project Overview p. 9, Lab 11 p. 49 -- Packet Router DUT Registers"
    doc: dut/spec.md#registers
    summary: "ctrl_reg (maxpktsize) and en_reg are RW, the six counters and mem_size_reg are RO; reset values 0x3f, 0x01 and 0x00."
    items:
      - id: REG-01
        title: "Reset values"
        stimulus: "uvm_reg_hw_reset_seq reads every register right after reset."
        check: "The built-in sequence compares each read with the model's reset value: ctrl_reg 0x3f, en_reg 0x01, counters and mem_size_reg 0x00."
        tests: [uvm_reset_test]
        status: covered
      - id: REG-02
        title: "RW registers: every bit can be written and read back"
        stimulus: "Walking one, walking zero, 0x00, 0xff, 0xaa, 0x55 through ctrl_reg and en_reg (20 patterns each)."
        check: "After each write the front-door read and the backdoor peek return the pattern; the reserved bits ctrl_reg[7:6] and en_reg[3] hold their value (they are RW in the router)."
        tests: [reg_bit_walk_test, reg_access_test]
        status: covered
      - id: REG-03
        title: "RO registers ignore writes"
        stimulus: "Front-door writes to every counter and to mem_size_reg (register model) and a raw HBUS write to 0x1004."
        check: "peek after the write shows the poked value, the read shows 0x00 after the raw write."
        tests: [reg_access_test, reg_introspection_test, reg_bit_walk_test, hbus_protocol_test]
        status: covered
      - id: REG-04
        title: "Front door and backdoor see the same flip-flops"
        stimulus: "write -> peek and poke -> read on a RW register; poke -> read on a RO register (-access +rwc)."
        check: "The values agree; the HDL paths of the model (hw_top.dut.u_regs.<reg>) resolve."
        tests: [reg_access_test, reg_introspection_test]
        status: covered
      - id: REG-05
        title: "Unmapped addresses read 0x00 and ignore writes"
        stimulus: "Write 0xa5 then read 0x1002, 0x1003, 0x1007, 0x1008, 0x100c, 0x100e, 0x100f and 0x1050 with raw HBUS sequences."
        check: "Every read returns 0x00."
        tests: [hbus_protocol_test]
        status: covered
      - id: REG-06
        title: "mem_size_reg holds the payload length of the last packet"
        stimulus: "A 20-byte packet, then a 9-byte packet that is dropped as oversized."
        check: "mem_size_reg reads 20, then 9 (only bits [5:0] are used)."
        tests: [pkt_mem_test]
        status: covered
      - id: REG-07
        title: "Automatic checking on read (check_on_read + predict)"
        stimulus: "The reg_function_test stimulus with set_check_on_read(1); predict() loads the expected counter before each read."
        check: "The map compares every read with the mirror and raises UVM_ERROR on a difference."
        tests: [reg_function_check_test]
        status: covered
  - id: DROP
    title: "Drop rules"
    spec: "Project Overview p. 10 -- maxpktsize, router_en, counters"
    doc: dut/spec.md#behaviour-rules
    summary: "The whole packet is dropped when length > maxpktsize, when the router is disabled, or when the address is 3; changing the enables mid-packet is undefined."
    items:
      - id: DROP-01
        title: "length > maxpktsize drops the whole packet"
        stimulus: "maxpktsize = 20 with full-size packets (scoreboard_drop_test, test_uvc_integration); maxpktsize = 10 with lengths 9, 10, 11 and 63 (router_filter_test)."
        check: "Nothing of the packet appears on the channel: the reference model drops it and the scoreboard sees nothing unexpected; `ROUTER DROPS PACKET ... length > maxpktsize`; length == maxpktsize still passes."
        tests: [router_filter_test, scoreboard_drop_test, test_uvc_integration]
        status: covered
      - id: DROP-02
        title: "router_en = 0 drops every packet"
        stimulus: "en_reg = 0xfe, then yapp_012_seq; en_reg = 0xff, yapp_012_seq again."
        check: "Channel monitors collect nothing while disabled, the reference model reports 3 dropped (router disabled), no counter and not mem_size_reg moves; after re-enabling the packets flow and the address counters read 1."
        tests: [router_disable_test]
        status: covered
      - id: DROP-03
        title: "Address 3 drops the packet"
        stimulus: "As PKT-03."
        check: "Reference model drop, no unexpected channel packet, `ROUTER DROPS PACKET ... illegal address`."
        tests: [router_filter_test, coverage_test, test_uvc_integration]
        status: covered
      - id: DROP-04
        title: "An oversized packet to address 3 counts in both counters"
        stimulus: "The 11- and 63-byte packets to address 3 of yapp_boundary_seq."
        check: "oversized_pkt_cnt_reg counts them and addr3_cnt_reg counts them (the DUT evaluates the conditions independently -- see Decisions in dut/spec.md)."
        tests: [router_filter_test]
        status: covered
      - id: DROP-05
        title: "Changing router_en or a counter enable in the middle of a packet"
        stimulus: "--"
        check: "--"
        tests: []
        status: excluded
        note: "The specification declares the behaviour undefined, so no test drives it; every test programs the registers between packets."
  - id: CNT
    title: "Counters"
    spec: "Project Overview p. 10 -- The router counters"
    doc: dut/spec.md#registers
    summary: "Six 8-bit counters, each behind an enable bit of en_reg: parity errors, oversized packets, and one per address including the illegal 3."
    items:
      - id: CNT-01
        title: "A counter counts only while its enable bit is set"
        stimulus: "en_reg = 0x01 then 0xff around yapp_012_seq (address counters); 0xff then 0x01 around yapp_boundary_seq (oversized, addr3, addrN); 0x03 then 0x01 around bad packets (parity)."
        check: "The counters read 0 (or stay frozen) while disabled and the exact packet count while enabled."
        tests: [reg_function_test, router_filter_test, parity_error_test]
        status: covered
      - id: CNT-02
        title: "addrN_cnt_reg counts every received packet with address N"
        stimulus: "yapp_boundary_seq: 4 packets per address, half of them dropped as oversized."
        check: "addr0/1/2_cnt_reg read 4 each: dropped packets are counted too (they were received -- see Decisions); yapp_012_seq twice gives 2 each."
        tests: [router_filter_test, reg_function_test]
        status: covered
      - id: CNT-03
        title: "parity_err_cnt_reg counts the bad-parity packets"
        stimulus: "yapp_012_seq twice (random parity) and 8 + 4 deliberately bad packets."
        check: "The register equals the YAPP monitor's num_bad_parity delta, then 8, then still 8 with the enable off."
        tests: [reg_function_test, parity_error_test]
        status: covered
      - id: CNT-04
        title: "oversized_pkt_cnt_reg counts packets longer than maxpktsize"
        stimulus: "8 oversized packets of yapp_boundary_seq (11 and 63 bytes against maxpktsize 10); none in reg_function_test (maxpktsize 63)."
        check: "Reads 8, then 0 in reg_function_test."
        tests: [router_filter_test, reg_function_test]
        status: covered
      - id: CNT-05
        title: "addr3_cnt_reg counts packets to address 3"
        stimulus: "4 packets to address 3 (yapp_boundary_seq); none in yapp_012_seq."
        check: "Reads 4, and 0 in reg_function_test."
        tests: [router_filter_test, reg_function_test]
        status: covered
      - id: CNT-06
        title: "Counter overflow after 255 packets"
        stimulus: "257 one-byte packets to address 0 with every counter enabled."
        check: "addr0_cnt_reg reads 255 after 255 packets, 0 after the 256th (it wraps, it does not saturate), 1 after the 257th."
        tests: [counter_wrap_test]
        status: covered
        note: "The specification is silent; wrapping is the decision recorded in dut/spec.md. Every counter is the same `+ 8'd1` in yapp_hbus_regs, so one counter stands for all six."
  - id: MEM
    title: "Memories"
    spec: "Project Overview p. 10, Lab 11 p. 50 -- Router Memories"
    doc: dut/spec.md#memories
    summary: "yapp_pkt_mem (64 bytes, RO) holds the last packet received; yapp_mem (256 bytes, RW) is scratch memory."
    items:
      - id: MEM-01
        title: "yapp_pkt_mem holds the last packet, byte by byte"
        stimulus: "A 20-byte packet to address 1 whose content the sequence keeps in req."
        check: "yapp_pkt_mem[0] == {length, addr}, yapp_pkt_mem[1..20] == payload[0..19], read through the register model."
        tests: [pkt_mem_test]
        status: covered
      - id: MEM-02
        title: "yapp_pkt_mem is read-only"
        stimulus: "A raw HBUS write to 0x1010 with the inverted header."
        check: "yapp_pkt_mem[0] still reads the header."
        tests: [pkt_mem_test]
        status: covered
      - id: MEM-03
        title: "A dropped packet is still stored"
        stimulus: "maxpktsize = 5 and a 9-byte packet."
        check: "mem_size_reg reads 9 and the bytes are in yapp_pkt_mem: the packet was received, just not forwarded (Decisions in dut/spec.md)."
        tests: [pkt_mem_test]
        status: covered
      - id: MEM-04
        title: "yapp_mem: every byte can be written and read back"
        stimulus: "uvm_mem_walk_seq: writes and reads the 256 bytes with a walking pattern; with +define+INJECT_ERROR the RTL flips bit 3 of address 0x2a."
        check: "The built-in sequence compares; 0 errors without the define, one UVM_ERROR with it (yapp_mem[42]). The regression runs both builds; the second one passes only if the error is reported."
        tests: [uvm_mem_walk_test]
        status: covered
  - id: HBUS
    title: "Host port (HBUS)"
    spec: "Project Overview p. 11 -- Host Interface Port Protocol"
    doc: dut/spec.md#hbus-host-protocol
    summary: "One-cycle writes and two-cycle reads driven on the falling edge; hdata is bidirectional and tri-stated by the DUT when hen is low."
    items:
      - id: HBUS-01
        title: "Write: hen and hwr_rd for one cycle, data latched on the rising edge"
        stimulus: "Every register write (hbus_if.hbus_write): raw sequences and the register model's front door."
        check: "The value is read back (hbus_protocol_test, every reg test); the HBUS monitor decodes one WRITE per access."
        tests: [hbus_protocol_test, router_simple_mcseq_test, reg_access_test]
        status: covered
      - id: HBUS-02
        title: "Read: haddr sampled in cycle 1, hdata driven by the DUT in cycle 2"
        stimulus: "Every register read (hbus_if.hbus_read); hbus_read_max_pkt_seq after each maxpktsize write."
        check: "The value read equals what was written or poked (20 and 63 in router_simple_mcseq_test, 0x2a in hbus_protocol_test); the monitor decodes one READ."
        tests: [hbus_protocol_test, router_simple_mcseq_test, reg_access_test]
        status: covered
      - id: HBUS-03
        title: "hdata is tri-stated when hen drops"
        stimulus: "A read, then two idle cycles."
        check: "hbus_if.hdata_w reads 'z (the master's output enable is off, so only the DUT could still drive it)."
        tests: [hbus_protocol_test]
        status: covered
      - id: HBUS-04
        title: "Back-to-back accesses"
        stimulus: "uvm_mem_walk_seq (511 writes and 255 reads with no gap), the 20-pattern walks of reg_bit_walk_test."
        check: "Every read returns the expected value; the monitor count equals the number of accesses."
        tests: [uvm_mem_walk_test, reg_bit_walk_test]
        status: covered
      - id: HBUS-05
        title: "The register model's front door is HBUS traffic"
        stimulus: "write()/read() through yapp_rm.default_map and the hbus_reg_adapter."
        check: "The HBUS monitor logs the cycles, and the reference model mirrors maxpktsize and router_en from them (the drop rules follow the model's writes in router_disable_test and router_filter_test)."
        tests: [reg_function_test, router_disable_test, router_filter_test]
        status: covered
  - id: COV
    title: "Functional coverage"
    spec: "Lab 10 p. 47 -- REQ1, REQ2, REQ3"
    doc: labs/lab10.md
    summary: "The coverage model in yapp_tx_monitor: length buckets, every address including the illegal one, and every length to every legal address with bad parity."
    items:
      - id: COV-01
        title: "REQ1: all packet lengths, bucketed"
        stimulus: "yapp_coverage_seq: 1, 5, 20, 50, 63."
        check: "length_cp bins MIN, SMALL, MEDIUM, LARGE, MAX all hit; the monitor report prints 100 %."
        coverage: "length_cp"
        tests: [coverage_test]
        status: covered
      - id: COV-02
        title: "REQ2: every address received a packet, including the illegal one"
        stimulus: "yapp_coverage_seq: addresses 0..3."
        check: "addr_cp bins legal[0..2] and illegal_addr hit."
        coverage: "addr_cp"
        tests: [coverage_test]
        status: covered
      - id: COV-03
        title: "REQ3: every length bucket to every legal address with a parity error"
        stimulus: "yapp_coverage_seq: each length with BAD_PARITY to addresses 0..2."
        check: "The cross len_x_addr_x_parity (good parity and address 3 ignored) reaches 15 of 15 bins."
        coverage: "len_x_addr_x_parity"
        tests: [coverage_test]
        status: covered
  - id: TB
    title: "Testbench mechanics"
    spec: "Labs 2-9 -- the course's own tests"
    doc: labs/index.md
    summary: "What the lab tests prove about the environment itself: topology, factory, configuration, sequences, virtual interfaces, the virtual sequencer and the scoreboard."
    items:
      - id: TB-01
        title: "The test builds the testbench and the run ends cleanly"
        stimulus: "base_test alone: no sequence, drain time 200 ns."
        check: "print_topology shows uvm_test_top with router_tb below; UVM_ERROR : 0; check_config_usage reports nothing unused."
        tests: [base_test]
        status: covered
      - id: TB-02
        title: "A factory type override replaces the packet type everywhere"
        stimulus: "set_type_override_by_type(yapp_packet, short_yapp_packet) before the environment is built."
        check: "Every printed packet is a short_yapp_packet with length < 15; the sequences were not touched."
        tests: [short_packet_test, incr_payload_test, exhaustive_seq_test, simple_test, router_simple_mcseq_test]
        status: covered
      - id: TB-03
        title: "Configuration through the database, checked for use"
        stimulus: "is_active = UVM_PASSIVE on the YAPP agent; configure_sequences() overridden to set nothing."
        check: "The topology has no driver and no sequencer under the agent; no `never used` configuration report."
        tests: [set_config_test]
        status: covered
      - id: TB-04
        title: "The sequence library: sub-sequences and post_randomize shaping"
        stimulus: "yapp_exhaustive_seq starts every library sequence once; yapp_incr_payload_seq rewrites the payload to 0 1 2 ..."
        check: "One `Executing` line per sequence, the expected packet counts, the incrementing payload."
        tests: [exhaustive_seq_test, incr_payload_test]
        status: covered
      - id: TB-05
        title: "The virtual interface connects the driver to the DUT"
        stimulus: "yapp_012_seq through yapp_if into hw_top.dut."
        check: "Each packet appears on data_0, data_1, data_2 in the waveform; later the channel monitors confirm it."
        tests: [yapp_012_test, simple_test]
        status: covered
      - id: TB-06
        title: "A multichannel sequence coordinates HBUS and YAPP"
        stimulus: "router_simple_mcseq on the virtual sequencer: program, read back, send, reprogram, send."
        check: "The log shows the sub-sequences in order; the read-backs return 20 and 63."
        tests: [router_simple_mcseq_test]
        status: covered
      - id: TB-07
        title: "The scoreboard notices a wrong packet"
        stimulus: "Full-size packets while maxpktsize is 20, without the reference model (Lab 9A)."
        check: "Expected PKT_COMPARE errors and packets left in the queues: the negative test of the checker itself."
        tests: [scoreboard_drop_test]
        status: covered
      - id: TB-08
        title: "The register model describes itself"
        stimulus: "get_registers() and find() by get_rights()."
        check: "2 RW and 7 RO registers listed, then the access checks run on all of them."
        tests: [reg_introspection_test]
        status: covered


layout:
  hierarchy:
    root:
      # the overview scene: UVM side above, hardware below
      rows:
        - [tb_top]
        - [hw_top]
    tb_top:
      rows: [[uvm_test_top]]
    uvm_test_top:
      rows: [[tb]]
    tb:
      rows:
        - [yapp, hbus, chan0, chan1, chan2, clk_rst]
        - [mcseqr, router_module, yapp_rm, reg2hbus]
    hw_top:
      # like the course figure: YAPP / clock / HBUS on the left, the DUT in the middle,
      # the three output channels on the right
      columns:
        - [in0, clk_rst_if, clkgen, hbus0]
        - [dut]
        - [ch0, ch1, ch2]
    # the DUT as a block diagram: pins written inside, a registers block (regmap.yaml);
    # every pin group names the hw_top instance whose arrow lands on it
    hw_top.dut:
      style: dut_spec
      pin_groups:
        - {side: left,  from: hw_top.in0,        pins: [in_data, in_data_vld, in_suspend]}
        - {side: left,  from: hw_top.clkgen,     pins: [clock]}
        - {side: left,  from: hw_top.clk_rst_if, pins: [reset]}
        - {side: left,  from: hw_top.hbus0,      pins: [hdata, haddr, hen, hwr_rd]}
        - {side: right, from: hw_top.ch0,        pins: [data_0, data_vld_0, suspend_0]}
        - {side: right, from: hw_top.ch1,        pins: [data_1, data_vld_1, suspend_1]}
        - {side: right, from: hw_top.ch2,        pins: [data_2, data_vld_2, suspend_2]}
        - {side: right,                          pins: [error]}
      rows:
        - [u_input_fsm, u_error_timer]
        - ["g_ch[0].u_ch", "g_ch[1].u_ch", "g_ch[2].u_ch"]
        - [u_regs]
    tb.yapp.agent:
      rows: [[sequencer, driver], [monitor]]
    tb.hbus:
      rows: [["masters[0]", monitor]]
    tb.router_module:
      rows: [[reference, scoreboard]]
  # the Environment view (course figure): the test, the testbench with every UVC opened down to
  # sequencer / driver / monitor, the interfaces and the DUT; one role line per box
  env:
    tb:
      rows:
        - [yapp, hbus, chan0, chan1, chan2, clk_rst]
        - [mcseqr, router_module, yapp_rm, reg2hbus]
    tb.yapp.agent:
      rows: [[sequencer], [driver], [monitor]]
    tb.hbus:
      rows: [["masters[0]"], [monitor]]
    tb.hbus.masters[0]:
      rows: [[sequencer], [driver]]
    tb.chan0.rx_agent:
      rows: [[sequencer], [driver], [monitor]]
    tb.chan1.rx_agent:
      rows: [[sequencer], [driver], [monitor]]
    tb.chan2.rx_agent:
      rows: [[sequencer], [driver], [monitor]]
    tb.clk_rst.agent:
      rows: [[sequencer], [driver]]
    tb.router_module:
      rows: [[reference], [scoreboard]]
    hw_top:
      columns:
        - [in0, clk_rst_if, clkgen, hbus0]
        - [dut]
        - [ch0, ch1, ch2]
