# annotations.yaml -- the hand-written half of the project map.
#
# extract.py reads the structure from the SystemVerilog; this file adds what a
# compiler cannot know: what each piece is FOR, which lab introduces it, where
# it is explained, and how the pictures should be arranged.
#
# Keys
#   root_test       the test class the instance tree is built from
#   sources         run.f files to extract (first = primary, others add classes / variants)
#   groups          package -> display group (used by the Classes view and colours)
#   labs            lab directory -> label + docs page (course order = key order)
#   lab_overrides   class name or node id -> lab label (when the text scan is wrong)
#   array_sizes     instance path of a dynamic array -> how many elements to show
#   notes           node id -> short note shown in the panel
#   kinds           kind -> label, colour, default doc page, one-line role
#   classes         class name -> summary (one line) + description (markdown)
#   nodes           node id -> summary / description / docs overrides
#   extra_flows     module connections the port analysis cannot see (assign statements)
#   layout          placement hints for the hierarchy scenes

root_test: base_test

sources:
  - yapp_project/tb/run.f            # the complete project: RAL, mcseqr, module UVC with exports
  - labs/lab10_cov/tb/run.f          # pre-RAL tests (simple, mcseq, integration, coverage)
  - labs/lab09_sbd/tb/run.f          # fifo_sb variant of the testbench + scoreboard_drop_test
  - labs/lab06_vif/tb/run.f          # the Lab 4-6 tests (factory override, config, sequences, first DUT packets)

