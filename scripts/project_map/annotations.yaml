  hbus_pkg:            {label: "HBUS UVC",          color: hbus}
  channel_pkg:         {label: "Channel UVC",       color: channel}
  clock_and_reset_pkg: {label: "Clock & Reset UVC", color: clock}
  router_module_pkg:   {label: "Router module UVC", color: router}
  yapp_router_reg_pkg: {label: "Register model",    color: reg}
  tb_top:              {label: "Testbench & tests",  color: tb}

