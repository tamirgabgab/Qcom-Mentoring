  lab02_test:     {label: "2",   page: labs/lab02.md,  title: "Test and testbench"}
  lab03_uvc:      {label: "3",   page: labs/lab03.md,  title: "A simple UVC"}
  lab04_factory:  {label: "4",   page: labs/lab04.md,  title: "Factories"}
  lab05_seq:      {label: "5",   page: labs/lab05.md,  title: "Sequences"}
