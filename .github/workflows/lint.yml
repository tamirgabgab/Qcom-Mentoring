name: lint

on:
  push:
  pull_request:

jobs:
  slang-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyslang and the project-map tools
        run: pip install pyslang==12.0.0 pyyaml jinja2

      - name: Fetch the UVM library source (lint only)
        run: bash scripts/get_uvm.sh

      - name: Check the SystemVerilog code style
        run: python3 scripts/sv_style.py --check

      - name: Elaborate every lab with slang
        run: python3 scripts/lint.py --all --quiet

      - name: Check that the project map matches the source
        run: python3 -m scripts.project_map.build --check
