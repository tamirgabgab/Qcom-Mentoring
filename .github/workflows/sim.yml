name: sim

# Simulate every lab and the project with Verilator (scripts/sim.py,
# scripts/regress.yaml): one job per simulation directory, in parallel.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benches:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import json, yaml; print('list=' + json.dumps(list(yaml.safe_load(open('scripts/regress.yaml'))['benches'])))" >> "$GITHUB_OUTPUT"

  regress:
    needs: benches
    runs-on: ubuntu-latest
    container: verilator/verilator:v5.052
    strategy:
      fail-fast: false
      matrix:
        bench: ${{ fromJSON(needs.benches.outputs.list) }}
    name: ${{ matrix.bench }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the UVM pieces Verilator needs
        run: bash scripts/setup_sim.sh

      - name: Compile and run every test
        run: python3 scripts/sim.py regress --only "${{ matrix.bench }}"

      - name: Report
        if: always()
        run: cat build/sim/regress.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Functional coverage, merged over the runs of the bench
        if: always()
        run: python3 scripts/coverage_report.py --md >> "$GITHUB_STEP_SUMMARY" || true

      # The report of the bench (scripts/sim_report.py, without waves): index.md, runs.json, one folder
      # per run with its log and timeline, coverage.md / .json. Download it from the run's Artifacts.
      - name: Bundle the logs into a report
        if: always()
        run: python3 scripts/sim_report.py --only "${{ matrix.bench }}" --out build/sim/report || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ strategy.job-index }}
          path: build/sim/report
          if-no-files-found: ignore

      - name: Keep the compile logs of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ strategy.job-index }}
          path: build/sim/**/compile.log
          if-no-files-found: ignore
