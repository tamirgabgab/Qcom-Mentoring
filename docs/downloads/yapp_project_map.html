e":14,"file":"yapp/sv/yapp_packet.sv","group":"yapp_pkg","group_label":"YAPP UVC","id":"cls:parity_type_e","kind":"enum","kind_label":"Enum","lab":"1","line":14,"name":"parity_type_e","parent":null,"scope":"cls","summary":"enum: GOOD_PARITY, BAD_PARITY","type":"parity_type_e","values":["GOOD_PARITY","BAD_PARITY"]},"cls:reg_access_test":{"base":"base_test","base_full":"base_test","chain":["base_test","uvm_test","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class reg_access_test extends base_test;\n\n  // Convenience handle to the register block (path from the topology report)\n  yapp_regs_c regs;\n\n  `uvm_component_utils(reg_access_test)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n  endfunction : new\n\n  function void configure_sequences();\n    set_clock_and_channel_sequences();\n  endfunction : configure_sequences\n\n  function void connect_phase(uvm_phase phase);\n    regs = tb.yapp_rm.router_yapp_regs;\n  endfunction : connect_phase\n\n  task run_phase(uvm_phase phase);\n    super.run_phase(phase);                   // drain time\n    phase.raise_objection(this);\n    access_checks();\n    phase.drop_objection(this);\n  endtask : run_phase\n\n  // The stimulus of this test; derived tests replace it\n  virtual task access_checks();\n    check_rw_register(regs.ctrl_reg,      8'h25, 8'h1a);\n    check_ro_register(regs.addr0_cnt_reg, 8'h5a, 8'h33);\n  endtask : access_checks\n\n  // RW: front-door write -> peek, poke -> front-door read\n  task check_rw_register(uvm_reg rg, uvm_reg_data_t wr_val, uvm_reg_data_t poke_val);\n    uvm_status_e   status;\n    uvm_reg_data_t val;\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"--- RW register %s ---\", rg.get_name()), UVM_NONE)\n\n    rg.write(status, wr_val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"front-door write 0x%02h\", wr_val), UVM_NONE)\n    rg.peek(status, val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"peek            0x%02h\", val), UVM_NONE)\n    if (val != wr_val)\n      `uvm_error(\"REG_ACCESS\", $sformatf(\"%s: peek returned 0x%02h, expected 0x%02h\", rg.get_name(), val, wr_val))\n\n    rg.poke(status, poke_val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"poke            0x%02h\", poke_val), UVM_NONE)\n    rg.read(status, val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"front-door read 0x%02h\", val), UVM_NONE)\n    if (val != poke_val)\n      `uvm_error(\"REG_ACCESS\", $sformatf(\"%s: read returned 0x%02h, expected 0x%02h\", rg.get_name(), val, poke_val))\n  endtask : check_rw_register\n\n  // RO: poke -> front-door read, front-door write (ignored) -> peek unchanged\n  task check_ro_register(uvm_reg rg, uvm_reg_data_t poke_val, uvm_reg_data_t wr_val);\n    uvm_status_e   status;\n    uvm_reg_data_t val;\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"--- RO register %s ---\", rg.get_name()), UVM_NONE)\n\n    rg.poke(status, poke_val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"poke            0x%02h\", poke_val), UVM_NONE)\n    rg.read(status, val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"front-door read 0x%02h\", val), UVM_NONE)\n    if (val != poke_val)\n      `uvm_error(\"REG_ACCESS\", $sformatf(\"%s: read returned 0x%02h, expected 0x%02h\", rg.get_name(), val, poke_val))\n\n    rg.write(status, wr_val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"front-door write 0x%02h (RO: must be ignored)\", wr_val), UVM_NONE)\n    rg.peek(status, val);\n    `uvm_info(\"REG_ACCESS\", $sformatf(\"peek            0x%02h\", val), UVM_NONE)\n    if (val != poke_val)\n      `uvm_error(\"REG_ACCESS\", $sformatf(\"%s: RO register changed to 0x%02h after a write\", rg.get_name(), val))\n  endtask : check_ro_register\n\nendclass : reg_access_test","config_sets":[],"constraints":[],"description":"","docs":[{"title":"Test guide","url":"uvm/architecture.md"},{"title":"Lab 11C — Register tests","url":"labs/lab11c.md"}],"edges":["e133","e135","e136"],"end_line":198,"fields":[{"dims":null,"line":127,"name":"regs","rand":false,"randc":false,"role":"object","type":"yapp_regs_c"}],"file":"labs/lab11c_rm_sim/tb/router_test_lib.sv","group":"tb_top","group_label":"Testbench & tests","id":"cls:reg_access_test","item_type":null,"kind":"test","kind_label":"Test","lab":"11C","line":124,"methods":[{"ctor":true,"end_line":133,"kind":"function","line":131,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":137,"kind":"function","line":135,"name":"configure_sequences","static":false,"virtual":false},{"ctor":false,"end_line":141,"kind":"function","line":139,"name":"connect_phase","static":false,"virtual":false},{"ctor":false,"end_line":148,"kind":"task","line":143,"name":"run_phase","static":false,"virtual":false},{"ctor":false,"end_line":154,"kind":"task","line":151,"name":"access_checks","static":false,"virtual":true},{"ctor":false,"end_line":175,"kind":"task","line":157,"name":"check_rw_register","static":false,"virtual":false},{"ctor":false,"end_line":196,"kind":"task","line":178,"name":"check_ro_register","static":false,"virtual":false}],"name":"reg_access_test","notable_calls":[{"call":"raise_objection","line":145,"method":"run_phase","text":"phase.raise_objection"},{"call":"drop_objection","line":147,"method":"run_phase","text":"phase.drop_objection"}],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Hand-written RW / RO register checks, front door and backdoor.","type":"reg_access_test"},"cls:reg_function_check_test":{"base":"reg_function_test","base_full":"reg_function_test","chain":["reg_function_test","reg_access_test","base_test","uvm_test","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class reg_function_check_test extends reg_function_test;\n\n  `uvm_component_utils(reg_function_check_test)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n  endfunction : new\n\n  task run_phase(uvm_phase phase);\n    tb.yapp_rm.default_map.set_check_on_read(1);\n    super.run_phase(phase);\n  endtask : run_phase\n\n  // Load the expected value, then let read() do the comparison\n  virtual task check_counter(uvm_reg rg, uvm_reg_data_t expected);\n    uvm_status_e   status;\n    uvm_reg_data_t val;\n    void'(rg.predict(expected));\n    rg.read(status, val);                     // mismatch -> UVM_ERROR from the map\n    `uvm_info(\"REG_FUNC\", $sformatf(\"%s reads %0d (checked against predicted %0d)\",\n                                    rg.get_name(), val, expected), UVM_NONE)\n  endtask : check_counter\n\nendclass : reg_function_check_test","config_sets":[],"constraints":[],"description":"","docs":[{"title":"Test guide","url":"uvm/architecture.md"},{"title":"Lab 11C — Register tests","url":"labs/lab11c.md"}],"edges":["e134"],"end_line":304,"fields":[],"file":"labs/lab11c_rm_sim/tb/router_test_lib.sv","group":"tb_top","group_label":"Testbench & tests","id":"cls:reg_function_check_test","item_type":null,"kind":"test","kind_label":"Test","lab":"11C","line":281,"methods":[{"ctor":true,"end_line":287,"kind":"function","line":285,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":292,"kind":"task","line":289,"name":"run_phase","static":false,"virtual":false},{"ctor":false,"end_line":302,"kind":"task","line":295,"name":"check_counter","static":false,"virtual":true}],"name":"reg_function_check_test","notable_calls":[{"call":"set_check_on_read","line":290,"method":"run_phase","text":"tb.yapp_rm.default_map.set_check_on_read"}],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"set_check_on_read + predict(): the model checks every read itself.","type":"reg_function_check_test"},"cls:reg_function_test":{"base":"reg_access_test","base_full":"reg_access_test","chain":["reg_access_test","base_test","uvm_test","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class reg_function_test extends reg_access_test;\n\n  yapp_tx_sequencer yapp_seqr;\n  yapp_012_seq      seq;\n\n  `uvm_component_utils(reg_function_test)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n  endfunction : new\n\n  function void build_phase(uvm_phase phase);\n    super.build_phase(phase);\n    seq = yapp_012_seq::type_id::create(\"seq\");\n  endfunction : build_phase\n\n  function void connect_phase(uvm_phase phase);\n    super.connect_phase(phase);\n    yapp_seqr = tb.yapp.agent.sequencer;      // hierarchical path, no config\n  endfunction : connect_phase\n\n  virtual task access_checks();\n    uvm_status_e   status;\n    uvm_reg_data_t val;\n    int bad_before, bad_after;\n\n    // 1. router enabled, every counter disabled\n    regs.en_reg.write(status, 8'h01);\n    regs.en_reg.read(status, val);\n    `uvm_info(\"REG_FUNC\", $sformatf(\"en_reg reads 0x%02h\", val), UVM_NONE)\n    if (val != 8'h01)\n      `uvm_error(\"REG_FUNC\", $sformatf(\"en_reg reads 0x%02h, expected 0x01\", val))\n\n    seq.start(yapp_seqr);                     // 3 packets, counters off\n    check_counter(regs.addr0_cnt_reg, 0);\n    check_counter(regs.addr1_cnt_reg, 0);\n    check_counter(regs.addr2_cnt_reg, 0);\n    check_counter(regs.addr3_cnt_reg, 0);\n\n    // 2. every counter enabled\n    bad_before = tb.yapp.agent.monitor.num_bad_parity;\n    regs.en_reg.write(status, 8'hff);\n    seq.start(yapp_seqr);\n    seq.start(yapp_seqr);                     // 6 packets, 2 per address\n    bad_after = tb.yapp.agent.monitor.num_bad_parity;\n\n    check_counter(regs.addr0_cnt_reg, 2);\n    check_counter(regs.addr1_cnt_reg, 2);\n    check_counter(regs.addr2_cnt_reg, 2);\n    check_counter(regs.addr3_cnt_reg, 0);\n    check_counter(regs.parity_err_cnt_reg, bad_after - bad_before);\n    check_counter(regs.oversized_pkt_cnt_reg, 0);   // maxpktsize is 63 (reset)\n  endtask : access_checks\n\n  // Front-door read and compare\n  virtual task check_counter(uvm_reg rg, uvm_reg_data_t expected);\n    uvm_status_e   status;\n    uvm_reg_data_t val;\n    rg.read(status, val);\n    if (val != expected)\n      `uvm_error(\"REG_FUNC\", $sformatf(\"%s reads %0d, expected %0d\", rg.get_name(), val, expected))\n    else\n      `uvm_info(\"REG_FUNC\", $sformatf(\"%s reads %0d as expected\", rg.get_name(), val), UVM_NONE)\n  endtask : check_counter\n\nendclass : reg_function_test","config_sets":[],"constraints":[],"description":"","docs":[{"title":"Test guide","url":"uvm/architecture.md"},{"title":"Lab 11C — Register tests","url":"labs/lab11c.md"}],"edges":["e134","e135"],"end_line":272,"fields":[{"dims":null,"line":209,"name":"yapp_seqr","rand":false,"randc":false,"role":"child","type":"yapp_tx_sequencer"},{"dims":null,"line":210,"name":"seq","rand":false,"randc":false,"role":"sequence","type":"yapp_012_seq"}],"file":"labs/lab11c_rm_sim/tb/router_test_lib.sv","group":"tb_top","group_label":"Testbench & tests","id":"cls:reg_function_test","item_type":null,"kind":"test","kind_label":"Test","lab":"11C","line":207,"methods":[{"ctor":true,"end_line":216,"kind":"function","line":214,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":221,"kind":"function","line":218,"name":"build_phase","static":false,"virtual":false},{"ctor":false,"end_line":226,"kind":"function","line":223,"name":"connect_phase","static":false,"virtual":false},{"ctor":false,"end_line":259,"kind":"task","line":228,"name":"access_checks","static":false,"virtual":true},{"ctor":false,"end_line":270,"kind":"task","line":262,"name":"check_counter","static":false,"virtual":true}],"name":"reg_function_test","notable_calls":[{"call":"start","line":240,"method":"access_checks","text":"seq.start"},{"call":"start","line":249,"method":"access_checks","text":"seq.start"},{"call":"start","line":250,"method":"access_checks","text":"seq.start"}],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Sends packets and checks the counters through the register model.","type":"reg_function_test"},"cls:reg_introspection_test":{"base":"reg_access_test","base_full":"reg_access_test","chain":[" yte_reg_c":{"base":"uvm_reg","base_full":"uvm_reg","chain":["uvm_reg","uvm_object","uvm_void"],"children":[],"code":"  virtual class ro_byte_reg_c extends uvm_reg;\n\n    rand uvm_reg_field value;   // [7:0]\n\n    function new(string name);\n      super.new(name, 8, UVM_NO_COVERAGE);\n    endfunction : new\n\n    virtual function void build();\n      value = uvm_reg_field::type_id::create(\"value\");\n      value.configure(this, 8, 0, \"RO\", 0, 8'h00, 1, 0, 0);\n    endfunction : build\n\n  endclass : ro_byte_reg_c","config_sets":[],"constraints":[],"description":"","docs":[{"title":"Register guide","url":"components/register-model.md"},{"title":"Lab 11A — Register model generation","url":"labs/lab11a.md"}],"edges":["e82","e83","e84","e85","e130","e131","e132","e137"],"end_line":114,"fields":[{"dims":null,"line":103,"name":"value","rand":true,"randc":false,"role":"reg_field","type":"uvm_reg_field"}],"file":"labs/lab11c_rm_sim/tb/yapp_router_reg_pkg.sv","group":"yapp_router_reg_pkg","group_label":"Register model","id":"cls:ro_byte_reg_c","item_type":null,"kind":"reg","kind_label":"Register","lab":"11A","line":101,"methods":[{"ctor":true,"end_line":107,"kind":"function","line":105,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":112,"kind":"function","line":109,"name":"build","static":false,"virtual":true}],"name":"ro_byte_reg_c","notable_calls":[],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Base of the read-only 8-bit counters.","type":"ro_byte_reg_c"},"cls:router_fifo_scoreboard":{"base":"uvm_scoreboard","base_full":"uvm_scoreboard","chain":["uvm_scoreboard","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class router_fifo_scoreboard extends uvm_scoreboard;\n\n  // External connection points\n  uvm_analysis_export #(yapp_packet)      yapp_export;\n  uvm_analysis_export #(hbus_transaction) hbus_export;\n  uvm_analysis_export #(channel_packet)   chan_export[3];\n\n  // Storage\n  uvm_tlm_analysis_fifo #(yapp_packet)      yapp_fifo;\n  uvm_tlm_analysis_fifo #(hbus_transaction) hbus_fifo;\n  uvm_tlm_analysis_fifo #(channel_packet)   chan_fifo[3];\n\n  // Blocking readers\n  uvm_get_port #(yapp_packet)      yapp_get;\n  uvm_get_port #(hbus_transaction) hbus_get;\n  uvm_get_port #(channel_packet)   chan_get[3];\n\n  // Register mirror (DUT reset values)\n  bit [5:0] maxpktsize = 6'h3f;\n  bit       router_en  = 1'b1;\n\n  // Statistics\n  int packets_in, packets_matched, packets_mismatched;\n  int dropped_disabled, dropped_size, dropped_addr;\n\n  `uvm_component_utils(router_fifo_scoreboard)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n    yapp_export = new(\"yapp_export\", this);\n    hbus_export = new(\"hbus_export\", this);\n    yapp_fifo   = new(\"yapp_fifo\", this);\n    hbus_fifo   = new(\"hbus_fifo\", this);\n    yapp_get    = new(\"yapp_get\", this);\n    hbus_get    = new(\"hbus_get\", this);\n    foreach (chan_fifo[i]) begin\n      chan_export[i] = new($sformatf(\"chan%0d_export\", i), this);\n      chan_fifo[i]   = new($sformatf(\"chan%0d_fifo\", i), this);\n      chan_get[i]    = new($sformatf(\"chan%0d_get\", i), this);\n    end\n  endfunction : new\n\n  `include \"packet_compare.sv\"\n\n  function void connect_phase(uvm_phase phase);\n    // exports -> FIFO analysis exports (monitors write into the FIFOs)\n    yapp_export.connect(yapp_fifo.analysis_export);\n    hbus_export.connect(hbus_fifo.analysis_export);\n    // get ports -> FIFO get/peek exports (we read out of the FIFOs)\n    yapp_get.connect(yapp_fifo.get_peek_export);\n    hbus_get.connect(hbus_fifo.get_peek_export);\n    foreach (chan_fifo[i]) begin\n      chan_export[i].connect(chan_fifo[i].analysis_export);\n      chan_get[i].connect(chan_fifo[i].get_peek_export);\n    end\n  endfunction : connect_phase\n\n  task run_phase(uvm_phase phase);\n    fork\n      mirror_registers();\n      check_packets();\n    join\n  endtask : run_phase\n\n  // Parallel thread: keep the register mirror current\n  task mirror_registers();\n    hbus_transaction tr;\n    forever begin\n      hbus_get.get(tr);\n      if (tr.hwr_rd == HBUS_WRITE) begin\n        case (tr.haddr)\n          16'h1000: maxpktsize = tr.hdata[5:0];\n          16'h1001: router_en  = tr.hdata[0];\n          default: ;\n        endcase\n      end\n    end\n  endtask : mirror_registers\n\n  // Main thread: one YAPP packet at a time, in order\n  task check_packets();\n    yapp_packet    yp;\n    channel_packet cp;\n    forever begin\n      yapp_get.get(yp);                    // blocks until the monitor delivers one\n      packets_in++;\n      if (!router_en) begin\n        dropped_disabled++;\n        `uvm_info(get_type_name(), \"Packet dropped: router disabled\", UVM_LOW)\n      end else if (yp.addr == 2'd3) begin\n        dropped_addr++;\n        `uvm_info(get_type_name(), \"Packet dropped: illegal address 3\", UVM_LOW)\n      end else if (yp.length > maxpktsize) begin\n        dropped_size++;\n        `uvm_info(get_type_name(), $sformatf(\"Packet dropped: length %0d > maxpktsize %0d\",\n                                             yp.length, maxpktsize), UVM_LOW)\n      end else begin\n        chan_get[yp.addr].get(cp);         // blocks until the channel delivers it\n        if (comp_equal(yp, cp)) begin\n          packets_matched++;\n          `uvm_info(get_type_name(), $sformatf(\"Channel %0d packet matched\", yp.addr), UVM_MEDIUM)\n        end else begin\n          packets_mismatched++;\n          `uvm_error(get_type_name(), $sformatf(\"Channel %0d packet MISMATCH\\nexpected:\\n%s\\nreceived:\\n%s\",\n                                                yp.addr, yp.sprint(), cp.sprint()))\n        end\n      end\n    end\n  endtask : check_packets\n\n  // Every FIFO must be empty when the test ends\n  function void check_phase(uvm_phase phase);\n    if (yapp_fifo.used() != 0)\n      `uvm_error(get_type_name(), $sformatf(\"%0d YAPP packets still unchecked\", yapp_fifo.used()))\n    foreach (chan_fifo[i])\n      if (chan_fifo[i].used() != 0)\n        `uvm_error(get_type_name(), $sformatf(\"%0d packets left in channel %0d FIFO\", chan_fifo[i].used(), i))\n  endfunction : check_phase\n\n  function void report_phase(uvm_phase phase);\n    `uvm_info(get_type_name(), $sformatf({\"\\n--- FIFO scoreboard report ---\\n\",\n      \"  packets received  : %0d\\n\",\n      \"  packets matched   : %0d\\n\",\n      \"  packets mismatched: %0d\\n\",\n      \"  dropped (disabled/oversized/addr3): %0d / %0d / %0d\"},\n      packets_in, packets_matched, packets_mismatched,\n      dropped_disabled, dropped_size, dropped_addr), UVM_LOW)\n  endfunction : report_phase\n\nendclass : router_fifo_scoreboard","config_sets":[],"constraints":[],"description":"","docs":[{"title":"Scoreboard guide","url":"components/scoreboard.md"},{"title":"Lab 9D — Analysis FIFOs","url":"labs/lab09d.md"}],"edges":["e138"],"end_line":143,"fields":[{"dims":null,"line":17,"name":"yapp_export","rand":false,"randc":false,"role":"port","type":"uvm_analysis_export#(uvm_pkg::uvm_sequencer_param_base::RSP)"},{"dims":null,"line":18,"name":"hbus_export","rand":false,"randc":false,"role":"port","type":"uvm_analysis_export#(hbus_transaction)"},{"dims":"[3]","line":19,"name":"chan_export","rand":false,"randc":false,"role":"port","type":"uvm_analysis_export#(channel_packet)[0:2]"},{"dims":null,"line":22,"name":"yapp_fifo","rand":false,"randc":false,"role":"port","type":"uvm_tlm_analysis_fifo#(yapp_packet)"},{"dims":null,"line":23,"name":"hbus_fifo","rand":false,"randc":false,"role":"port","type":"uvm_tlm_analysis_fifo#(hbus_transaction)"},{"dims":"[3]","line":24,"name":"chan_fifo","rand":false,"randc":false,"role":"port","type":"uvm_tlm_analysis_fifo#(channel_packet)[0:2]"},{"dims":null,"line":27,"name":"yapp_get","rand":false,"randc":false,"role":"port","type":"uvm_get_port#(yapp_packet)"},{"dims":null,"line":28,"name":"hbus_get","rand":false,"randc":false,"role":"port" \n  // Inputs\n  uvm_analysis_imp_yapp #(yapp_packet,      router_reference) yapp_in;\n  uvm_analysis_imp_hbus #(hbus_transaction, router_reference) hbus_in;\n  // Output: packets the router is expected to deliver\n  uvm_analysis_port #(yapp_packet) yapp_valid_out;\n\n  // Mirrored register fields (reset values of the DUT)\n  bit [5:0] maxpktsize = 6'h3f;\n  bit       router_en  = 1'b1;\n\n  // Statistics\n  int packets_forwarded;\n  int dropped_disabled;\n  int dropped_size;\n  int dropped_addr;\n\n  `uvm_component_utils(router_reference)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n    yapp_in        = new(\"yapp_in\", this);\n    hbus_in        = new(\"hbus_in\", this);\n    yapp_valid_out = new(\"yapp_valid_out\", this);\n  endfunction : new\n\n  // Keep the register mirror up to date from the bus traffic\n  function void write_hbus(hbus_transaction tr);\n    if (tr.hwr_rd != HBUS_WRITE) return;\n    case (tr.haddr)\n      16'h1000: begin\n        maxpktsize = tr.hdata[5:0];\n        `uvm_info(get_type_name(), $sformatf(\"maxpktsize is now %0d\", maxpktsize), UVM_LOW)\n      end\n      16'h1001: begin\n        router_en = tr.hdata[0];\n        `uvm_info(get_type_name(), $sformatf(\"router_en is now %0d\", router_en), UVM_LOW)\n      end\n      default: ;\n    endcase\n  endfunction : write_hbus\n\n  // Same decision the RTL makes when the header arrives\n  function void write_yapp(yapp_packet pkt);\n    if (!router_en) begin\n      dropped_disabled++;\n      `uvm_info(get_type_name(), \"Packet dropped: router disabled\", UVM_LOW)\n    end else if (pkt.addr == 2'd3) begin\n      dropped_addr++;\n      `uvm_info(get_type_name(), \"Packet dropped: illegal address 3\", UVM_LOW)\n    end else if (pkt.length > maxpktsize) begin\n      dropped_size++;\n      `uvm_info(get_type_name(),\n                $sformatf(\"Packet dropped: length %0d > maxpktsize %0d\", pkt.length, maxpktsize), UVM_LOW)\n    end else begin\n      packets_forwarded++;\n      yapp_valid_out.write(pkt);\n    end\n  endfunction : write_yapp\n\n  function void report_phase(uvm_phase phase);\n    `uvm_info(get_type_name(), $sformatf({\"\\n--- Reference model report ---\\n\",\n      \"  forwarded to scoreboard   : %0d\\n\",\n      \"  dropped (router disabled) : %0d\\n\",\n      \"  dropped (oversized)       : %0d\\n\",\n      \"  dropped (address 3)       : %0d\"},\n      packets_forwarded, dropped_disabled, dropped_size, dropped_addr), UVM_LOW)\n  endfunction : report_phase\n\nendclass : router_reference","config_sets":[],"constraints":[],"description":"`write_hbus` updates the mirrored registers on every write to 0x1000/0x1001.\n`write_yapp` applies the DUT's drop rules (disabled, length > maxpktsize, addr == 3)\nand publishes survivors on `yapp_valid_out` -> scoreboard.\n","docs":[{"title":"Reference model guide","url":"components/reference-model.md"},{"title":"Lab 9B — Router module UVC","url":"labs/lab09b.md"}],"edges":["e143"],"end_line":85,"fields":[{"dims":null,"line":18,"name":"yapp_in","rand":false,"randc":false,"role":"port","type":"uvm_analysis_imp_yapp#(yapp_packet,router_reference)"},{"dims":null,"line":19,"name":"hbus_in","rand":false,"randc":false,"role":"port","type":"uvm_analysis_imp_hbus#(hbus_transaction,router_reference)"},{"dims":null,"line":21,"name":"yapp_valid_out","rand":false,"randc":false,"role":"port","type":"uvm_analysis_port#(yapp_packet)"},{"dims":null,"line":24,"name":"maxpktsize","rand":false,"randc":false,"role":"data","type":"bit[5:0]"},{"dims":null,"line":25,"name":"router_en","rand":false,"randc":false,"role":"data","type":"bit"},{"dims":null,"line":28,"name":"packets_forwarded","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":29,"name":"dropped_disabled","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":30,"name":"dropped_size","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":31,"name":"dropped_addr","rand":false,"randc":false,"role":"data","type":"int"}],"file":"router/sv/router_reference.sv","group":"router_module_pkg","group_label":"Router module UVC","id":"cls:router_reference","item_type":null,"kind":"reference","kind_label":"Reference model","lab":"9B","line":15,"methods":[{"ctor":true,"end_line":40,"kind":"function","line":35,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":56,"kind":"function","line":43,"name":"write_hbus","static":false,"virtual":false},{"ctor":false,"end_line":74,"kind":"function","line":59,"name":"write_yapp","static":false,"virtual":false},{"ctor":false,"end_line":83,"kind":"function","line":76,"name":"report_phase","static":false,"virtual":false}],"name":"router_reference","notable_calls":[],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Mirrors maxpktsize and router_en from the HBUS traffic and forwards only the packets the router will route.","type":"router_reference"},"cls:router_scoreboard":{"base":"uvm_scoreboard","base_full":"uvm_scoreboard","chain":["uvm_scoreboard","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class router_scoreboard extends uvm_scoreboard;\n\n  // TLM connection points\n  uvm_analysis_imp_yapp  #(yapp_packet,    router_scoreboard) yapp_in;\n  uvm_analysis_imp_chan0 #(channel_packet, router_scoreboard) chan0_in;\n  uvm_analysis_imp_chan1 #(channel_packet, router_scoreboard) chan1_in;\n  uvm_analysis_imp_chan2 #(channel_packet, router_scoreboard) chan2_in;\n\n  // Expected packets, one queue per output channel\n  yapp_packet pkt_q[3][$];\n\n  // Statistics\n  int packets_in;         // received from the YAPP monitor\n  int packets_matched;    // compared OK\n  int packets_mismatched; // compare failed\n  int packets_unexpected; // channel packet with an empty queue\n  int packets_dropped_addr3;\n\n  `uvm_component_utils(router_scoreboard)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n    yapp_in  = new(\"yapp_in\",  this);\n    chan0_in = new(\"chan0_in\", this);\n    chan1_in = new(\"chan1_in\", this);\n    chan2_in = new(\"chan2_in\", this);\n  endfunction : new\n\n  // The comparison function supplied with the lab\n  `include \"packet_compare.sv\"\n\n  //--------------------------------------------------------------------------\n  // YAPP side: the monitor passes a HANDLE, so clone before storing it\n  //--------------------------------------------------------------------------\n  function void write_yapp(yapp_packet packet);\n    yapp_packet pkt;\n    $cast(pkt, packet.clone());\n    packets_in++;\n    if (pkt.addr == 2'd3) begin\n      // Lab 9A assumes legal traffic only; keep the count honest anyway\n      packets_dropped_addr3++;\n      `uvm_warning(get_type_name(), \"Packet to illegal address 3 is not expected on any channel\")\n      return;\n    end\n    pkt_q[pkt.addr].push_back(pkt);\n    `uvm_info(get_type_name(),\n              $sformatf(\"Queued packet for channel %0d (%0d waiting)\", pkt.addr, pkt_q[pkt.addr].size()),\n              UVM_MEDIUM)\n  endfunction : write_yapp\n\n  //--------------------------------------------------------------------------\n  // Channel side\n  //--------------------------------------------------------------------------\n  function void write_chan0(channel_packet packet);\n    check_channel(0, packet);\n  endfunction : write_chan0\n\n  function void write_chan1(channel_packet packet);\n    check_channel(1, packet);\n  endfunction : write_chan1\n\n  function void write_chan2(channel_packet packet);\n    check_channel(2, packet);\n  endfunction : write_chan2\n\n  function void check_channel(int ch, channel_packet cp);\n    yapp_packet expected;\n    if (pkt_q[ch].size() == 0) begin\n      packets_unexpected++;\n      `uvm_error(get_type_name(),\n                 $sformatf(\"Channel %0d packet received but nothing was expected:\\n%s\", ch, cp.sprint()))\n      return;\n    end\n    expected = pkt_q[ch].pop_front();\n    if (comp_equal(expected, cp)) begin\n      packets_matched++;\n      `uvm_info(get_type_name(), $sformatf(\"Channel %0d packet matched\", ch), UVM_MEDIUM)\n    end else begin\n      packets_mismatched++;\n      `uvm_error(get_type_name(),\n                 $sformatf(\"Channel %0d packet MISMATCH\\nexpected:\\n%s\\nreceived:\\n%s\",\n                           ch, expected.sprint(), cp.sprint()))\n    end\n  endfunction : check_channel\n\n  //--------------------------------------------------------------------------\n  // End of test: the numbers must add up\n  //   packets_in == matched + mismatched + left in queues (+ addr 3)\n  //--------------------------------------------------------------------------\n  function void report_phase(uvm_phase phase);\n    `uvm_info(get_type_name(), $sformatf({\"\\n--- Scoreboard report ---\\n\",\n      \"  packets received  : %0d\\n\",\n      \"  packets matched   : %0d\\n\",\n      \"  packets mismatched: %0d\\n\",\n      \"  packets unexpected: %0d\\n\",\n      \"  packets to addr 3 : %0d\\n\",\n      \"  left in queue 0/1/2: %0d / %0d / %0d\"},\n      packets_in, packets_matched, packets_mismatched, packets_unexpected, packets_dropped_addr3,\n      pkt_q[0].size(), pkt_q[1].size(), pkt_q[2].size()), UVM_LOW)\n  endfunction : report_phase\n\nendclass : router_scoreboard","config_sets":[],"constraints":[],"description":"`write_yapp` clones the packet into `pkt_q[addr]`; `write_chan0/1/2` pop the head of\nthe matching queue and compare with `comp_equal()`. Counts matched / mismatched /\nunexpected; `report_phase` prints the totals. Packets to address 3 are dropped here\nin Lab 9A; from Lab 9B the reference model filters them first.\n","docs":[{"title":"Scoreboard guide","url":"components/scoreboard.md"},{"title":"Lab 9A — Scoreboard (TLM)","url":"labs/lab09a.md"}],"edges":["e144"],"end_line":117,"fields":[{"dims":null,"line":19,"name":"yapp_in","rand":false,"randc":false,"role":"port","type":"uvm_analysis_imp_yapp#(yapp_packet,router_scoreboard)"},{"dims":null,"line":20,"name":"chan0_in","rand":false,"randc":false,"role":"port","type":"uvm_analysis_imp_chan0#(channel_packet,router_scoreboard)"},{"dims":null,"line":21,"name":"chan1_in","rand":false,"randc":false,"role":"port","type":"uvm_analysis_imp_chan1#(channel_packet,router_scoreboard)"},{"dims":null,"line":22,"name":"chan2_in","rand":false,"randc":false,"role":"port","type":"uvm_analysis_imp_chan2#(channel_packet,router_scoreboard)"},{"dims":"[3]","line":25,"name":"pkt_q","rand":false,"randc":false,"role":"data","type":"yapp_packet[0:2][]"},{"dims":null,"line":28,"name":"packets_in","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":29,"name":"packets_matched","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":30,"name":"packets_mismatched","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":31,"name":"packets_unexpected","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":32,"name":"packets_dropped_addr3","rand":false,"randc":false,"role":"data","type":"int"}],"file":"router/sv/router_scoreboard.sv","group":"router_module_pkg","group_label":"Router module UVC","id":"cls:router_scoreboard","item_type":null,"kind":"scoreboard","kind_label":"Scoreboard","lab":"9A","line":16,"methods":[{"ctor":true,"end_line":42,"kind":"function","line":36,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":64,"kind":"function","line":50,"name":"write_yapp","static":false,"virtual":false},{"ctor":false,"end_line":71,"kind":"function","line":69,"name":"write_chan0","static":false,"virtual":false},{"ctor":false,"end_line":75,"kind":"function","line":73,"name":"write_chan1","static":false,"virtual":false},{"ctor":false,"end_line":79,"kind":"function","line":77,"name":"write_chan2","static":false,"virtual":false},{"ctor":false,"end_line":99,"kind":"function","line":81,"name":"check_channel","static":false,"virtual":false},{"ctor":false,"end_line":11 ence","type":"hbus_small_packet_seq"},{"dims":null,"line":46,"name":"hbus_large_seq","rand":false,"randc":false,"role":"sequence","type":"hbus_large_packet_seq"},{"dims":null,"line":47,"name":"hbus_read_seq","rand":false,"randc":false,"role":"sequence","type":"hbus_read_max_pkt_seq"},{"dims":null,"line":48,"name":"yapp_012","rand":false,"randc":false,"role":"sequence","type":"yapp_012_seq"},{"dims":null,"line":49,"name":"yapp_rnd","rand":false,"randc":false,"role":"sequence","type":"yapp_rnd_seq"}],"file":"labs/lab11c_rm_sim/tb/router_mcseqs_lib.sv","group":"tb_top","group_label":"Testbench & tests","id":"cls:router_simple_mcseq","item_type":null,"kind":"sequence","kind_label":"Sequence","lab":"8","line":43,"methods":[{"ctor":true,"end_line":55,"kind":"function","line":53,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":74,"kind":"task","line":57,"name":"body","static":false,"virtual":false}],"name":"router_simple_mcseq","notable_calls":[{"call":"start","line":61,"method":"body","text":""},{"call":"start","line":62,"method":"body","text":""},{"call":"start","line":66,"method":"body","text":""},{"call":"start","line":69,"method":"body","text":""},{"call":"start","line":70,"method":"body","text":""},{"call":"start","line":73,"method":"body","text":""}],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Programs maxpktsize = 20, sends 6 short packets, then maxpktsize = 63 and 6 random packets.","type":"router_simple_mcseq"},"cls:router_simple_mcseq_test":{"base":"base_test","base_full":"base_test","chain":["base_test","uvm_test","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class router_simple_mcseq_test extends base_test;\n\n  `uvm_component_utils(router_simple_mcseq_test)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n  endfunction : new\n\n  function void build_phase(uvm_phase phase);\n    set_type_override_by_type(yapp_packet::get_type(), short_yapp_pack = calc_parity();\n    if (parity_type == BAD_PARITY)\n      parity[$urandom_range(7, 0)] = ~parity[$urandom_range(7, 0)];\n  endfunction : set_parity\n\n  // Called automatically after every successful randomize()\n  function void post_randomize();\n    set_parity();\n  endfunction : post_randomize\n\nendclass : yapp_packet","config_sets":[],"constraints":[{"line":39,"name":"c_addr_legal","text":"constraint c_addr_legal  { addr != 2'd3; }"},{"line":40,"name":"c_length","text":"constraint c_length      { length inside {[1:63]}; payload.size() == length; }"},{"line":41,"name":"c_parity_dist","text":"constraint c_parity_dist { parity_type dist { GOOD_PARITY := 5, BAD_PARITY := 1 }; }"},{"line":42,"name":"c_delay","text":"constraint c_delay       { packet_delay inside {[1:20]}; }"}],"description":"One packet on the YAPP input port: header `{length[5:0], addr[1:0]}`, `length`\npayload bytes, then an even-parity byte. `parity_type` (GOOD 5 : BAD 1) decides\nwhether `set_parity()` corrupts the computed parity. `packet_delay` is the gap the\ndriver waits before sending. Built in Lab 1, used everywhere after.\n","docs":[{"title":"Sequence item guide","url":"components/packet.md"},{"title":"Lab 1 — Stimulus model","url":"labs/lab01.md"}],"edges":["e151","e173"],"end_line":67,"fields":[{"dims":null,"line":19,"name":"addr","rand":true,"randc":false,"role":"data","type":"bit[1:0]"},{"dims":null,"line":20,"name":"length","rand":true,"randc":false,"role":"data","type":"bit[5:0]"},{"dims":"[]","line":21,"name":"payload","rand":true,"randc":false,"role":"data","type":"bit[7:0][]"},{"dims":null,"line":22,"name":"parity","rand":false,"randc":false,"role":"data","type":"bit[7:0]"},{"dims":null,"line":25,"name":"parity_type","rand":true,"randc":false,"role":"data","type":"yapp_pkg::parity_type_e"},{"dims":null,"line":26,"name":"packet_delay","rand":true,"randc":false,"role":"data","type":"int"}],"file":"yapp/sv/yapp_packet.sv","group":"yapp_pkg","group_label":"YAPP UVC","id":"cls:yapp_p ,"type":"yapp_tx_sequencer"}],"file":"yapp/sv/yapp_tx_agent.sv","group":"yapp_pkg","group_label":"YAPP UVC","id":"cls:yapp_tx_agent","item_type":null,"kind":"agent","kind_label":"Agent","lab":"3","line":7,"methods":[{"ctor":true,"end_line":21,"kind":"function","line":19,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":30,"kind":"function","line":23,"name":"build_phase","static":false,"virtual":false},{"ctor":false,"end_line":35,"kind":"function","line":32,"name":"connect_phase","static":false,"virtual":false}],"name":"yapp_tx_agent","notable_calls":[],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Monitor always; driver + sequencer only when is_active == UVM_ACTIVE.","type":"yapp_tx_agent"},"cls:yapp_tx_driver":{"base":"uvm_driver","base_full":"uvm_driver#(yapp_packet,uvm_pkg::uvm_driver::REQ)","chain":["uvm_driver","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class yapp_tx_driver extends uvm_driver #(yapp_packet);\n\n  // Virtual interface, set by tb_top through yapp_vif_config\n  virtual interface yapp_if vif;\n\n  // Statistics\n  int num_sent;\n\n  `uvm_component_utils_begin(yapp_tx_driver)\n    `uvm_field_int(num_sent, UVM_ALL_ON | UVM_DEC)\n  `uvm_component_utils_end\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n  endfunction : new\n\n  function void connect_phase(uvm_phase phase);\n    if (!yapp_vif_config::get(this, \"\", \"vif\", vif))\n      `uvm_error(\"NOVIF\", {\"virtual interface must be set for: \", get_full_name(), \".vif\"})\n  endfunction : connect_phase\n\n  task run_phase(uvm_phase phase);\n    reset_signals();\n    get_and_drive();\n  endtask : run_phase\n\n  // Drive idle values and stay quiet while reset is active\n  task reset_signals();\n    vif.yapp_reset();\n    wait (vif.reset === 1'b0);\n  endtask : reset_signals\n\n  // The classic driver loop\n  task get_and_drive();\n    forever begin\n      seq_item_port.get_next_item(req);     // blocks until a sequence sends one\n      send_to_dut(req);\n      seq_item_port.item_done();            // unblocks the sequence\n    end\n  endtask : get_and_drive\n\n  task send_to_dut(yapp_packet pkt);\n    void'(begin_tr(pkt, \"Driver_YAPP_Packet\"));   // transaction recording\n    `uvm_info(get_type_name(), $sformatf(\"Packet is \\n%s\", pkt.sprint()), UVM_LOW)\n    vif.send_to_dut(pkt.addr, pkt.length, pkt.payload, pkt.parity, pkt.packet_delay);\n    num_sent++;\n    end_tr(pkt);\n  endtask : send_to_dut\n\n  function void report_phase(uvm_phase phase);\n    `uvm_info(get_type_name(), $sformatf(\"YAPP driver report: %0d packets sent\", num_sent), UVM_LOW)\n  endfunction : report_phase\n\nendclass : yapp_tx_driver","config_sets":[],"constraints":[],"description":"`run_phase` resets the interface, waits for reset release, then loops\n`seq_item_port.get_next_item(req)` -> `vif.send_to_dut(...)` -> `item_done()`.\nAll pin activity lives in the interface task; the driver only sequences it and\nrecords the transaction (`begin_tr`/`end_tr`).\n","docs":[{"title":"Driver guide","url":"components/driver.md"},{"title":"Lab 3 — A simple UVC","url":"labs/lab03.md"}],"edges":["e180"],"end_line":58,"fields":[{"dims":null,"line":8,"name":"vif","rand":false,"randc":false,"role":"vif","type":"yapp_if"},{"dims":null,"line":11,"name":"num_sent","rand":false,"randc":false,"role":"data","type":"int"}],"file":"yapp/sv/yapp_tx_driver.sv","group":"yapp_pkg","group_label":"YAPP UVC","id":"cls:yapp_tx_driver","item_type":"yapp_packet","kind":"driver","kind_label":"Driver","lab":"3","line":5,"methods":[{"ctor":true,"end_line":19,"kind":"function","line":17,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":24,"kind":"function","line":21,"name":"connect_phase","static":false,"virtual":false},{"ctor":false,"end_line":29,"kind":"task","line":26,"name":"run_phase","static":false,"virtual":false},{"ctor":false,"end_line":35,"kind":"task","line":32,"name":"reset_signals","static":false,"virtual":false},{"ctor":false,"end_line":44,"kind":"task","line":38,"name":"get_and_drive","static":false,"virtual":false},{"ctor":false,"end_line":52,"kind":"task","line":46,"name":"send_to_dut","static":false,"virtual":false},{"ctor":false,"end_line":56,"kind":"function","line":54,"name":"report_phase","static":false,"virtual":false}],"name":"yapp_tx_driver","notable_calls":[],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Gets packets from the sequencer and drives them pin by pin through yapp_if.","type":"yapp_tx_driver"},"cls:yapp_tx_monitor":{"base":"uvm_monitor","base_full":"uvm_monitor","chain":["uvm_monitor","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class yapp_tx_monitor extends uvm_monitor;\n\n  // Virtual interface, set by tb_top through yapp_vif_config\n  virtual interface yapp_if vif;\n\n  // Analysis port: the scoreboard / reference model subscribe here\n  uvm_analysis_port #(yapp_packet) item_collected_port;\n\n  // Statistics\n  int num_pkt_col;\n  int num_bad_parity;   // packets seen with a wrong parity byte (Lab 11C uses it)\n\n  //--------------------------------------------------------------------------\n  // Functional coverage (Lab 10)\n  //   REQ1 all packet lengths, bucketed\n  //   REQ2 all addresses, including the illegal one\n  //   REQ3 every length bucket to every legal address with a parity error\n  //--------------------------------------------------------------------------\n  covergroup yapp_pkt_cg with function sample(bit [5:0] length,\n                                              bit [1:0] addr,\n                                              parity_type_e parity_type);\n    option.per_instance = 1;\n    length_cp : coverpoint length {\n      bins MIN    = {1};\n      bins SMALL  = {[2:10]};\n      bins MEDIUM = {[11:40]};\n      bins LARGE  = {[41:62]};\n      bins MAX    = {63};\n    }\n    addr_cp : coverpoint addr {\n      bins legal[]      = {[0:2]};\n      bins illegal_addr = {3};\n    }\n    parity_cp : coverpoint parity_type;\n    // REQ3: only legal addresses and only BAD_PARITY are interesting\n    len_x_addr_x_parity : cross length_cp, addr_cp, parity_cp {\n      ignore_bins good_parity  = binsof(parity_cp) intersect {GOOD_PARITY};\n      ignore_bins illegal_addr = binsof(addr_cp.illegal_addr);\n    }\n  endgroup : yapp_pkt_cg\n\n  `uvm_component_utils_begin(yapp_tx_monitor)\n    `uvm_field_int(num_pkt_col, UVM_ALL_ON | UVM_DEC)\n  `uvm_component_utils_end\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n    item_collected_port = new(\"item_collected_port\", this);\n    yapp_pkt_cg = new();   // a covergroup inside a class is created with new()\n  endfunction : new\n\n  function void connect_phase(uvm_phase phase);\n    if (!yapp_vif_config::get(this, \"\", \"vif\", vif))\n      `uvm_error(\"NOVIF\", {\"virtual interface must be set for: \", get_full_name(), \".vif\"})\n  endfunction : connect_phase\n\n  task run_phase(uvm_phase phase);\n    `uvm_info(get_type_name(), \"YAPP monitor running\", UVM_LOW)\n    collect_packets();\n  endtask : run_phase\n\n  task collect_packets();\n    yapp_packet pkt;\n    // Nothing to observe while reset is active\n    @(posedge vif.clock);\n    wait (vif.reset === 1'b0);\n    forever begin\n      // A NEW object per packet: subscribers keep the handle (analysis FIFOs\n      // do not clone), so re-using one object would corrupt earlier packets.\n      pkt = yapp_packet::type_id::create(\"pkt\", this);\n      vif.collect_packets(pkt.addr, pkt.length, pkt.payload, pkt.parity);\n      void'(begin_tr(pkt, \"Monitor_YAPP_Packet\"));\n      pkt.parity_type = (pkt.parity == pkt.calc_parity()) ? GOOD_PARITY : BAD_PARITY;\n      num_pkt_col++;\n      if (pkt.parity_type == BAD_PARITY) num_bad_parity++;\n      `uvm_info(get_type_name(), $sformatf(\"Packet collected:\\n%s\", pkt.sprint()), UVM_LOW)\n      yapp_pkt_cg.sample(pkt.length, pkt.addr, pkt.parity_type);\n      item_collected_port.write(pkt);\n      end_tr(pkt);\n    end\n  endtask : collect_packets\n\n  function void report_phase(uvm_phase phase);\n    `uvm_info(get_type_name(),\n              $sformatf(\"YAPP monitor report: %0d packets collected, coverage %.1f%%\",\n                        num_pkt_col, yapp_pkt_cg.get_inst_coverage()), UVM_LOW)\n  endfunction : report_phase\n\nendclass : yapp_tx_monitor","config_sets":[],"constraints":[],"description":"`collect_packets` runs forever: one new `yapp_packet` per packet, published on\n`item_collected_port` (Lab 9A) and sampled by `yapp_pkt_cg` (Lab 10). Counts packets\nand bad-parity packets; `num_bad_parity` is read by the register tests.\n","docs":[{"title":"Monitor guide","url":"components/monitor.md"},{"title":"Lab 3 — A simple UVC","url":"labs/lab03.md"}],"edges":["e181"],"end_line":96,"fields":[{"dims":null,"line":11,"name":"vif","rand":false,"randc":false,"role":"vif","type":"yapp_if"},{"dims":null,"line":14,"name":"item_collected_port","rand":false,"randc":false,"role":"port","type":"uvm_analysis_port#(yapp_packet)"},{"dims":null,"line":17,"name":"num_pkt_col","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":18,"name":"num_bad_parity","rand":false,"randc":false,"role":"data","type":"int"},{"dims":null,"line":26,"name":"yapp_pkt_cg","rand":false,"randc":false,"role":"covergroup","type":"covergroup"}],"file":"yapp/sv/yapp_tx_monitor.sv","group":"yapp_pkg","group_label":"YAPP UVC","id":"cls:yapp_tx_monitor","item_type":null,"kind":"monitor","kind_label":"Monitor","lab":"3","line":8,"methods":[{"ctor":true,"end_line":57,"kind":"function","line":53,"name":"new","static":false,"virtual":false},{"ctor":false,"end_line":62,"kind":"function","line":59,"name":"connect_phase","static":false,"virtual":false},{"ctor":false,"end_line":67,"kind":"task","line":64,"name":"run_phase","static":false,"virtual":false},{"ctor":false,"end_line":88,"kind":"task","line":69,"name":"collect_packets","static":false,"virtual":false},{"ctor":false,"end_line":94,"kind":"function","line":90,"name":"report_phase","static":false,"virtual":false}],"name":"yapp_tx_monitor","notable_calls":[],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"Samples yapp_if on the rising edge, rebuilds packets, publishes them and collects coverage.","type":"yapp_tx_monitor"},"cls:yapp_tx_sequencer":{"base":"uvm_sequencer","base_full":"uvm_sequencer#(yapp_packet,uvm_pkg::uvm_sequencer::REQ)","chain":["uvm_sequencer","uvm_sequencer_param_base","uvm_sequencer_base","uvm_component","uvm_report_object","uvm_object","uvm_void"],"children":[],"code":"class yapp_tx_sequencer extends uvm_sequencer #(yapp_packet);\n\n  `uvm_component_utils(yapp_tx_sequencer)\n\n  function new(string name, uvm_component parent);\n    super.new(name, parent);\n  endfunction : new\n\nendclass : yapp_tx_sequencer","config_sets":[],"constraints":[],"description":"","docs":[{"title":"Sequencer guide","url":"components/sequences.md"},{"title":"Lab 3 — A simple UVC","url":"labs/lab03.md"}],"edges":["e167","e182"],"end_line":14,"fields":[],"file":"yapp/sv/yapp_tx_sequencer.sv","group":"yapp_pkg","group_label":"YAPP UVC","id":"cls:yapp_tx_sequencer","item_type":"yapp_packet","kind":"sequencer","kind_label":"Sequencer","lab":"3","line":6,"methods":[{"ctor":true,"end_line":12,"kind":"function","line":10,"name":"new","static":false,"virtual":false}],"name":"yapp_tx_sequencer","notable_calls":[],"overrides":[],"parent":null,"scope":"cls","source":null,"summary":"uvm_sequencer #(yapp_packet): arbitrates YAPP sequences for the driver.","type":"yapp_tx_sequencer"},"hw_top":{"children":["hw_top.clk_rst_if","hw_top.clkgen","hw_top.in0","hw_top.hbus0","hw_top.ch0","hw_top.ch1","hw_top.ch2","hw_top.dut"],"code":"module hw_top;\n\n  logic clock;\n  logic reset;\n  logic run_clock;\n  int   clock_period;\n\n  // Clock & Reset UVC interface drives reset, run_clock and clock_period\n  clock_and_reset_if clk_rst_if (\n    .clock        (clock),\n    .reset        (reset),\n    .run_clock    (run_clock),\n    .clock_period (clock_period)\n  );\n\n  // Clock generator controlled by the Clock & Reset UVC\n  clkgen clkgen (.run_clock(run_clock), .clock_period(clock_period), .clock(clock));\n\n  // Interface instances, all on the same clock and reset\n  yapp_if    in0   (clock, reset);\n  hbus_if    hbus0 (clock, reset);\n  channel_if ch0   (clock, reset);\n  channel_if ch1   (clock, reset);\n  channel_if ch2   (clock, reset);\n\n  // Status output of the router\n  logic error;\n\n  yapp_router dut (\n    .clock       (clock),\n    .reset       (reset),\n    // YAPP input port\n    .in_data     (in0.in_data),\n    .in_data_vld (in0.in_data_vld),\n    .in_suspend  (in0.in_suspend),\n    // Output channels\n    .data_0      (ch0.data),\n    .data_vld_0  (ch0.data_vld),\n    .suspend_0   (ch0.suspend),\n    .data_1      (ch1.data),\n    .data_vld_1  (ch1.data_vld),\n    .suspend_1   (ch1.suspend),\n    .data_2      (ch2.data),\n    .data_vld_2  (ch2.data_vld),\n    .suspend_2   (ch2.suspend),\n    // HBUS host port\n    .hdata       (hbus0.hdata_w),        // the WIRE, not hbus0.hdata\n    .haddr       (hbus0.haddr),\n    .hen         (hbus0.hen),\n    .hwr_rd      (hbus0.hwr_rd),\n    // Status\n    .error       (error)\n  );\n\nendmodule : hw_top","description":"","docs":[{"title":"Module guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"end_line":66,"file":"labs/lab11c_rm_sim/tb/hw_top.sv","id":"hw_top","kind":"module","kind_label":"Module","lab":"6","line":12,"name":"hw_top","parent":null,"scope":"hw","signals":[{"kind":"variable","line":14,"name":"clock","type":"logic"},{"kind":"variable","line":15,"name":"reset","type":"logic"},{"kind":"variable","line":16,"name":"run_clock","type":"logic"},{"kind":"variable","line":17,"name":"clock_period","type":"int"},{"kind":"variable","line":38,"name":"error","type":"logic"}],"summary":"Hardware side: clock generator, the five interface instances and the DUT.","type":"hw_top"},"hw_top.ch0":{"children":[],"code":"interface channel_if (input logic clock, input logic reset);\n\n  logic [7:0] data;\n  logic       data_vld;\n  logic       suspend;\n\n  //--------------------------------------------------------------------------\n  // Driver side (receiver)\n  //--------------------------------------------------------------------------\n  task automatic channel_reset();\n    @(negedge clock);\n    suspend <= 1'b1;\n  endtask : channel_reset\n\n  // Receive one packet after waiting `response_delay` cycles from the moment\n  // the router offers the header.\n  task automatic receive_packet(input int response_delay);\n    bit [5:0] length;\n\n    // Wait for the router to present a byte\n    do @(negedge clock); while (!data_vld);\n\n    // Optional response delay while the header is held on the bus\n    repeat (response_delay) @(negedge clock);\n\n    // Read the header and release suspend on the same falling edge\n    length  = data[7:2];\n    suspend <= 1'b0;\n\n    // payload bytes + parity byte arrive one per falling edge\n    repeat (length + 1) @(negedge clock);\n\n    // The parity byte is being read on this edge: stop the router here\n    suspend <= 1'b1;\n  endtask : receive_packet\n\n  //--------------------------------------------------------------------------\n  // Monitor side: sample on the RISING edge. A byte was consumed by the\n  // receiver when data_vld is high and suspend is low at that edge.\n  //--------------------------------------------------------------------------\n  task automatic collect_packet(output bit [1:0] addr,\n                                output bit [5:0] length,\n                                output bit [7:0] payload[],\n                                output bit [7:0] parity);\n    do @(posedge clock); while (!(data_vld && !suspend));\n    length  = data[7:2];\n    addr    = data[1:0];\n    payload = new[length];\n\n    for (int i = 0; i < length; i++) begin\n      do @(posedge clock); while (!(data_vld && !suspend));\n      payload[i] = data;\n    end\n\n    do @(posedge clock); while (!(data_vld && !suspend));\n    parity = data;\n  endtask : collect_packet\n\nendinterface : channel_if","description":"","docs":[{"title":"Interface guide","url":"components/driver.md"},{"title":"Lab 7 — Integrating UVCs","url":"labs/lab07.md"}],"edges":["e10","e25","e31","e36","e73","e74"],"end_line":75,"file":"channel/sv/channel_if.sv","id":"hw_top.ch0","kind":"interface","kind_label":"Interface","lab":"7","line":17,"name":"ch0","params":[],"parent":"hw_top","ports":[{"dir":"in","line":17,"name":"clock","type":"logic"},{"dir":"in","line":17,"name":"reset","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":19,"name":"data","type":"logic[7:0]"},{"kind":"variable","line":20,"name":"data_vld","type":"logic"},{"kind":"variable","line":21,"name":"suspend","type":"logic"}],"summary":"channel_if for output 0: data / data_vld / suspend.","tasks":[{"args":[],"end_line":29,"kind":"task","line":26,"name":"channel_reset"},{"args":["response_delay"],"end_line":51,"kind":"task","line":33,"name":"receive_packet"},{"args":["addr","length","payload","parity"],"end_line":73,"kind":"task","line":57,"name":"collect_packet"}],"type":"channel_if"},"hw_top.ch1":{"children":[],"code":"interface channel_if (input logic clock, input logic reset);\n\n  logic [7:0] data;\n  logic       data_vld;\n  logic       suspend;\n\n  //--------------------------------------------------------------------------\n  // Driver side (receiver)\n  //--------------------------------------------------------------------------\n  task automatic channel_reset();\n    @(negedge clock);\n    suspend <= 1'b1;\n  endtask : channel_reset\n\n  // Receive one packet after waiting `response_delay` cycles from the moment\n  // the router offers the header.\n  task automatic receive_packet(input int response_delay);\n    bit [5:0] length;\n\n    // Wait for the router to present a byte\n    do @(negedge clock); while (!data_vld);\n\n    // Optional response delay while the header is held on the bus\n    repeat (response_delay) @(negedge clock);\n\n    // Read the header and release suspend on the same falling edge\n    length  = data[7:2];\n    suspend <= 1'b0;\n\n    // payload bytes + parity byte arrive one per falling edge\n    repeat (length + 1) @(negedge clock);\n\n    // The parity byte is being read on this edge: stop the router here\n    suspend <= 1'b1;\n  endtask : receive_packet\n\n  //--------------------------------------------------------------------------\n  // Monitor side: sample on the RISING edge. A byte was consumed by the\n  // receiver when data_vld is high and suspend is low at that edge.\n  //--------------------------------------------------------------------------\n  task automatic collect_packet(output bit [1:0] addr,\n                                output bit [5:0] length,\n                                output bit [7:0] payload[],\n                                output bit [7:0] parity);\n    do @(posedge clock); while (!(data_vld && !suspend));\n    length  = data[7:2];\n    addr    = data[1:0];\n    payload = new[length];\n\n    for (int i = 0; i < length; i++) begin\n      do @(posedge clock); while (!(data_vld && !suspend));\n      payload[i] = data;\n    end\n\n    do @(posedge clock); while (!(data_vld && !suspend));\n    parity = data;\n  endtask : collect_packet\n\nendinterface : channel_if","description":"","docs":[{"title":"Interface guide","url":"components/driver.md"},{"title":"Lab 7 — Integrating UVCs","url":"labs/lab07.md"}],"edges":["e11","e26","e32","e37","e75","e76"],"end_line":75,"file":"channel/sv/channel_if.sv","id":"hw_top.ch1","kind":"interface","kind_label":"Interface","lab":"7","line":17,"name":"ch1","params":[],"parent":"hw_top","ports":[{"dir":"in","line":17,"name":"clock","type":"logic"},{"dir":"in","line":17,"name":"reset","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":19,"name":"data","type":"logic[7:0]"},{"kind":"variable","line":20,"name":"data_vld","type":"logic"},{"kind":"variable","line":21,"name":"suspend","type":"logic"}],"summary":"channel_if for output 1.","tasks":[{"args":[],"end_line":29,"kind":"task","line":26,"name":"channel_reset"},{"args":["response_delay"],"end_line":51,"kind":"task","line":33,"name":"receive_packet"},{"args":["addr","length","payload","parity"],"end_line":73,"kind":"task","line":57,"name":"collect_packet"}],"type":"channel_if"},"hw_top.ch2":{"children":[],"code":"interface channel_if (input logic clock, input logic reset);\n\n  logic [7:0] data;\n  logic       data_vld;\n  logic       suspend;\n\n  //--------------------------------------------------------------------------\n  // Driver side (receiver)\n  //--------------------------------------------------------------------------\n  task automatic channel_reset();\n    @(negedge clock);\n    suspend <= 1'b1;\n  endtask : channel_reset\n\n  // Receive one packet after waiting `response_delay` cycles from the moment\n  // the router offers the header.\n  task automatic receive_packet(input int response_delay);\n    bit [5:0] length;\n\n    // Wait for the router to present a byte\n    do @(negedge clock); while (!data_vld);\n\n    // Optional response delay while the header is held on the bus\n    repeat (response_delay) @(negedge clock);\n\n    // Read the header and release suspend on the same falling edge\n    length  = data[7:2];\n    suspend <= 1'b0;\n\n    // payload bytes + parity byte arrive one per falling edge\n    repeat (length + 1) @(negedge clock);\n\n    // The parity byte is being read on this edge: stop the router here\n    suspend <= 1'b1;\n  endtask : receive_packet\n\n  //--------------------------------------------------------------------------\n  // Monitor side: sample on the RISING edge. A byte was consumed by the\n  // receiver when data_vld is high and suspend is low at that edge.\n  //--------------------------------------------------------------------------\n  task automatic collect_packet(output bit [1:0] addr,\n                                output bit [5:0] length,\n                                output bit [7:0] payload[],\n                                output bit [7:0] parity);\n    do @(posedge clock); while (!(data_vld && !suspend));\n    length  = data[7:2];\n    addr    = data[1:0];\n    payload = new[length];\n\n    for (int i = 0; i < length; i++) begin\n      do @(posedge clock); while (!(data_vld && !suspend));\n      payload[i] = data;\n    end\n\n    do @(posedge clock); while (!(data_vld && !suspend));\n    parity = data;\n  endtask : collect_packet\n\nendinterface : channel_if","description":"","docs":[{"title":"Interface guide","url":"components/driver.md"},{"title":"Lab 7 — Integrating UVCs","url":"labs/lab07.md"}],"edges":["e12","e27","e33","e38","e77","e78"],"end_line":75,"file":"channel/sv/channel_if.sv","id":"hw_top.ch2","kind":"interface","kind_label":"Interface","lab":"7","line":17,"name":"ch2","params":[],"parent":"hw_top","ports":[{"dir":"in","line":17,"name":"clock","type":"logic"},{"dir":"in","line":17,"name":"reset","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":19,"name":"data","type":"logic[7:0]"},{"kind":"variable","line":20,"name":"data_vld","type":"logic"},{"kind":"variable","line":21,"name":"suspend","type":"logic"}],"summary":"channel_if for output 2.","tasks":[{"args":[],"end_line":29,"kind":"task","line":26,"name":"channel_reset"},{"args":["response_delay"],"end_line":51,"kind":"task","line":33,"name":"receive_packet"},{"args":["addr","length","payload","parity"],"end_line":73,"kind":"task","line":57,"name":"collect_packet"}],"type":"channel_if"},"hw_top.clk_rst_if":{"children":[],"code":"interface clock_and_reset_if (\n  input  logic clock,        // clock produced by clkgen (fed back for timing)\n  output logic reset,        // active-high reset driven by this UVC\n  output logic run_clock,    // 1 = clkgen toggles the clock\n  output int   clock_period  // clock period in time units\n);\n\n  // Safe defaults before the UVC takes over\n  initial begin\n    reset        = 1'b0;\n    run_clock    = 1'b0;\n    clock_period = 10;\n  end\n\n  // Start the clock with the requested period and hold reset for\n  // `reset_cycles` clock cycles. Reset is asserted immediately, so the first\n  // clock edges happen while reset is active.\n  task automatic start_clock_and_reset(input int period, input int reset_cycles);\n    clock_period = period;\n    reset        = 1'b1;\n    run_clock    = 1'b1;\n    repeat (reset_cycles) @(posedge clock);\n    @(negedge clock);          // release on a falling edge, like every DUT input\n    reset = 1'b0;\n  endtask\n\n  task automatic stop_clock();\n    @(negedge clock);\n    run_clock = 1'b0;\n  endtask\n\nendinterface : clock_and_reset_if","description":"","docs":[{"title":"Interface guide","url":"components/driver.md"},{"title":"Lab 7 — Integrating UVCs","url":"labs/lab07.md"}],"edges":["e22","e29","e30","e31","e32","e33","e34","e81"],"end_line":43,"file":"clock_and_reset/sv/clock_and_reset_if.sv","id":"hw_top.clk_rst_if","kind":"interface","kind_label":"Interface","lab":"7","line":12,"name":"clk_rst_if","params":[],"parent":"hw_top","ports":[{"dir":"in","line":13,"name":"clock","type":"logic"},{"dir":"out","line":14,"name":"reset","type":"logic"},{"dir":"out","line":15,"name":"run_clock","type":"logic"},{"dir":"out","line":16,"name":"clock_period","type":"int"}],"scope":"hw","signals":[],"summary":"clock_and_reset_if: owns reset, run_clock and clock_period.","tasks":[{"args":["period","reset_cycles"],"end_line":36,"kind":"task","line":29,"name":"start_clock_and_reset"},{"args":[],"end_line":41,"kind":"task","line":38,"name":"stop_clock"}],"type":"clock_and_reset_if"},"hw_top.clkgen":{"children":[],"code":"module clkgen (\n  input  logic run_clock,\n  input  int   clock_period,\n  output logic clock\n);\n\n  initial clock = 1'b0;\n\n  always begin\n    if (run_clock && clock_period > 0) begin\n      #(clock_period / 2);\n      clock = ~clock;\n    end else begin\n      clock = 1'b0;\n      @(run_clock or clock_period);   // sleep until something changes\n    end\n  end\n\nendmodule : clkgen","description":"","docs":[{"title":"Module guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e22","e23","e24","e25","e26","e27","e28"],"end_line":28,"file":"clock_and_reset/sv/clkgen.sv","id":"hw_top.clkgen","kind":"module","kind_label":"Module","lab":"6","line":10,"name":"clkgen","params":[],"parent":"hw_top","ports":[{"dir":"in","line":11,"name":"run_clock","type":"logic"},{"dir":"in","line":12,"name":"clock_period","type":"int"},{"dir":"out","line":13,"name":"clock","type":"logic"}],"scope":"hw","signals":[],"summary":"Free-running clock generator controlled by run_clock / clock_period.","tasks":[],"type":"clkgen"},"hw_top.dut":{"children":["hw_top.dut.g_fifo[0].u_fifo","hw_top.dut.g_fifo[1].u_fifo","hw_top.dut.g_fifo[2].u_fifo","hw_top.dut#input_fsm","hw_top.dut#backpressure","hw_top.dut#fifos","hw_top.dut#outputs","hw_top.dut#error_timer","hw_top.dut#regfile","hw_top.dut#memories"],"code":"module yapp_router (\n  input  logic        clock,\n  input  logic        reset,\n  // YAPP input port\n  input  logic [7:0]  in_data,\n  input  logic        in_data_vld,\n  output logic        in_suspend,\n  // Output channels\n  output logic [7:0]  data_0,\n  output logic        data_vld_0,\n  input  logic        suspend_0,\n  output logic [7:0]  data_1,\n  output logic        data_vld_1,\n  input  logic        suspend_1,\n  output logic [7:0]  data_2,\n  output logic        data_vld_2,\n  input  logic        suspend_2,\n  // HBUS host port\n  inout  wire  [7:0]  hdata,\n  input  logic [15:0] haddr,\n  input  logic        hen,\n  input  logic        hwr_rd,\n  // Status\n  output logic        error\n);\n\n  //----------------------------------------------------------------------------\n  // Registers and memories (names are used by the RAL backdoor paths)\n  //----------------------------------------------------------------------------\n  logic [7:0] ctrl_reg;\n  logic [7:0] en_reg;\n  logic [7:0] parity_err_cnt_reg;\n  logic [7:0] oversized_pkt_cnt_reg;\n  logic [7:0] addr3_cnt_reg;\n  logic [7:0] addr0_cnt_reg;\n  logic [7:0] addr1_cnt_reg;\n  logic [7:0] addr2_cnt_reg;\n  logic [7:0] mem_size_reg;\n  logic [7:0] yapp_pkt_mem [0:63];\n  logic [7:0] yapp_mem     [0:255];\n\n  // Decoded register fields\n  wire [5:0] maxpktsize           = ctrl_reg[5:0];\n  wire       router_en            = en_reg[0];\n  wire       parity_err_cnt_en    = en_reg[1];\n  wire       oversized_pkt_cnt_en = en_reg[2];\n  wire       addr0_cnt_en         = en_reg[4];\n  wire       addr1_cnt_en         = en_reg[5];\n  wire       addr2_cnt_en         = en_reg[6];\n  wire       addr3_cnt_en         = en_reg[7];\n\n  localparam logic [15:0] ADDR_CTRL_REG      = 16'h1000;\n  localparam logic [15:0] ADDR_EN_REG        = 16'h1001;\n  localparam logic [15:0] ADDR_PARITY_ERR    = 16'h1004;\n  localparam logic [15:0] ADDR_OVERSIZED     = 16'h1005;\n  localparam logic [15:0] ADDR_ADDR3_CNT     = 16'h1006;\n  localparam logic [15:0] ADDR_ADDR0_CNT     = 16'h1009;\n  localparam logic [15:0] ADDR_ADDR1_CNT     = 16'h100a;\n  localparam logic [15:0] ADDR_ADDR2_CNT     = 16'h100b;\n  localparam logic [15:0] ADDR_MEM_SIZE      = 16'h100d;\n  localparam logic [15:0] ADDR_PKT_MEM_BASE  = 16'h1010;   // .. 0x104f\n  localparam logic [15:0] ADDR_MEM_BASE      = 16'h1100;   // .. 0x11ff\n\n  //----------------------------------------------------------------------------\n  // Output FIFOs\n  //----------------------------------------------------------------------------\n  logic [2:0]      fifo_push;\n  logic [2:0]      fifo_pop;\n  logic [2:0]      fifo_empty;\n  logic [2:0]      fifo_full;\n  logic [7:0]      fifo_dout [0:2];\n  logic [7:0]      fifo_din;\n\n  genvar ch;\n  generate\n    for (ch = 0; ch < 3; ch++) begin : g_fifo\n      yapp_fifo #(.DEPTH(16), .WIDTH(8)) u_fifo (\n        .clock (clock),\n        .reset (reset),\n        .push  (fifo_push[ch]),\n        .din   (fifo_din),\n        .pop   (fifo_pop[ch]),\n        .dout  (fifo_dout[ch]),\n        .empty (fifo_empty[ch]),\n        .full  (fifo_full[ch])\n      );\n    end\n  endgenerate\n\n  //----------------------------------------------------------------------------\n  // Channel output handshake\n  //   data_vld_x : FIFO has data, the head byte is on data_x\n  //   pop        : receiver released suspend_x while a byte was presented\n  //----------------------------------------------------------------------------\n  logic [2:0] suspend;\n  assign suspend = {suspend_2, suspend_1, suspend_0};\n\n  assign data_0     = fifo_dout[0];\n  assign data_1     = fifo_dout[1];\n  assign data_2     = fifo_dout[2];\n  assign data_vld_0 = !fifo_empty[0];\n  assign data_vld_1 = !fifo_empty[1];\n  assign data_vld_2 = !fifo_empty[2];\n\n  always_comb begin\n    for (int i = 0; i < 3; i++)\n      fifo_pop[i] = !fifo_empty[i] && !suspend[i];\n  end\n\n  //----------------------------------------------------------------------------\n  // Input port FSM\n  //----------------------------------------------------------------------------\n  typedef enum logic [1:0] {IDLE, PAYLOAD, PARITY} state_e;\n\n  state_e     state;\n  logic [1:0] cur_addr;      // address of the packet being received\n  logic [5:0] cur_len;       // payload length of the packet being received\n  logic [5:0] byte_cnt;      // payload bytes accepted so far\n  logic [7:0] parity_acc;    // running XOR of header + payload\n  logic       cur_drop;      // packet will not be forwarded\n  logic       cur_oversized;\n  logic       cur_enabled;   // router_en was set when the header arrived\n\n  // Header decode (valid while state == IDLE and in_data_vld == 1)\n  wire [1:0] hdr_addr   = in_data[1:0];\n  wire [5:0] hdr_len    = in_data[7:2];\n  wire       hdr_ovs    = (hdr_len > maxpktsize);\n  wire       hdr_drop   = !router_en || hdr_ovs || (hdr_addr == 2'd3);\n\n  // Target FIFO is full -> ask the driver to hold the current byte.\n  // Dropped packets are consumed without FIFO space, so never suspended.\n  always_comb begin\n    case (state)\n      IDLE:    in_suspend = in_data_vld && !hdr_drop && fifo_full[hdr_addr];\n      default: in_suspend = !cur_drop && fifo_full[cur_addr];\n    endcase\n  end\n\n  // A byte is accepted whenever the DUT is not suspending the input\n  wire accept = !in_suspend;\n\n  // FIFO push control\n  always_comb begin\n    fifo_push = 3'b000;\n    fifo_din  = in_data;\n    case (state)\n      IDLE:    if (in_data_vld && accept && !hdr_drop) fifo_push[hdr_addr] = 1'b1;\n      PAYLOAD: if (in_data_vld && accept && !cur_drop) fifo_push[cur_addr] = 1'b1;\n      PARITY:  if (accept && !cur_drop)                fifo_push[cur_addr] = 1'b1;\n      default: ;\n    endcase\n  end\n\n  // Error pulse scheduling: free-running counter picks a 1..10 cycle delay\n  logic [3:0] rnd_cnt;\n  logic [3:0] err_timer;\n  wire  [3:0] err_delay = (rnd_cnt % 4'd10) + 4'd1;\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset)\n      rnd_cnt <= 4'd0;\n    else\n      rnd_cnt <= rnd_cnt + 4'd1;\n  end\n\n  // Main FSM\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset) begin\n      state         <= IDLE;\n      cur_addr      <= 2'd0;\n      cur_len       <= 6'd0;\n      byte_cnt      <= 6'd0;\n      parity_acc    <= 8'd0;\n      cur_drop      <= 1'b0;\n      cur_oversized <= 1'b0;\n      cur_enabled   <= 1'b0;\n      err_timer     <= 4'd0;\n      error         <= 1'b0;\n      parity_err_cnt_reg    <= 8'd0;\n      oversized_pkt_cnt_reg <= 8'd0;\n      addr3_cnt_reg         <= 8'd0;\n      addr0_cnt_reg         <= 8'd0;\n      addr1_cnt_reg         <= 8'd0;\n      addr2_cnt_reg         <= 8'd0;\n      mem_size_reg          <= 8'd0;\n    end else begin\n      // ---- error pulse generator ----\n      error <= 1'b0;\n      if (err_timer != 4'd0) begin\n        err_timer <= err_timer - 4'd1;\n        if (err_timer == 4'd1)\n          error <= 1'b1;\n      end\n\n      case (state)\n        //------------------------------------------------------------------\n        IDLE: begin\n          if (in_data_vld && accept) begin\n            cur_addr      <= hdr_addr;\n            cur_len       <= hdr_len;\n            byte_cnt      <= 6'd0;\n            parity_acc    <= in_data;\n            cur_drop      <= hdr_drop;\n            cur_oversized <= hdr_ovs;\n            cur_enabled   <= router_en;\n            if (router_en)\n              yapp_pkt_mem[0] <= in_data;\n            state <= PAYLOAD;\n          end\n        end\n        //------------------------------------------------------------------\n        PAYLOAD: begin\n          if (in_data_vld && accept) begin\n            parity_acc <= parity_acc ^ in_data;\n            if (cur_enabled)\n              yapp_pkt_mem[byte_cnt + 6'd1] <= in_data;\n            byte_cnt <= byte_cnt + 6'd1;\n            if (byte_cnt + 6'd1 == cur_len)\n              state <= PARITY;\n          end\n        end\n        //------------------------------------------------------------------\n        PARITY: begin\n          if (accept) begin\n            state <= IDLE;\n            if (cur_enabled) begin\n              mem_size_reg <= {2'b00, cur_len};\n              // counters\n              if (in_data != parity_acc) begin\n                if (parity_err_cnt_en) parity_err_cnt_reg <= parity_err_cnt_reg + 8'd1;\n                err_timer <= err_delay;\n              end\n              if (cur_oversized && oversized_pkt_cnt_en)\n                oversized_pkt_cnt_reg <= oversized_pkt_cnt_reg + 8'd1;\n              case (cur_addr)\n                2'd0: if (addr0_cnt_en) addr0_cnt_reg <= addr0_cnt_reg + 8'd1;\n                2'd1: if (addr1_cnt_en) addr1_cnt_reg <= addr1_cnt_reg + 8'd1;\n                2'd2: if (addr2_cnt_en) addr2_cnt_reg <= addr2_cnt_reg + 8'd1;\n                2'd3: if (addr3_cnt_en) addr3_cnt_reg <= addr3_cnt_reg + 8'd1;\n              endcase\n              if (cur_drop)\n                $display(\"%0t ROUTER DROPS PACKET addr=%0d length=%0d (%s)\", $time,\n                         cur_addr, cur_len,\n                         (cur_addr == 2'd3) ? \"illegal address\" : \"length > maxpktsize\");\n            end else begin\n              $display(\"%0t ROUTER DROPS PACKET addr=%0d length=%0d (router disabled)\",\n                       $time, cur_addr, cur_len);\n            end\n          end\n        end\n        //------------------------------------------------------------------\n        default: state <= IDLE;\n      endcase\n    end\n  end\n\n  //----------------------------------------------------------------------------\n  // HBUS host interface\n  //----------------------------------------------------------------------------\n  logic [7:0] hdata_out;\n  logic       hdata_oe;\n\n  assign hdata = hdata_oe ? hdata_out : 8'bz;\n\n  // Read mux (combinational, registered into hdata_out on the first read edge)\n  logic [7:0] rd_mux;\n  always_comb begin\n    rd_mux = 8'h00;\n    if (haddr >= ADDR_MEM_BASE && haddr <= ADDR_MEM_BASE + 16'h00ff) begin\n      rd_mux = yapp_mem[haddr[7:0]];\n`ifdef INJECT_ERROR\n      if (haddr[7:0] == 8'h2a) rd_mux[3] = ~rd_mux[3];\n`endif\n    end else if (haddr >= ADDR_PKT_MEM_BASE && haddr <= ADDR_PKT_MEM_BASE + 16'h003f) begin\n      rd_mux = yapp_pkt_mem[haddr[6:0] - 7'h10];   // 0x1010..0x104f -> 0..63\n    end else begin\n      case (haddr)\n        ADDR_CTRL_REG:   rd_mux = ctrl_reg;\n        ADDR_EN_REG:     rd_mux = en_reg;\n        ADDR_PARITY_ERR: rd_mux = parity_err_cnt_reg;\n        ADDR_OVERSIZED:  rd_mux = oversized_pkt_cnt_reg;\n        ADDR_ADDR3_CNT:  rd_mux = addr3_cnt_reg;\n        ADDR_ADDR0_CNT:  rd_mux = addr0_cnt_reg;\n        ADDR_ADDR1_CNT:  rd_mux = addr1_cnt_reg;\n        ADDR_ADDR2_CNT:  rd_mux = addr2_cnt_reg;\n        ADDR_MEM_SIZE:   rd_mux = mem_size_reg;\n        default:         rd_mux = 8'h00;\n      endcase\n    end\n  end\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset) begin\n      ctrl_reg  <= 8'h3f;\n      en_reg    <= 8'h01;\n      hdata_out <= 8'h00;\n      hdata_oe  <= 1'b0;\n    end else begin\n      // Read: capture on the first cycle, drive during the second\n      hdata_oe <= hen && !hwr_rd;\n      if (hen && !hwr_rd)\n        hdata_out <= rd_mux;\n\n      // Write: single cycle, RW locations only\n      if (hen && hwr_rd) begin\n        if (haddr >= ADDR_MEM_BASE && haddr <= ADDR_MEM_BASE + 16'h00ff)\n          yapp_mem[haddr[7:0]] <= hdata;\n        else case (haddr)\n          ADDR_CTRL_REG: ctrl_reg <= hdata;\n          ADDR_EN_REG:   en_reg   <= hdata;\n          default: ;   // read-only registers and memories ignore writes\n        endcase\n      end\n    end\n  end\n\nendmodule","description":"","docs":[{"title":"DUT specification","url":"dut/spec.md"},{"title":"RTL walkthrough","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e28","e34","e35","e36","e37","e38","e39","e48"],"end_line":443,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut","kind":"module","kind_label":"Module","lab":"6","line":127,"name":"dut","params":[{"line":178,"name":"ADDR_CTRL_REG","value":"16'd4096"},{"line":179,"name":"ADDR_EN_REG","value":"16'd4097"},{"line":180,"name":"ADDR_PARITY_ERR","value":"16'd4100"},{"line":181,"name":"ADDR_OVERSIZED","value":"16'd4101"},{"line":182,"name":"ADDR_ADDR3_CNT","value":"16'd4102"},{"line":183,"name":"ADDR_ADDR0_CNT","value":"16'd4105"},{"line":184,"name":"ADDR_ADDR1_CNT","value":"16'd4106"},{"line":185,"name":"ADDR_ADDR2_CNT","value":"16'd4107"},{"line":186,"name":"ADDR_MEM_SIZE","value":"16'd4109"},{"line":187,"name":"ADDR_PKT_MEM_BASE","value":"16'd4112"},{"li
