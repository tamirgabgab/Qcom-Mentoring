pp_mem","type":"logic[7:0]$[0:255]"},{"kind":"net","line":169,"name":"maxpktsize","type":"logic[5:0]"},{"kind":"net","line":170,"name":"router_en","type":"logic"},{"kind":"net","line":171,"name":"parity_err_cnt_en","type":"logic"},{"kind":"net","line":172,"name":"oversized_pkt_cnt_en","type":"logic"},{"kind":"net","line":173,"name":"addr0_cnt_en","type":"logic"},{"kind":"net","line":174,"name":"addr1_cnt_en","type":"logic"},{"kind":"net","line":175,"name":"addr2_cnt_en","type":"logic"},{"kind":"net","line":176,"name":"addr3_cnt_en","type":"logic"},{"kind":"variable","line":193,"name":"fifo_push","type":"logic[2:0]"},{"kind":"variable","line":194,"name":"fifo_pop","type":"logic[2:0]"},{"kind":"variable","line":195,"name":"fifo_empty","type":"logic[2:0]"},{"kind":"variable","line":196,"name":"fifo_full","type":"logic[2:0]"},{"kind":"variable","line":197,"name":"fifo_dout","type":"logic[7:0]$[0:2]"},{"kind":"variable","line":198,"name":"fifo_din","type":"logic[7:0]"},{"kind":"variable","line":221,"name":"suspend","type":"logic[2:0]"},{"kind":"variable","line":241,"name":"state","type":"yapp_router.state_e"},{"kind":"variable","line":242,"name":"cur_addr","type":"logic[1:0]"},{"kind":"variable","line":243,"name":"cur_len","type":"logic[5:0]"},{"kind":"variable","line":244,"name":"byte_cnt","type":"logic[5:0]"},{"kind":"variable","line":245,"name":"parity_acc","type":"logic[7:0]"},{"kind":"variable","line":246,"name":"cur_drop","type":"logic"},{"kind":"variable","line":247,"name":"cur_oversized","type":"logic"},{"kind":"variable","line":248,"name":"cur_enabled","type":"logic"},{"kind":"net","line":251,"name":"hdr_addr","type":"logic[1:0]"},{"kind":"net","line":252,"name":"hdr_len","type":"logic[5:0]"},{"kind":"net","line":253,"name":"hdr_ovs","type":"logic"},{"kind":"net","line":254,"name":"hdr_drop","type":"logic"},{"kind":"net","line":266,"name":"accept","type":"logic"},{"kind":"variable","line":281,"name":"rnd_cnt","type":"logic[3:0]"},{"kind":"variable","line":282,"name":"err_timer","type":"logic[3:0]"},{"kind":"net","line":283,"name":"err_delay","type":"logic[3:0]"},{"kind":"variable","line":386,"name":"hdata_out","type":"logic[7:0]"},{"kind":"variable","line":387,"name":"hdata_oe","type":"logic"},{"kind":"variable","line":392,"name":"rd_mux","type":"logic[7:0]"}],"summary":"yapp_router: one YAPP input, three FIFO-buffered output channels, HBUS register access.","tasks":[],"type":"yapp_router"},"hw_top.dut#backpressure":{"children":[],"code":"  always_comb begin\n    case (state)\n      IDLE:    in_suspend = in_data_vld && !hdr_drop && fifo_full[hdr_addr];\n      default: in_suspend = !cur_drop && fifo_full[cur_addr];\n    endcase\n  end\n\n  // A byte is accepted whenever the DUT is not suspending the input\n  wire accept = !in_suspend;\n\n  // FIFO push control\n  always_comb begin\n    fifo_push = 3'b000;\n    fifo_din  = in_data;\n    case (state)\n      IDLE:    if (in_data_vld && accept && !hdr_drop) fifo_push[hdr_addr] = 1'b1;\n      PAYLOAD: if (in_data_vld && accept && !cur_drop) fifo_push[cur_addr] = 1'b1;\n      PARITY:  if (accept && !cur_drop)                fifo_push[cur_addr] = 1'b1;\n      default: ;\n    endcase\n  end","description":"","docs":[{"title":"RTL block guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"end_line":278,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut#backpressure","kind":"rtl_block","kind_label":"RTL block","lab":"6","line":258,"name":"in_suspend","parent":"hw_top.dut","scope":"hw","signals":[{"dir":"out","line":133,"name":"in_suspend","type":"logic"},{"kind":"variable","line":196,"name":"fifo_full","type":"logic[2:0]"}],"summary":"Asserted when the target FIFO is full: the driver must hold the byte.","type":"yapp_router"},"hw_top.dut#error_timer":{"children":[],"code":"  logic [3:0] rnd_cnt;\n  logic [3:0] err_timer;\n  wire  [3:0] err_delay = (rnd_cnt % 4'd10) + 4'd1;\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset)\n      rnd_cnt <= 4'd0;\n    else\n      rnd_cnt <= rnd_cnt + 4'd1;\n  end","description":"","docs":[{"title":"RTL block guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e13"],"end_line":290,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut#error_timer","kind":"rtl_block","kind_label":"RTL block","lab":"6","line":281,"name":"Error timer","parent":"hw_top.dut","scope":"hw","signals":[{"kind":"variable","line":281,"name":"rnd_cnt","type":"logic[3:0]"},{"kind":"variable","line":282,"name":"err_timer","type":"logic[3:0]"},{"kind":"net","line":283,"name":"err_delay","type":"logic[3:0]"},{"dir":"out","line":150,"name":"error","type":"logic"}],"summary":"A free-running counter picks a delay 1..10; `error` pulses that many cycles after a bad-parity packet.","type":"yapp_router"},"hw_top.dut#fifos":{"children":[],"code":"  logic [2:0]      fifo_push;\n  logic [2:0]      fifo_pop;\n  logic [2:0]      fifo_empty;\n  logic [2:0]      fifo_full;\n  logic [7:0]      fifo_dout [0:2];\n  logic [7:0]      fifo_din;\n\n  genvar ch;\n  generate\n    for (ch = 0; ch < 3; ch++) begin : g_fifo\n      yapp_fifo #(.DEPTH(16), .WIDTH(8)) u_fifo (\n        .clock (clock),\n        .reset (reset),\n        .push  (fifo_push[ch]),\n        .din   (fifo_din),\n        .pop   (fifo_pop[ch]),\n        .dout  (fifo_dout[ch]),\n        .empty (fifo_empty[ch]),\n        .full  (fifo_full[ch])\n      );\n    end\n  endgenerate","description":"","docs":[{"title":"RTL block guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e8","e9","e19","e20","e21"],"end_line":214,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut#fifos","kind":"rtl_block","kind_label":"RTL block","lab":"6","line":193,"name":"3 x yapp_fifo (16 x 8)","parent":"hw_top.dut","scope":"hw","signals":[{"kind":"variable","line":193,"name":"fifo_push","type":"logic[2:0]"},{"kind":"variable","line":194,"name":"fifo_pop","type":"logic[2:0]"},{"kind":"variable","line":195,"name":"fifo_empty","type":"logic[2:0]"},{"kind":"variable","line":196,"name":"fifo_full","type":"logic[2:0]"},{"kind":"variable","line":197,"name":"fifo_dout","type":"logic[7:0]$[0:2]"},{"kind":"variable","line":198,"name":"fifo_din","type":"logic[7:0]"}],"summary":"One FIFO per output channel, instantiated in the g_fifo generate loop.","type":"yapp_router"},"hw_top.dut#input_fsm":{"children":[],"code":"  typedef enum logic [1:0] {IDLE, PAYLOAD, PARITY} state_e;\n\n  state_e     state;\n  logic [1:0] cur_addr;      // address of the packet being received\n  logic [5:0] cur_len;       // payload length of the packet being received\n  logic [5:0] byte_cnt;      // payload bytes accepted so far\n  logic [7:0] parity_acc;    // running XOR of header + payload\n  logic       cur_drop;      // packet will not be forwarded\n  logic       cur_oversized;\n  logic       cur_enabled;   // router_en was set when the header arrived\n\n  // Header decode (valid while state == IDLE and in_data_vld == 1)\n  wire [1:0] hdr_addr   = in_data[1:0];\n  wire [5:0] hdr_len    = in_data[7:2];\n  wire       hdr_ovs    = (hdr_len > maxpktsize);\n  wire       hdr_drop   = !router_en || hdr_ovs || (hdr_addr == 2'd3);\n\n  // Target FIFO is full -> ask the driver to hold the current byte.\n  // Dropped packets are consumed without FIFO space, so never suspended.\n  always_comb begin\n    case (state)\n      IDLE:    in_suspend = in_data_vld && !hdr_drop && fifo_full[hdr_addr];\n      default: in_suspend = !cur_drop && fifo_full[cur_addr];\n    endcase\n  end\n\n  // A byte is accepted whenever the DUT is not suspending the input\n  wire accept = !in_suspend;\n\n  // FIFO push control\n  always_comb begin\n    fifo_push = 3'b000;\n    fifo_din  = in_data;\n    case (state)\n      IDLE:    if (in_data_vld && accept && !hdr_drop) fifo_push[hdr_addr] = 1'b1;\n      PAYLOAD: if (in_data_vld && accept && !cur_drop) fifo_push[cur_addr] = 1'b1;\n      PARITY:  if (accept && !cur_drop)                fifo_push[cur_addr] = 1'b1;\n      default: ;\n    endcase\n  end\n\n  // Error pulse scheduling: free-running counter picks a 1..10 cycle delay\n  logic [3:0] rnd_cnt;\n  logic [3:0] err_timer;\n  wire  [3:0] err_delay = (rnd_cnt % 4'd10) + 4'd1;\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset)\n      rnd_cnt <= 4'd0;\n    else\n      rnd_cnt <= rnd_cnt + 4'd1;\n  end\n\n  // Main FSM\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset) begin\n      state         <= IDLE;\n      cur_addr      <= 2'd0;\n      cur_len       <= 6'd0;\n      byte_cnt      <= 6'd0;\n      parity_acc    <= 8'd0;\n      cur_drop      <= 1'b0;\n      cur_oversized <= 1'b0;\n      cur_enabled   <= 1'b0;\n      err_timer     <= 4'd0;\n      error         <= 1'b0;\n      parity_err_cnt_reg    <= 8'd0;\n      oversized_pkt_cnt_reg <= 8'd0;\n      addr3_cnt_reg         <= 8'd0;\n      addr0_cnt_reg         <= 8'd0;\n      addr1_cnt_reg         <= 8'd0;\n      addr2_cnt_reg         <= 8'd0;\n      mem_size_reg          <= 8'd0;\n    end else begin\n      // ---- error pulse generator ----\n      error <= 1'b0;\n      if (err_timer != 4'd0) begin\n        err_timer <= err_timer - 4'd1;\n        if (err_timer == 4'd1)\n          error <= 1'b1;\n      end\n\n      case (state)\n        //------------------------------------------------------------------\n        IDLE: begin\n          if (in_data_vld && accept) begin\n            cur_addr      <= hdr_addr;\n            cur_len       <= hdr_len;\n            byte_cnt      <= 6'd0;\n            parity_acc    <= in_data;\n            cur_drop      <= hdr_drop;\n            cur_oversized <= hdr_ovs;\n            cur_enabled   <= router_en;\n            if (router_en)\n              yapp_pkt_mem[0] <= in_data;\n            state <= PAYLOAD;\n          end\n        end\n        //------------------------------------------------------------------\n        PAYLOAD: begin\n          if (in_data_vld && accept) begin\n            parity_acc <= parity_acc ^ in_data;\n            if (cur_enabled)\n              yapp_pkt_mem[byte_cnt + 6'd1] <= in_data;\n            byte_cnt <= byte_cnt + 6'd1;\n            if (byte_cnt + 6'd1 == cur_len)\n              state <= PARITY;\n          end\n        end\n        //------------------------------------------------------------------\n        PARITY: begin\n          if (accept) begin\n            state <= IDLE;\n            if (cur_enabled) begin\n              mem_size_reg <= {2'b00, cur_len};\n              // counters\n              if (in_data != parity_acc) begin\n                if (parity_err_cnt_en) parity_err_cnt_reg <= parity_err_cnt_reg + 8'd1;\n                err_timer <= err_delay;\n              end\n              if (cur_oversized && oversized_pkt_cnt_en)\n                oversized_pkt_cnt_reg <= oversized_pkt_cnt_reg + 8'd1;\n              case (cur_addr)\n                2'd0: if (addr0_cnt_en) addr0_cnt_reg <= addr0_cnt_reg + 8'd1;\n                2'd1: if (addr1_cnt_en) addr1_cnt_reg <= addr1_cnt_reg + 8'd1;\n                2'd2: if (addr2_cnt_en) addr2_cnt_reg <= addr2_cnt_reg + 8'd1;\n                2'd3: if (addr3_cnt_en) addr3_cnt_reg <= addr3_cnt_reg + 8'd1;\n              endcase\n              if (cur_drop)\n                $display(\"%0t ROUTER DROPS PACKET addr=%0d length=%0d (%s)\", $time,\n                         cur_addr, cur_len,\n                         (cur_addr == 2'd3) ? \"illegal address\" : \"length > maxpktsize\");\n            end else begin\n              $display(\"%0t ROUTER DROPS PACKET addr=%0d length=%0d (router disabled)\",\n                       $time, cur_addr, cur_len);\n            end\n          end\n        end\n        //------------------------------------------------------------------\n        default: state <= IDLE;\n      endcase\n    end\n  end","description":"The header is latched in IDLE (`cur_addr`, `cur_len`, `cur_drop`). Bytes are pushed into\nFIFO[addr] while `in_data_vld && !in_suspend`. In PARITY the accumulated XOR is compared\nwith the parity byte; counters, mem_size_reg and yapp_pkt_mem are updated.\n","docs":[{"title":"RTL block guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e6","e7","e8","e13","e14","e15","e18"],"end_line":381,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut#input_fsm","kind":"rtl_block","kind_label":"RTL block","lab":"6","line":239,"name":"Input FSM","parent":"hw_top.dut","scope":"hw","signals":[{"kind":"variable","line":241,"name":"state","type":"yapp_router.state_e"},{"line":239,"name":"state_e","type":"enum{IDLE=2'd0,PAYLOAD=2'd1,PARITY=2'd2}yapp_router.state_e"},{"kind":"variable","line":242,"name":"cur_addr","type":"logic[1:0]"},{"kind":"variable","line":243,"name":"cur_len","type":"logic[5:0]"},{"kind":"variable","line":244,"name":"byte_cnt","type":"logic[5:0]"},{"kind":"variable","line":245,"name":"parity_acc","type":"logic[7:0]"},{"kind":"variable","line":246,"name":"cur_drop","type":"logic"},{"kind":"variable","line":247,"name":"cur_oversized","type":"logic"},{"kind":"variable","line":248,"name":"cur_enabled","type":"logic"},{"kind":"net","line":251,"name":"hdr_addr","type":"logic[1:0]"},{"kind":"net","line":252,"name":"hdr_len","type":"logic[5:0]"},{"kind":"net","line":253,"name":"hdr_ovs","type":"logic"},{"kind":"net","line":254,"name":"hdr_drop","type":"logic"},{"kind":"net","line":266,"name":"accept","type":"logic"}],"summary":"IDLE -> PAYLOAD -> PARITY: accepts the header, decides drop, pushes bytes, checks parity.","type":"yapp_router"},"hw_top.dut#memories":{"children":[],"code":"  logic [7:0] yapp_pkt_mem [0:63];\n  logic [7:0] yapp_mem     [0:255];","description":"","docs":[{"title":"RTL block guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e15","e17"],"end_line":166,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut#memories","kind":"rtl_block","kind_label":"RTL block","lab":"6","line":165,"name":"yapp_pkt_mem / yapp_mem","parent":"hw_top.dut","scope":"hw","signals":[{"kind":"variable","line":165,"name":"yapp_pkt_mem","type":"logic[7:0]$[0:63]"},{"kind":"variable","line":166,"name":"yapp_mem","type":"logic[7:0]$[0:255]"}],"summary":"64 bytes of the last packet (RO) and 256 bytes of scratch memory (RW).","type":"yapp_router"},"hw_top.dut#outputs":{"children":[],"code":"  // Channel output handshake\n  //   data_vld_x : FIFO has data, the head byte is on data_x\n  //   pop        : receiver released suspend_x while a byte was presented\n  //----------------------------------------------------------------------------\n  logic [2:0] suspend;\n  assign suspend = {suspend_2, suspend_1, suspend_0};\n\n  assign data_0     = fifo_dout[0];\n  assign data_1     = fifo_dout[1];\n  assign data_2     = fifo_dout[2];\n  assign data_vld_0 = !fifo_empty[0];\n  assign data_vld_1 = !fifo_empty[1];\n  assign data_vld_2 = !fifo_empty[2];\n\n  always_comb begin\n    for (int i = 0; i < 3; i++)\n      fifo_pop[i] = !fifo_empty[i] && !suspend[i];\n  end","description":"","docs":[{"title":"RTL block guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e9","e10","e11","e12"],"end_line":234,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut#outputs","kind":"rtl_block","kind_label":"RTL block","lab":"6","line":217,"name":"Output handshake x3","parent":"hw_top.dut","scope":"hw","signals":[{"kind":"variable","line":221,"name":"suspend","type":"logic[2:0]"}],"summary":"data_vld_x = !empty; the FIFO pops when the receiver has suspend_x low.","type":"yapp_router"},"hw_top.dut#regfile":{"children":[],"code":"  // HBUS host interface\n  //----------------------------------------------------------------------------\n  logic [7:0] hdata_out;\n  logic       hdata_oe;\n\n  assign hdata = hdata_oe ? hdata_out : 8'bz;\n\n  // Read mux (combinational, registered into hdata_out on the first read edge)\n  logic [7:0] rd_mux;\n  always_comb begin\n    rd_mux = 8'h00;\n    if (haddr >= ADDR_MEM_BASE && haddr <= ADDR_MEM_BASE + 16'h00ff) begin\n      rd_mux = yapp_mem[haddr[7:0]];\n`ifdef INJECT_ERROR\n      if (haddr[7:0] == 8'h2a) rd_mux[3] = ~rd_mux[3];\n`endif\n    end else if (haddr >= ADDR_PKT_MEM_BASE && haddr <= ADDR_PKT_MEM_BASE + 16'h003f) begin\n      rd_mux = yapp_pkt_mem[haddr[6:0] - 7'h10];   // 0x1010..0x104f -> 0..63\n    end else begin\n      case (haddr)\n        ADDR_CTRL_REG:   rd_mux = ctrl_reg;\n        ADDR_EN_REG:     rd_mux = en_reg;\n        ADDR_PARITY_ERR: rd_mux = parity_err_cnt_reg;\n        ADDR_OVERSIZED:  rd_mux = oversized_pkt_cnt_reg;\n        ADDR_ADDR3_CNT:  rd_mux = addr3_cnt_reg;\n        ADDR_ADDR0_CNT:  rd_mux = addr0_cnt_reg;\n        ADDR_ADDR1_CNT:  rd_mux = addr1_cnt_reg;\n        ADDR_ADDR2_CNT:  rd_mux = addr2_cnt_reg;\n        ADDR_MEM_SIZE:   rd_mux = mem_size_reg;\n        default:         rd_mux = 8'h00;\n      endcase\n    end\n  end\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset) begin\n      ctrl_reg  <= 8'h3f;\n      en_reg    <= 8'h01;\n      hdata_out <= 8'h00;\n      hdata_oe  <= 1'b0;\n    end else begin\n      // Read: capture on the first cycle, drive during the second\n      hdata_oe <= hen && !hwr_rd;\n      if (hen && !hwr_rd)\n        hdata_out <= rd_mux;\n\n      // Write: single cycle, RW locations only\n      if (hen && hwr_rd) begin\n        if (haddr >= ADDR_MEM_BASE && haddr <= ADDR_MEM_BASE + 16'h00ff)\n          yapp_mem[haddr[7:0]] <= hdata;\n        else case (haddr)\n          ADDR_CTRL_REG: ctrl_reg <= hdata;\n          ADDR_EN_REG:   en_reg   <= hdata;\n          default: ;   // read-only registers and memories ignore writes\n        endcase\n      end\n    end\n  end","description":"","docs":[{"title":"RTL block guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e14","e16","e17","e18"],"end_line":441,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut#regfile","kind":"rtl_block","kind_label":"RTL block","lab":"6","line":384,"name":"HBUS slave + registers","parent":"hw_top.dut","scope":"hw","signals":[{"kind":"variable","line":156,"name":"ctrl_reg","type":"logic[7:0]"},{"kind":"variable","line":157,"name":"en_reg","type":"logic[7:0]"},{"kind":"variable","line":158,"name":"parity_err_cnt_reg","type":"logic[7:0]"},{"kind":"variable","line":159,"name":"oversized_pkt_cnt_reg","type":"logic[7:0]"},{"kind":"variable","line":160,"name":"addr3_cnt_reg","type":"logic[7:0]"},{"kind":"variable","line":161,"name":"addr0_cnt_reg","type":"logic[7:0]"},{"kind":"variable","line":162,"name":"addr1_cnt_reg","type":"logic[7:0]"},{"kind":"variable","line":163,"name":"addr2_cnt_reg","type":"logic[7:0]"},{"kind":"variable","line":164,"name":"mem_size_reg","type":"logic[7:0]"},{"kind":"net","line":169,"name":"maxpktsize","type":"logic[5:0]"},{"kind":"net","line":170,"name":"router_en","type":"logic"},{"kind":"variable","line":386,"name":"hdata_out","type":"logic[7:0]"},{"kind":"variable","line":387,"name":"hdata_oe","type":"logic"},{"kind":"variable","line":392,"name":"rd_mux","type":"logic[7:0]"}],"summary":"1-cycle writes, 2-cycle reads with tri-state hdata; ctrl_reg, en_reg, counters, mem_size_reg.","type":"yapp_router"},"hw_top.dut.g_fifo[0].u_fifo":{"children":[],"code":"module yapp_fifo #(\n  parameter int DEPTH = 16,\n  parameter int WIDTH = 8\n) (\n  input  logic             clock,\n  input  logic             reset,\n  input  logic             push,\n  input  logic [WIDTH-1:0] din,\n  input  logic             pop,\n  output logic [WIDTH-1:0] dout,\n  output logic             empty,\n  output logic             full\n);\n  localparam int AW = $clog2(DEPTH);\n\n  logic [WIDTH-1:0] mem [0:DEPTH-1];\n  logic [AW-1:0]    wr_ptr, rd_ptr;\n  logic [AW:0]      count;\n\n  assign empty = (count == 0);\n  assign full  = (count == DEPTH);\n  assign dout  = mem[rd_ptr];\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset) begin\n      wr_ptr <= '0;\n      rd_ptr <= '0;\n      count  <= '0;\n    end else begin\n      if (push && !full) begin\n        mem[wr_ptr] <= din;\n        wr_ptr      <= wr_ptr + 1'b1;\n      end\n      if (pop && !empty)\n        rd_ptr <= rd_ptr + 1'b1;\n      case ({push && !full, pop && !empty})\n        2'b10:   count <= count + 1'b1;\n        2'b01:   count <= count - 1'b1;\n        default: count <= count;\n      endcase\n    end\n  end\nendmodule","description":"","docs":[{"title":"Module guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e19"],"end_line":121,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut.g_fifo[0].u_fifo","kind":"module","kind_label":"Module","lab":"6","line":79,"name":"g_fifo[0].u_fifo","params":[{"line":80,"name":"DEPTH","value":"16"},{"line":81,"name":"WIDTH","value":"8"},{"line":92,"name":"AW","value":"4"}],"parent":"hw_top.dut","ports":[{"dir":"in","line":83,"name":"clock","type":"logic"},{"dir":"in","line":84,"name":"reset","type":"logic"},{"dir":"in","line":85,"name":"push","type":"logic"},{"dir":"in","line":86,"name":"din","type":"logic[7:0]"},{"dir":"in","line":87,"name":"pop","type":"logic"},{"dir":"out","line":88,"name":"dout","type":"logic[7:0]"},{"dir":"out","line":89,"name":"empty","type":"logic"},{"dir":"out","line":90,"name":"full","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":94,"name":"mem","type":"logic[7:0]$[0:15]"},{"kind":"variable","line":95,"name":"wr_ptr","type":"logic[3:0]"},{"kind":"variable","line":95,"name":"rd_ptr","type":"logic[3:0]"},{"kind":"variable","line":96,"name":"count","type":"logic[4:0]"}],"summary":"Synchronous 16 x 8 FIFO: one per output channel.","type":"yapp_fifo"},"hw_top.dut.g_fifo[1].u_fifo":{"children":[],"code":"module yapp_fifo #(\n  parameter int DEPTH = 16,\n  parameter int WIDTH = 8\n) (\n  input  logic             clock,\n  input  logic             reset,\n  input  logic             push,\n  input  logic [WIDTH-1:0] din,\n  input  logic             pop,\n  output logic [WIDTH-1:0] dout,\n  output logic             empty,\n  output logic             full\n);\n  localparam int AW = $clog2(DEPTH);\n\n  logic [WIDTH-1:0] mem [0:DEPTH-1];\n  logic [AW-1:0]    wr_ptr, rd_ptr;\n  logic [AW:0]      count;\n\n  assign empty = (count == 0);\n  assign full  = (count == DEPTH);\n  assign dout  = mem[rd_ptr];\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset) begin\n      wr_ptr <= '0;\n      rd_ptr <= '0;\n      count  <= '0;\n    end else begin\n      if (push && !full) begin\n        mem[wr_ptr] <= din;\n        wr_ptr      <= wr_ptr + 1'b1;\n      end\n      if (pop && !empty)\n        rd_ptr <= rd_ptr + 1'b1;\n      case ({push && !full, pop && !empty})\n        2'b10:   count <= count + 1'b1;\n        2'b01:   count <= count - 1'b1;\n        default: count <= count;\n      endcase\n    end\n  end\nendmodule","description":"","docs":[{"title":"Module guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e20"],"end_line":121,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut.g_fifo[1].u_fifo","kind":"module","kind_label":"Module","lab":"6","line":79,"name":"g_fifo[1].u_fifo","params":[{"line":80,"name":"DEPTH","value":"16"},{"line":81,"name":"WIDTH","value":"8"},{"line":92,"name":"AW","value":"4"}],"parent":"hw_top.dut","ports":[{"dir":"in","line":83,"name":"clock","type":"logic"},{"dir":"in","line":84,"name":"reset","type":"logic"},{"dir":"in","line":85,"name":"push","type":"logic"},{"dir":"in","line":86,"name":"din","type":"logic[7:0]"},{"dir":"in","line":87,"name":"pop","type":"logic"},{"dir":"out","line":88,"name":"dout","type":"logic[7:0]"},{"dir":"out","line":89,"name":"empty","type":"logic"},{"dir":"out","line":90,"name":"full","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":94,"name":"mem","type":"logic[7:0]$[0:15]"},{"kind":"variable","line":95,"name":"wr_ptr","type":"logic[3:0]"},{"kind":"variable","line":95,"name":"rd_ptr","type":"logic[3:0]"},{"kind":"variable","line":96,"name":"count","type":"logic[4:0]"}],"summary":"Synchronous 16 x 8 FIFO: one per output channel.","type":"yapp_fifo"},"hw_top.dut.g_fifo[2].u_fifo":{"children":[],"code":"module yapp_fifo #(\n  parameter int DEPTH = 16,\n  parameter int WIDTH = 8\n) (\n  input  logic             clock,\n  input  logic             reset,\n  input  logic             push,\n  input  logic [WIDTH-1:0] din,\n  input  logic             pop,\n  output logic [WIDTH-1:0] dout,\n  output logic             empty,\n  output logic             full\n);\n  localparam int AW = $clog2(DEPTH);\n\n  logic [WIDTH-1:0] mem [0:DEPTH-1];\n  logic [AW-1:0]    wr_ptr, rd_ptr;\n  logic [AW:0]      count;\n\n  assign empty = (count == 0);\n  assign full  = (count == DEPTH);\n  assign dout  = mem[rd_ptr];\n\n  always_ff @(posedge clock or posedge reset) begin\n    if (reset) begin\n      wr_ptr <= '0;\n      rd_ptr <= '0;\n      count  <= '0;\n    end else begin\n      if (push && !full) begin\n        mem[wr_ptr] <= din;\n        wr_ptr      <= wr_ptr + 1'b1;\n      end\n      if (pop && !empty)\n        rd_ptr <= rd_ptr + 1'b1;\n      case ({push && !full, pop && !empty})\n        2'b10:   count <= count + 1'b1;\n        2'b01:   count <= count - 1'b1;\n        default: count <= count;\n      endcase\n    end\n  end\nendmodule","description":"","docs":[{"title":"Module guide","url":"dut/rtl.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e21"],"end_line":121,"file":"router_rtl/yapp_router.sv","id":"hw_top.dut.g_fifo[2].u_fifo","kind":"module","kind_label":"Module","lab":"6","line":79,"name":"g_fifo[2].u_fifo","params":[{"line":80,"name":"DEPTH","value":"16"},{"line":81,"name":"WIDTH","value":"8"},{"line":92,"name":"AW","value":"4"}],"parent":"hw_top.dut","ports":[{"dir":"in","line":83,"name":"clock","type":"logic"},{"dir":"in","line":84,"name":"reset","type":"logic"},{"dir":"in","line":85,"name":"push","type":"logic"},{"dir":"in","line":86,"name":"din","type":"logic[7:0]"},{"dir":"in","line":87,"name":"pop","type":"logic"},{"dir":"out","line":88,"name":"dout","type":"logic[7:0]"},{"dir":"out","line":89,"name":"empty","type":"logic"},{"dir":"out","line":90,"name":"full","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":94,"name":"mem","type":"logic[7:0]$[0:15]"},{"kind":"variable","line":95,"name":"wr_ptr","type":"logic[3:0]"},{"kind":"variable","line":95,"name":"rd_ptr","type":"logic[3:0]"},{"kind":"variable","line":96,"name":"count","type":"logic[4:0]"}],"summary":"Synchronous 16 x 8 FIFO: one per output channel.","type":"yapp_fifo"},"hw_top.hbus0":{"children":[],"code":"interface hbus_if (input logic clock, input logic reset);\n\n  logic [15:0] haddr;\n  logic        hen;\n  logic        hwr_rd;\n  logic [7:0]  hdata;      // master's output value\n  logic        hdata_oe;   // master output enable\n  wire  [7:0]  hdata_w;    // the shared bus -- connect THIS to the DUT\n\n  assign hdata_w = hdata_oe ? hdata : 8'bz;\n\n  //--------------------------------------------------------------------------\n  // Master driver side\n  //--------------------------------------------------------------------------\n  task automatic hbus_reset();\n    @(negedge clock);\n    haddr    <= 16'h0000;\n    hen      <= 1'b0;\n    hwr_rd   <= 1'b0;\n    hdata    <= 8'h00;\n    hdata_oe <= 1'b0;\n  endtask : hbus_reset\n\n  task automatic hbus_write(input bit [15:0] addr, input bit [7:0] data);\n    @(negedge clock);\n    haddr    <= addr;\n    hdata    <= data;\n    hdata_oe <= 1'b1;\n    hen      <= 1'b1;\n    hwr_rd   <= 1'b1;\n    @(negedge clock);          // DUT wrote the register on the rising edge\n    hen      <= 1'b0;\n    hwr_rd   <= 1'b0;\n    hdata_oe <= 1'b0;\n  endtask : hbus_write\n\n  task automatic hbus_read(input bit [15:0] addr, output bit [7:0] data);\n    @(negedge clock);\n    haddr    <= addr;\n    hdata_oe <= 1'b0;          // bus belongs to the DUT during a read\n    hen      <= 1'b1;\n    hwr_rd   <= 1'b0;\n    @(negedge clock);          // cycle 1 done: DUT sampled haddr\n    @(negedge clock);          // cycle 2: DUT is driving hdata_w\n    data = hdata_w;\n    hen  <= 1'b0;\n  endtask : hbus_read\n\n  //--------------------------------------------------------------------------\n  // Monitor side: sample on the rising edge\n  //--------------------------------------------------------------------------\n  task automatic collect_transaction(output bit [15:0] addr,\n                                     output bit [7:0]  data,\n                                     output bit        is_write);\n    do @(posedge clock); while (!hen);\n    addr     = haddr;\n    is_write = hwr_rd;\n    if (is_write) begin\n      data = hdata_w;\n    end else begin\n      @(posedge clock);        // second read cycle: DUT drives the data\n      data = hdata_w;\n    end\n    // Wait for hen to drop so one transaction is not collected twice\n    while (hen) @(posedge clock);\n  endtask : collect_transaction\n\nendinterface : hbus_if","description":"","docs":[{"title":"Interface guide","url":"components/driver.md"},{"title":"Lab 7 — Integrating UVCs","url":"labs/lab07.md"}],"edges":["e16","e24","e30","e39","e79","e80"],"end_line":85,"file":"hbus/sv/hbus_if.sv","id":"hw_top.hbus0","kind":"interface","kind_label":"Interface","lab":"7","line":18,"name":"hbus0","params":[],"parent":"hw_top","ports":[{"dir":"in","line":18,"name":"clock","type":"logic"},{"dir":"in","line":18,"name":"reset","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":20,"name":"haddr","type":"logic[15:0]"},{"kind":"variable","line":21,"name":"hen","type":"logic"},{"kind":"variable","line":22,"name":"hwr_rd","type":"logic"},{"kind":"variable","line":23,"name":"hdata","type":"logic[7:0]"},{"kind":"variable","line":24,"name":"hdata_oe","type":"logic"},{"kind":"net","line":25,"name":"hdata_w","type":"logic[7:0]"}],"summary":"hbus_if: haddr / hen / hwr_rd and the bidirectional hdata (DUT connects to the wire hdata_w).","tasks":[{"args":[],"end_line":39,"kind":"task","line":32,"name":"hbus_reset"},{"args":["addr","data"],"end_line":52,"kind":"task","line":41,"name":"hbus_write"},{"args":["addr","data"],"end_line":64,"kind":"task","line":54,"name":"hbus_read"},{"args":["addr","data","is_write"],"end_line":83,"kind":"task","line":69,"name":"collect_transaction"}],"type":"hbus_if"},"hw_top.in0":{"children":[],"code":"interface yapp_if (input logic clock, input logic reset);\n\n  logic [7:0] in_data;\n  logic       in_data_vld;\n  logic       in_suspend;\n\n  //--------------------------------------------------------------------------\n  // Driver side\n  //--------------------------------------------------------------------------\n  task automatic yapp_reset();\n    @(negedge clock);\n    in_data     <= 8'h00;\n    in_data_vld <= 1'b0;\n  endtask : yapp_reset\n\n  // Hold the current byte until the DUT has accepted it (in_suspend low on a\n  // falling edge means the byte was taken at the preceding rising edge).\n  task automatic wait_accept();\n    @(negedge clock);\n    while (in_suspend) @(negedge clock);\n  endtask : wait_accept\n\n  task automatic send_to_dut(input bit [1:0] addr,\n                             input bit [5:0] length,\n                             input bit [7:0] payload[],\n                             input bit [7:0] parity,\n                             input int       packet_delay);\n    // Inter-packet gap\n    repeat (packet_delay) @(negedge clock);\n\n    // Header: {length, addr} together with in_data_vld\n    @(negedge clock);\n    in_data_vld <= 1'b1;\n    in_data     <= {length, addr};\n\n    // Payload, one byte per accepted cycle\n    foreach (payload[i]) begin\n      wait_accept();\n      in_data <= payload[i];\n    end\n\n    // Parity with in_data_vld low\n    wait_accept();\n    in_data_vld <= 1'b0;\n    in_data     <= parity;\n\n    // Make sure the parity byte was accepted before returning to idle\n    wait_accept();\n    in_data <= 8'h00;\n  endtask : send_to_dut\n\n  //--------------------------------------------------------------------------\n  // Monitor side: sample on the RISING edge. A byte is accepted by the DUT\n  // when it is not suspending the input at that edge.\n  //--------------------------------------------------------------------------\n  task automatic collect_packets(output bit [1:0] addr,\n                                 output bit [5:0] length,\n                                 output bit [7:0] payload[],\n                                 output bit [7:0] parity);\n    // Wait for an accepted header\n    do @(posedge clock); while (!(in_data_vld && !in_suspend));\n    length = in_data[7:2];\n    addr   = in_data[1:0];\n    payload = new[length];\n\n    // Payload bytes\n    for (int i = 0; i < length; i++) begin\n      do @(posedge clock); while (!(in_data_vld && !in_suspend));\n      payload[i] = in_data;\n    end\n\n    // Parity byte: first accepted cycle after the payload\n    do @(posedge clock); while (in_suspend);\n    parity = in_data;\n  endtask : collect_packets\n\nendinterface : yapp_if","description":"","docs":[{"title":"Interface guide","url":"components/driver.md"},{"title":"Lab 6 — Virtual interfaces and the DUT","url":"labs/lab06.md"}],"edges":["e6","e7","e23","e29","e35","e71","e72"],"end_line":96,"file":"yapp/sv/yapp_if.sv","id":"hw_top.in0","kind":"interface","kind_label":"Interface","lab":"6","line":20,"name":"in0","params":[],"parent":"hw_top","ports":[{"dir":"in","line":20,"name":"clock","type":"logic"},{"dir":"in","line":20,"name":"reset","type":"logic"}],"scope":"hw","signals":[{"kind":"variable","line":22,"name":"in_data","type":"logic[7:0]"},{"kind":"variable","line":23,"name":"in_data_vld","type":"logic"},{"kind":"variable","line":24,"name":"in_sus
